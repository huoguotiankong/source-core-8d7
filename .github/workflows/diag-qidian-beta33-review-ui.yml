name: diag-qidian-beta33-review-ui
on:
  push:
    paths: ['.staging/diag-qidian-beta33-review-ui.trigger']
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Dump review UI focus
        run: |
          python3 - <<'PY'
          import json,gzip,base64,re
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json')
          a=json.loads(p.read_text()); s=a[0] if isinstance(a,list) else a
          lib=s['jsLib']; mk='var QF_MOD38_PACK='; x=lib.index(mk)+len(mk); y=lib.index(';\nvar QF_MOD38_EXPORTS=',x); pack=json.loads(lib[x:y])
          def dec(v):
            if not isinstance(v,str): return ''
            if not v.startswith('gz:'): return v
            z=v[3:]; z += '='*((4-len(z)%4)%4)
            return gzip.decompress(base64.b64decode(z)).decode()
          pats=['收起回复','加载更多回复','点赞','like','thumb','reply','楼','回复','评论','card','width','position:absolute','right:']
          out=[]
          for k,v in pack.items():
            code=dec(v)
            hits=[]
            for pat in pats:
              for m in re.finditer(re.escape(pat),code,re.I): hits.append(m.start())
            if not hits: continue
            hits=sorted(set(hits))
            out.append('### '+k+' LEN '+str(len(code))+' HITS '+str(len(hits)))
            spans=[]
            for i in hits: spans.append([max(0,i-1400),min(len(code),i+3200)])
            spans.sort(); merged=[]
            for st,en in spans:
              if not merged or st>merged[-1][1]+300: merged.append([st,en])
              else: merged[-1][1]=max(merged[-1][1],en)
            for st,en in merged[:12]: out.append(code[st:en])
          Path('.staging/qidian-beta33-review-ui.txt').write_text('\n\n'.join(out)[:150000])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-beta33-review-ui.txt
          git commit -m 'chore: dump qidian review UI focus'
          git push origin main
