name: extract-qidian-copyright-module
on:
  push:
    paths:
      - '.staging/qidian-copyright-module.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract copyright module
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          from pathlib import Path
          arr=json.loads(Path('sources/novel/qidian-next/qidian-next.json').read_text(encoding='utf-8'))
          s=arr[0] if isinstance(arr,list) else arr
          js=str(s.get('jsLib',''))
          m=re.search(r'var\s+QF_MOD38_PACK\s*=\s*(\{.*?\});',js,re.S)
          if not m: raise SystemExit('pack not found')
          pack=json.loads(m.group(1))
          raw=pack['copyright']
          if raw.startswith('gz:'): raw=raw[3:]
          code=gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          Path('.staging/qidian-copyright-module.js').write_text(code,encoding='utf-8')
          print('len',len(code))
          PY
      - name: Commit extract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .staging/qidian-copyright-module.js
          git commit -m 'chore: extract qidian copyright module' || exit 0
          git push
