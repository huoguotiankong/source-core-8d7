name: diag-qidian-beta-limited-qw-content
on:
  push:
    paths:
      - '.staging/diag-qidian-beta-limited-qw-content.trigger'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract qfQwContentV44
        run: |
          python3 - <<'PY'
          import json,gzip,base64,re
          p=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'))[0]
          js=p['jsLib']; start=js.find('{',js.find('QF_MOD38_PACK=')); pack,_=json.JSONDecoder().raw_decode(js[start:]); v=pack['limited_qw']; raw=v.split(':',1)[1] if ':' in v[:12] else v; raw+='='*((4-len(raw)%4)%4); t=gzip.decompress(base64.urlsafe_b64decode(raw)).decode()
          i=t.find('function qfQwContentV44');
          open('.staging/qidian-beta-limited-qw-content.txt','w',encoding='utf-8').write(t[max(0,i-1200):i+5000])
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .staging/qidian-beta-limited-qw-content.txt
          git commit -m 'diag: extract beta qingwu content function'
          git push origin HEAD:main
