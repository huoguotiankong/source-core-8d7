name: patch-qidian-beta30-copyright-label
on:
  push:
    paths:
      - '.staging/patch-qidian-beta30-copyright-label.trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch copyright label and metadata
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json')
          src=json.loads(p.read_text())
          raw=json.dumps(src,ensure_ascii=False)
          # UI semantic correction only: displayed date is first-publish time, not listing time.
          if '上架' not in raw:
              raise SystemExit('copyright label 上架 not found')
          raw2=raw.replace('上架','首发')
          src=json.loads(raw2)
          src['bookSourceComment']='v1.1.0-beta30：版权信息页语义修正。版权卡片中的日期实际为作品首发时间，因此将“上架”标签改为“首发”；不再将该日期描述为上架时间。角色卡继续沿用 beta29 性能回退版本，其它域冻结。'
          p.write_text(json.dumps(src,ensure_ascii=False,indent=2)+'\n')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          # metadata
          mp=Path('manifest.json'); m=json.loads(mp.read_text()); m['updatedAt']='2026-08-29T13:55:00+08:00'
          for x in m.get('sources',[]):
              if x.get('id')=='qidian-next-beta':
                  x.update(version='1.1.0-beta30',versionCode=11030,updatedAt='2026-08-29T13:55:00+08:00',sourceUrl='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11030',summary='版权信息页 beta30：日期标签由“上架”修正为“首发”，与实际数据语义一致。',sha256=sha)
                  x['tags']=['起点','测试版','版权信息','首发时间','语义修正','角色卡性能回退']
                  x['changelog']=['版权信息页日期标签“上架”改为“首发”','该日期按作品首发时间展示，不再误称上架时间','角色卡保持 beta29 性能回退状态','书友圈、正文、目录、评论、Provider 与其它域冻结']
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          sp=Path('subscription/beta.json'); s=json.loads(sp.read_text()); s['updatedAt']='2026-08-29T13:55:00+08:00'; s['generatedAt']='2026-08-29T13:55:00+08:00'
          for x in s.get('items',[]):
              if x.get('id')=='qidian-next-beta':
                  x.update(version='1.1.0-beta30',updatedAt='2026-08-29',summary='版权信息页 beta30：日期标签由“上架”修正为“首发”，与实际数据语义一致。',sourceUrl='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11030',backupUrl='https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v=11030',importUrl='legado://import/importonline?src=https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11030')
                  x['tags']=['起点','测试版','版权信息','首发时间','语义修正','角色卡性能回退']
                  x['changelog']=['版权信息页日期标签“上架”改为“首发”','该日期按作品首发时间展示，不再误称上架时间','角色卡保持 beta29 性能回退状态','书友圈、正文、目录、评论、Provider 与其它域冻结']
          sp.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          bp=Path('bundles/all-beta.json'); b=json.loads(bp.read_text())
          # bundle structure may embed full source or metadata; replace qidian-next beta object when identifiable
          def walk(o):
              if isinstance(o,dict):
                  if o.get('bookSourceUrl')==src.get('bookSourceUrl') and ('bookSourceName' in o):
                      o.clear(); o.update(src); return
                  for v in list(o.values()): walk(v)
              elif isinstance(o,list):
                  for v in o: walk(v)
          walk(b); bp.write_text(json.dumps(b,ensure_ascii=False,indent=2)+'\n')
          rp=Path('docs/RELEASE_LOG.md'); old=rp.read_text()
          head='''## 2026-08-29 · 🌈 起点增强 1.1.0-beta30\n\n- 通道：Beta / 测试版，等待真机确认；Stable 1.1.0 不变。\n- 版权信息：卡片日期字段实际按作品首发时间展示，因此标签由“上架”修正为“首发”。\n- 数据原则：不再把无法可靠取得的上架时间与首发时间混用；本版只修正显示语义，不增加额外请求。\n- 性能：角色卡继续保持 beta29 的 beta25 role 模块回退状态，不恢复 Relationship 扫描。\n- 冻结：书友圈、正文、目录、评论、Provider 与其它域不改。\n\n'''
          rp.write_text(head+old)
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          import json
          s=json.load(open('sources/novel/qidian-next/qidian-next-beta.json'))
          raw=json.dumps(s,ensure_ascii=False)
          assert '首发' in raw
          assert '1.1.0-beta30' in s.get('bookSourceComment','')
          m=json.load(open('manifest.json'))
          q=[x for x in m['sources'] if x.get('id')=='qidian-next-beta'][0]
          assert q['version']=='1.1.0-beta30' and q['versionCode']==11030
          sub=json.load(open('subscription/beta.json'))
          q=[x for x in sub['items'] if x.get('id')=='qidian-next-beta'][0]
          assert q['version']=='1.1.0-beta30'
          json.load(open('bundles/all-beta.json'))
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m 'release(qidian): publish beta30 copyright first-publish label'
          git push origin HEAD:main
