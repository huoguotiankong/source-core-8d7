name: patch-qidian-beta39-qw-resolver-no-account-v6
on:
  push:
    paths: ['.staging/patch-qidian-beta39-qw-resolver-no-account-v6.trigger']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Publish Beta39 v6
        run: |
          python3 - <<'PY'
          import json,gzip,base64,hashlib,re
          from pathlib import Path

          SRC=Path('sources/novel/qidian-next/qidian-next-beta.json')
          STABLE=Path('sources/novel/qidian-next/qidian-next.json')
          arr=json.loads(SRC.read_text())
          s=arr[0] if isinstance(arr,list) else arr
          stable_hash=hashlib.sha256(STABLE.read_bytes()).hexdigest()

          lib=s['jsLib']
          mk='var QF_MOD38_PACK='
          a=lib.index(mk)+len(mk)
          b=lib.index(';\nvar QF_MOD38_EXPORTS=',a)
          pack=json.loads(lib[a:b])
          def enc(code):
              return 'gz:'+base64.b64encode(gzip.compress(code.encode(),mtime=0)).decode().rstrip('=')

          # Reuse the already reviewed Beta39 no-login/multi-match 情无 runtime.
          wf=Path('.github/workflows/patch-qidian-beta39-qw-resolver-no-account.yml').read_text()
          mm=re.search(r"code=r'''(.*?)'''",wf,re.S)
          assert mm, 'cannot extract reviewed beta39 limited_qw implementation'
          lines=mm.group(1).strip('\n').splitlines()
          ind=min([len(x)-len(x.lstrip()) for x in lines if x.strip()] or [0])
          code='\n'.join(x[ind:] if len(x)>=ind else x for x in lines)
          for needle in ['qfQwResolveChapterV39','free-no-login','https://full.hnxianxin.cn/qd','所有接口算法来自于','免费看七天请求无限制']:
              assert needle in code, 'missing limited_qw marker: '+needle
          pack['limited_qw']=enc(code)
          lib=lib[:a]+json.dumps(pack,ensure_ascii=False,separators=(',',':'))+lib[b:]

          # Remove 情无 from account-management functions only.
          # Keep all content-provider routing/selection names untouched.
          def patch_function(src,name):
              marker='function '+name
              start=src.rfind(marker)
              if start<0:
                  return src,False
              brace=src.find('{',start)
              if brace<0:
                  return src,False
              depth=0; quote=None; esc=False; end=None
              for k in range(brace,len(src)):
                  ch=src[k]
                  if quote is not None:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch==quote: quote=None
                      continue
                  if ch in "'\"`": quote=ch; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:
                          end=k+1; break
              if end is None:
                  return src,False
              fn=src[start:end]
              old=fn
              fn=re.sub(r'([\[,])\s*["\']情无["\']\s*,',r'\1',fn)
              fn=re.sub(r',\s*["\']情无["\']\s*([\]])',r'\1',fn)
              return src[:start]+fn+src[end:], fn!=old

          changed=[]
          account_funcs=['qfProviderNamesV283','qfMultiAccountsV423','qfMultiAccountsV422','qfMultiAccountsV421','qfMultiAccountsV420']
          for fname in account_funcs:
              lib,ch=patch_function(lib,fname)
              if ch: changed.append('jsLib:'+fname)

          login=str(s.get('loginUrl','') or '')
          for fname in account_funcs:
              login,ch=patch_function(login,fname)
              if ch: changed.append('loginUrl:'+fname)
          s['loginUrl']=login
          assert changed, 'no effective account-management function containing 情无 was patched'

          # Guard: content runtime still contains the new 情无 module and source URL.
          assert 'limited_qw' in pack
          assert 'https://full.hnxianxin.cn/qd' in code

          s['jsLib']=lib
          s['bookSourceComment']='v1.1.0-beta39：修复新情无章节匹配并移除情无账号登录。情无继续使用“小雨的世界”免费正文来源，无账号/Token要求；章节由ID、标题、章节号和索引多级匹配后取得来源时间戳；保留两段推广尾注净化。账号管理不再显示情无，正文设置中的情无 Provider 保留。其它域沿用 beta38。'
          SRC.write_text(json.dumps(arr,ensure_ascii=False,indent=2))
          assert hashlib.sha256(STABLE.read_bytes()).hexdigest()==stable_hash, 'stable changed unexpectedly'

          VERSION='1.1.0-beta39'; VC=11039; DATE='2026-09-11'; TS='2026-09-11T07:45:00+08:00'
          summary='Beta39：修复新情无章节时间戳匹配；情无改为完全免登录并从账号管理移除。'
          tags=['起点','测试版','限免源','情无','免登录','章节匹配','小雨来源','评论页']
          changes=[
              '情无继续使用 full.hnxianxin.cn/qd 免费正文链，不要求账号、Token 或会话',
              '章节解析升级为 chapterId→标题→章节号→索引多级匹配，修复“未从新来源目录解析到章节时间戳”',
              '账号管理移除情无入口；正文 Provider 名称和限免路由仍保留情无',
              '继续默认过滤来源附带的两段推广尾注；Beta37 评论点赞结构修复及其它域不变'
          ]
          raw=f'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}'
          backup=f'https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}'
          imp='legado://import/importonline?src='+raw
          detail='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/details/beta/qidian-next.json'
          sha=hashlib.sha256(SRC.read_bytes()).hexdigest()

          mp=Path('manifest.json')
          m=json.loads(mp.read_text()); m['updatedAt']=TS
          found=False
          for i,e in enumerate(m.get('sources',[])):
              if e.get('id')=='qidian-next-beta':
                  ne=dict(e)
                  ne.update({'name':'🌈 起点增强 · Beta','category':'novel','channel':'beta','version':VERSION,'versionCode':VC,'updatedAt':TS,'sourcePath':'sources/novel/qidian-next/qidian-next-beta.json','sourceUrl':raw,'bookSourceUrl':'https://m.qidian.com/?qf_source=qidian_next_8d7','summary':summary,'tags':tags,'changelog':changes,'sha256':sha})
                  m['sources'][i]=ne; found=True; break
          assert found, 'manifest beta entry missing'
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2))

          def update_sub(path,itype=False):
              p=Path(path); j=json.loads(p.read_text()); j['updatedAt']=TS; j['generatedAt']=TS
              target=None
              for i,e in enumerate(j.get('items',[])):
                  if e.get('id')=='qidian-next-beta': target=i; break
              base=dict(j['items'][target]) if target is not None else {}
              base.update({'id':'qidian-next-beta','name':'🌈 起点增强 · Beta','summary':summary,'icon':base.get('icon',''),'channel':'beta','version':VERSION,'updatedAt':DATE,'tags':tags,'changelog':changes,'sourceUrl':raw,'backupUrl':backup,'importUrl':imp,'detailUrl':detail,'versionCode':VC})
              if itype: base['type']='novel'
              if target is None: j.setdefault('items',[]).append(base)
              else: j['items'][target]=base
              p.write_text(json.dumps(j,ensure_ascii=False,indent=2))
          update_sub('subscription/beta.json',False)
          update_sub('subscription/novel.json',True)

          dp=Path('rss/data/details/beta/qidian-next.json')
          dp.write_text(json.dumps({'kind':'source','title':'🌈 起点增强 · Beta','summary':summary,'badges':['Beta',VERSION,'情无免登录'],'sections':[{'title':'本版更新','text':'修复新情无按起点 chapterId 直接查找导致部分章节拿不到 time 的问题，改为多级章节匹配。'},{'title':'情无账号','text':'新情无来源默认免费使用，不需要账号登录；账号管理已移除情无入口，正文限免源仍保留情无。'},{'title':'正文净化','text':'继续默认移除来源正文末尾的接口算法链接与闲鱼推广两段文字。'},{'title':'版本状态','text':'Beta / 测试通道，等待真机确认。'}],'sourceUrl':raw,'backupUrl':backup,'importUrl':imp},ensure_ascii=False,indent=2))

          bund=Path('bundles/all-beta.json')
          ba=json.loads(bund.read_text()); src_obj=arr[0] if isinstance(arr,list) else arr
          if not isinstance(ba,list): ba=[]
          hit=False
          for i,o in enumerate(ba):
              if isinstance(o,dict) and o.get('bookSourceUrl')==src_obj.get('bookSourceUrl'):
                  ba[i]=src_obj; hit=True; break
          if not hit: ba.append(src_obj)
          dedup={}; order=[]
          for o in ba:
              if not isinstance(o,dict): continue
              k=str(o.get('bookSourceUrl') or o.get('bookSourceName') or len(order))
              if k not in dedup: order.append(k)
              dedup[k]=o
          bund.write_text(json.dumps([dedup[k] for k in order],ensure_ascii=False,indent=2))

          rp=Path('docs/RELEASE_LOG.md')
          old=rp.read_text()
          head='## 2026-09-11 · 起点增强 1.1.0-beta39 — 新情无章节匹配 / 免登录\n\n- Stable 保持 1.1.0 不变。\n- 新情无继续使用附件“小雨的世界”的 `full.hnxianxin.cn/qd` 免费正文链，不要求账号、Token 或会话。\n- 修复 Beta38 仅按当前起点 chapterId 查目录导致部分章节取不到时间戳：改为 ID、标题、章节号、索引多级匹配。\n- 账号管理移除情无入口；正文设置、Provider Registry 与限免路由中的“情无”名称继续保留。\n- 两段来源推广尾注继续默认过滤；Beta37 评论点赞结构和其它业务域冻结。\n- 状态：Beta，等待真机确认。\n\n'
          if not old.startswith('## 2026-09-11 · 起点增强 1.1.0-beta39'):
              rp.write_text(head+old)

          hp=Path('docs/sources/qidian-next/PROJECT_HANDOFF.md')
          h=hp.read_text()
          hhead='## 2026-09-11 · Current Beta 1.1.0-beta39 — 情无免登录 / 章节匹配修复\n\n- Stable remains 1.1.0.\n- 情无 keeps its public/provider name but uses the user attachment 小雨的世界 free content backend. No account/token is required and 情无 is removed from Account Management.\n- Chapter resolution now uses ID/title/chapter-number/index fallbacks before requesting content.php; source promo footer cleanup remains enabled.\n- Awaiting real-device verification.\n\n'
          if not h.startswith('## 2026-09-11 · Current Beta 1.1.0-beta39'):
              hp.write_text(hhead+h)

          print('account patches:', ', '.join(changed))
          print('beta sha256:', sha)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md
          git commit -m 'fix: publish qidian-next beta39 qingwu no-account v6'
          git push origin main
