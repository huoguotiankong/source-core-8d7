name: run-qidian-detail-beta1104
on:
  push:
    branches: [main]
    paths:
      - '.staging/run-qidian-detail-beta1104.trigger'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish beta4
        run: python scripts/publish_qidian_detail_beta1104.py
      - name: Validate JSON and JavaScript
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          paths=['sources/novel/qidian-next/qidian-next-beta.json','sources/novel/qidian-next/qidian-next.json','subscription/beta.json','bundles/all-beta.json','manifest.json','rss/data/details/beta/qidian-next.json']
          for p in paths: json.loads(Path(p).read_text(encoding='utf-8'))
          stable=hashlib.sha256(Path(paths[1]).read_bytes()).hexdigest()
          assert stable=='d64937b9dc4e528795d3818834a6ddab1828df1af84bb483b16961a40d8286ec'
          s=json.loads(Path(paths[0]).read_text(encoding='utf-8'))[0]
          assert s['bookSourceUrl']=='https://m.qidian.com/?qf_source=qidian_next_8d7'
          assert 'v1.1.0-beta4' in s['bookSourceComment']
          init=s['ruleBookInfo']['init'];intro=s['ruleBookInfo']['intro']
          assert init.count('qfAjaxTextV20(this,pcUrl')==1
          assert init.count('qdParseBookInfo.call(this,pcHtml,pcUrl)')==1
          assert 'qfHumanMetaV1104' in init and 'qfVisibleTagsV1104' in init
          assert ':50001' not in intro
          assert "listScalar(html,['BookTags'" not in init and "listScalar(html,['HonorList'" not in init
          for bad in ['qfAtomPost','QidianTu','TuShuJun']: assert bad not in init
          full=Path(paths[0]).read_text(encoding='utf-8')
          for marker in ['X-Content-Token','VIP正文已验证']: assert marker in full
          def unwrap(v):
              x=v[4:] if v.startswith('@js:') else v
              # Legado rule strings in this source may have a trailing <js> marker in some versions.
              if x.endswith('<js>'): x=x[:-4]
              return x
          Path('/tmp/init.js').write_text(unwrap(init),encoding='utf-8')
          Path('/tmp/intro.js').write_text(unwrap(intro),encoding='utf-8')
          print('json gates ok',len(init),len(intro),stable)
          PY
          node --check /tmp/init.js
          node --check /tmp/intro.js
      - name: Commit beta4
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json subscription/beta.json bundles/all-beta.json manifest.json rss/data/details/beta/qidian-next.json docs/sources/qidian-next/PROJECT_HANDOFF.md docs/RELEASE_LOG.md docs/KNOWN_ISSUES.md
          git commit -m 'fix: balance qidian detail richness beta1104'
          git push origin main
