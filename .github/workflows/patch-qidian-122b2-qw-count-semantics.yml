name: Patch Qidian 1.2.2-Beta2 QW Count Semantics
on:
  push:
    branches: [ main ]
    paths:
      - '.staging/run-qidian-122b2-qw-count-semantics.trigger'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: patch-qidian-122b2-qw-count-semantics
  cancel-in-progress: false
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build Beta2
        run: python .staging/patch_qidian_122b2_qw_count_semantics.py
      - name: Sanity checks
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          stable=Path('sources/novel/qidian-next/qidian-next.json')
          beta=Path('sources/novel/qidian-next/qidian-next-beta.json')
          assert hashlib.sha256(stable.read_bytes()).hexdigest()=='1ee474c209b48d069344ffa4409379a0d39012cbaf2acecbd5ffcaba5404ab7e'
          a=json.loads(beta.read_text()); s=a[0] if isinstance(a,list) else a; js=s['jsLib']
          assert 'v1.2.2-beta2' in s.get('bookSourceComment','')
          assert 'var cnt=tc>0?tc:cc;' in js
          assert 'target=pid-1+fix' in js
          assert 'qfQwBubbleV1214(ctx,cnt,bid,cid,pid)' in js
          assert 'x.__qfCount||x.TextCount||x.textCount||x.CommentCount' in js
          n=json.loads(Path('subscription/novel.json').read_text())
          assert any(x.get('id')=='qidian-next-beta' and x.get('version')=='1.2.2-beta2' for x in n['items'])
          print('sanity ok')
          PY
      - name: Commit Beta2 publication
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'qidian beta: 1.2.2-beta2 restore qingwu TextCount bubbles'
          git push origin HEAD:main
