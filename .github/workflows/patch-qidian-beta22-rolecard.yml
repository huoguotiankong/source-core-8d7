          '<div class="info"><div class="tabs"><button class="tabBtn on" data-tab="star">星耀守护</button><button class="tabBtn" data-tab="profile">角色档案</button></div>'+
            '<div class="tabPane starPane on"><div class="stats"><div><span>守护排名</span><b>'+v(s.rank||'—')+'</b></div><div><span>星耀值</span><b>'+v(s.value||'—')+'</b></div><div><span>等级</span><b>'+v(s.level||'—')+'</b></div></div>'+prog+
              (s.guardians?'<div class="guardians">已有 <b>'+v(s.guardians)+'</b> 位读者守护</div>':'')+
              (!hasStar?'<div class="officialEmpty">该角色当前未返回可用的官方星耀数据</div>':'')+
              '<div class="ruleTitle">星耀互动</div><div class="ruleGrid"><span>♡ 比心</span><span>♢ 送礼</span><span>🏷 标签</span><span>✦ 大事记</span></div><div class="ruleHint">互动入口仅作角色卡信息分区；数值只展示官方接口实际返回的数据。</div></div>'+
