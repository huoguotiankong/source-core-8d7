h(e){}}function bindInfo(){var ins=document.querySelectorAll(".info");for(var n=0;n<ins.length;n++){(function(inf){if(inf.__qfBound)return;inf.__qfBound=1;var sx=0,sy=0,ss0=0,dx=0,dy=0,axis="";inf.addEventListener("touchstart",function(e){lock();var t=e.touches[0];sx=t.clientX;sy=t.clientY;ss0=inf.scrollTop;dx=0;dy=0;axis="";if(e.cancelable)e.preventDefault();e.stopPropagation()},{passive:false});inf.addEventListener("touchmove",function(e){var t=e.touches[0];dx=t.clientX-sx;dy=t.clientY-sy;var ax=Math.abs(dx),ay=Math.abs(dy);if(!axis&&(ax>6||ay>6))axis=(ax>ay*1.22)?"x":"y";if(axis!=="x"){var max=Math.max(0,inf.scrollHeight-inf.clientHeight),next=ss0-dy;if(next<0)next=0;if(next>max)next=max;inf.scrollTop=next}if(e.cancelable)e.preventDefault();e.stopPropagation()},{passive:false});inf.addEventListener("touchend",function(e){if(axis==="x"&&Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.22)go(i+(dx<0?1:-1));if(e.cancelable)e.preventDefault();e.stopPropagation();axis=""},{passive:false})})(ins[n])}}bindInfo();var x0=0,y0=0,t0=0,startInfo=false,moved=false;vp.addEventListener("touchstart",function(e){lock();var t=e.touches[0];x0=t.clientX;y0=t.clientY;t0=Date.now();moved=false;startInfo=!!(e.target&&e.target.closest&&e.target.closest(".info"))},{passive:true});vp.addEventListener("touchmove",function(e){var t=e.touches[0];if(Math.abs(t.clientX-x0)>8||Math.abs(t.clientY-y0)>8)moved=true},{passive:true});vp.addEventListener("touchend",function(e){var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;if(startInfo)return;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.35&&Date.now()-t0<1200){go(i+(dx<0?1:-1));return}var c=ss[i]&&ss[i].querySelector(".card");if(c&&!moved&&Math.abs(dx)<13&&Math.abs(dy)<13){var u=c.getAttribute("data-bg");if(u){fi.src=u;m.classList.add("show")}}},{passive:true});if(p){p.onclick=function(e){var t=e.target&&e.target.closest?e.target.closest("[data-i]"):null;if(!t)return;var n=Number(t.getAttribute("data-i"));if(isFinite(n))go(n)}}document.getE