        var img=v(r.image||cover),imgAttr=i===0?('src="'+img+'" loading="eager" fetchpriority="high"'):('src="'+v(cover)+'" data-src="'+img+'" loading="lazy" fetchpriority="low"');
        var desc=String(r.desc||'');if(desc==='角色太过神秘还没有简介')desc='';
