name: patch-qidian-beta22-rolecard
on:
  workflow_dispatch:
  push:
    paths:
      - '.staging/patch-qidian-beta22-rolecard.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch beta22 rolecard
        run: python .staging/patch-qidian-beta22-rolecard.py
      - name: Validate and publish
        run: |
          git diff --check
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json
          git commit -m "feat(qidian): redesign rolecard beta22"
          git push origin main
