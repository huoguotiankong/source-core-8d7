name: run-qidian-next-qw-beta1
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-qidian-next-qw-beta1.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate qidian-next beta1
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(sha256sum sources/novel/qidian-next/qidian-next.json | awk '{print $1}')
          test "$BEFORE" = "d64937b9dc4e528795d3818834a6ddab1828df1af84bb483b16961a40d8286ec"
          python scripts/patch_qidian_next_qw_1_0_1_beta1.py
          AFTER=$(sha256sum sources/novel/qidian-next/qidian-next.json | awk '{print $1}')
          test "$AFTER" = "$BEFORE"
          python - <<'PY'
          import json,gzip,base64,pathlib
          p=pathlib.Path('sources/novel/qidian-next/qidian-next-beta.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(d,list) and len(d)==1
          s=d[0]
          assert s['bookSourceName']=='🌈 起点增强 · Beta'
          assert s['bookSourceUrl']=='https://m.qidian.com/?qf_source=qidian_next_8d7'
          assert 'v1.0.1-beta1' in s['bookSourceComment']
          js=s['jsLib']; m='var QF_MOD38_PACK='; a=js.index(m)+len(m); b=js.index(';\nvar QF_MOD38_EXPORTS',a)
          pack=json.loads(js[a:b]); mod=gzip.decompress(base64.b64decode(pack['limited_qw'][3:])).decode('utf-8')
          assert 'Referer":b+"/ranking.html"' in mod
          assert 'if(qfQwAuthLikeV317(r.obj,r.raw))' in mod
          assert 'if(isPaid||qfQwAuthLikeV317(r.obj,r.raw))' not in mod
          assert 'qf_qw_vip_verified_v101' in mod
          assert 'qfQwNativeSessionLabelV101' in s['loginUrl']
          json.loads(pathlib.Path('subscription/beta.json').read_text(encoding='utf-8'))
          json.loads(pathlib.Path('bundles/all-beta.json').read_text(encoding='utf-8'))
          json.loads(pathlib.Path('manifest.json').read_text(encoding='utf-8'))
          json.loads(pathlib.Path('rss/data/details/beta/qidian-next.json').read_text(encoding='utf-8'))
          print('static checks passed')
          PY
      - name: Commit beta distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json bundles/all-beta.json subscription/beta.json manifest.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/KNOWN_ISSUES.md docs/sources/qidian-next/PROJECT_HANDOFF.md
          git diff --cached -- sources/novel/qidian-next/qidian-next.json | grep -q '^$' || { echo 'Stable file unexpectedly staged'; exit 1; }
          git commit -m 'fix: qidian enhanced beta1 qingwu VIP auth chain'
          git push origin main
