name: patch-qidian-125b1-copyright-ui
on:
  push:
    paths:
      - '.staging/qidian-125b1-copyright-ui.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build qidian-next 1.2.5-beta1
        run: python .staging/patch_qidian_125b1_copyright_ui.py
      - name: Commit generated Beta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md .staging/qidian-125b1-report.json
          git commit -m 'qidian beta: 1.2.5-beta1 copyright page redesign' || exit 0
          git push
