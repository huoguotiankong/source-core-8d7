name: Patch Qidian 1.2.2-Beta1 QW Paragraph Reviews
on:
  push:
    branches: [ main ]
    paths:
      - '.staging/run-qidian-122b1-qw-paragraphs.trigger'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: patch-qidian-122b1-qw-paragraphs
  cancel-in-progress: false
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build isolated beta
        run: python .staging/patch_qidian_122b1_qw_paragraphs.py
      - name: Sanity checks
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          stable=Path('sources/novel/qidian-next/qidian-next.json')
          beta=Path('sources/novel/qidian-next/qidian-next-beta.json')
          assert hashlib.sha256(stable.read_bytes()).hexdigest()=='1ee474c209b48d069344ffa4409379a0d39012cbaf2acecbd5ffcaba5404ab7e'
          x=json.loads(beta.read_text());s=x[0] if isinstance(x,list) else x
          js=s['jsLib']
          assert 'ParagraphId=-1 只用于诊断' in js
          assert "target=pid-1+fix" in js
          assert "qfQwBubbleV1214(ctx,cnt,bid,cid,pid)" in js
          assert "titleBubble:localTitleBubble||''" in js
          assert 'v1.2.2-beta1' in s.get('bookSourceComment','')
          print('sanity ok',len(beta.read_bytes()))
          PY
      - name: Commit beta publication
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'qidian beta: 1.2.2-beta1 fix qingwu paragraph mapping'
          git push origin HEAD:main
