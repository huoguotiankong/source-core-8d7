name: publish-qidian-next
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-qidian-next.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build and publish qidian-next beta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, base64, zlib, hashlib
          from datetime import datetime, timezone, timedelta

          ROOT=pathlib.Path('.')
          base_path=ROOT/'sources/novel/qidian/qidian-official.json'
          base_data=json.loads(base_path.read_text(encoding='utf-8'))
          assert isinstance(base_data,list) and len(base_data)==1
          base=base_data[0]

          UI_Z=''
          LOGIN_SUFFIX_Z=''

          login_ui=zlib.decompress(base64.b64decode(UI_Z)).decode('utf-8')
          login_suffix=zlib.decompress(base64.b64decode(LOGIN_SUFFIX_Z)).decode('utf-8')
          assert hashlib.sha256(login_ui.encode()).hexdigest()=='7c1ea451af7bc41c3dcca2ddc8c1d18f89b7f07d24b3d96493c13cb760c3930e'
          assert hashlib.sha256(login_suffix.encode()).hexdigest()=='7d71310081c4486e3bf24dd2614000184a144df701743c12a1f69bc05246041e'

          src=dict(base)
          source_id='qidian-next'
          source_name='🌈 起点助手·新架构'
          version='0.1.0-beta1'
          version_code=1001
          identity='https://m.qidian.com/?qf_source=qidian_next_8d7'
          src['bookSourceName']=source_name
          src['bookSourceGroup']='﹅♚2、测试源'
          src['bookSourceUrl']=identity
          src['bookSourceComment']='v0.1.0-beta1：起点全新主线首个仓库测试版。以 v4.2.1-alpha2 的官方搜索/详情/目录/评论与多正文 Provider 能力作为功能基线；登录设置采用已真机验证的静态双列首页 + java.startBrowserAwait 多级设置页。后续从该主线逐模块重构和精简，旧起点官方生态源继续独立保留。'
          src['loginUi']=login_ui
          src['loginUrl']=str(base.get('loginUrl') or '').rstrip()+login_suffix

          # Regression invariants: only source metadata + login UI/login helper are changed from the functional baseline.
          changed=[k for k in set(base)|set(src) if base.get(k)!=src.get(k)]
          allowed={'bookSourceName','bookSourceGroup','bookSourceUrl','bookSourceComment','loginUi','loginUrl'}
          assert set(changed)==allowed, changed
          assert src.get('jsLib')==base.get('jsLib')
          assert src.get('ruleSearch')==base.get('ruleSearch')
          assert src.get('ruleBookInfo')==base.get('ruleBookInfo')
          assert src.get('ruleToc')==base.get('ruleToc')
          assert src.get('ruleContent')==base.get('ruleContent')
          parsed_ui=json.loads(src['loginUi'])
          assert isinstance(parsed_ui,list) and len(parsed_ui)==10
          assert not src['loginUi'].lstrip().startswith('@js:')
          assert 'java.startBrowserAwait' in src['loginUrl']

          target=ROOT/'sources/novel/qidian-next/qidian-next.json'
          target.parent.mkdir(parents=True,exist_ok=True)
          payload=[src]
          raw=json.dumps(payload,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          target.write_bytes(raw)
          final_sha=hashlib.sha256(raw).hexdigest()

          now_dt=datetime.now(timezone(timedelta(hours=8)))
          now=now_dt.isoformat(timespec='seconds')
          day=now_dt.date().isoformat()
          raw_url='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next.json'
          backup='https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next.json'
          detail_url='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/details/qidian-next.json'
          summary='起点全新架构主线：官方搜索/目录/评论体系 + 多正文 Provider；登录设置使用静态双列首页与多级设置页。'
          tags=['起点','新架构','静态登录UI','多级设置','官方目录','段评','STV','多正文 Provider']
          changes=[
              '建立独立于旧起点官方生态的全新开发主线',
              '采用已真机验证的 loginfix4 双列静态登录首页',
              '二级设置页使用 java.startBrowserAwait，规避动态 @js: loginUi 兼容问题',
              '首版业务能力保持 v4.2.1-alpha2 基线，避免同时改动其它稳定模块',
              '使用独立起点同源永久身份，后续 Beta/Stable 保持不变'
          ]

          # Beta bundle: keep existing beta sources and append/replace this independent source.
          bp=ROOT/'bundles/all-beta.json'
          bundle=json.loads(bp.read_text(encoding='utf-8')) if bp.exists() else []
          if not isinstance(bundle,list): bundle=[]
          bundle=[x for x in bundle if x.get('bookSourceUrl')!=identity and x.get('bookSourceName')!=source_name]
          bundle.append(src)
          bp.write_text(json.dumps(bundle,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          # Beta subscription.
          sp=ROOT/'subscription/beta.json'
          sub=json.loads(sp.read_text(encoding='utf-8'))
          sub['updatedAt']=now
          items=sub.setdefault('items',[])
          items[:]=[x for x in items if x.get('id')!=source_id]
          items.append({
              'id':source_id,'name':source_name,'summary':summary,'icon':str(src.get('bookSourceIcon') or ''),
              'channel':'beta','version':version,'updatedAt':day,'tags':tags,'changelog':changes,
              'sourceUrl':raw_url,'backupUrl':backup,
              'importUrl':'legado://import/importonline?src='+raw_url,'detailUrl':detail_url
          })
          sp.write_text(json.dumps(sub,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # RSS detail payload.
          dp=ROOT/'rss/data/details/qidian-next.json'
          dp.parent.mkdir(parents=True,exist_ok=True)
          detail={
              'kind':'source','title':source_name,'summary':summary,
              'badges':['Beta',version,'小说','新架构'],
              'sections':[
                  {'title':'定位','text':'这是独立于旧“起点官方生态”的全新开发主线。旧源继续保留，用于对照与回退。'},
                  {'title':'登录设置架构','text':'一级页使用纯静态 loginUi，主功能采用双列宫格；正文、评论、账号、界面、诊断等二级页通过 java.startBrowserAwait 打开。'},
                  {'title':'功能基线','text':'首版暂时继承 v4.2.1-alpha2 的官方搜索、详情、目录、免费/VIP 正文、多 Provider、段评、本章说、作者说、角色卡、彩蛋与书友圈能力。'},
                  {'title':'测试重点','text':'优先验证登录首页、各二级设置页、设置保存、搜索、书籍详情、目录和正文；发现问题后继续在本新主线上优化。'},
                  {'title':'发布状态','text':'Beta / 测试通道。未经过完整真机回归，不进入 Stable。'},
                  {'title':'唯一身份','text':identity}
              ],
              'sourceUrl':raw_url,'backupUrl':backup
          }
          dp.write_text(json.dumps(detail,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Manifest.
          mp=ROOT/'manifest.json'
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          manifest['updatedAt']=now
          marr=manifest.setdefault('sources',[])
          marr[:]=[x for x in marr if x.get('id')!=source_id]
          marr.append({
              'id':source_id,'name':source_name,'category':'novel','channel':'beta',
              'version':version,'versionCode':version_code,'updatedAt':now,
              'sourcePath':'sources/novel/qidian-next/qidian-next.json','sourceUrl':raw_url,
              'bookSourceUrl':identity,'summary':summary,'tags':tags,'changelog':changes,
              'sha256':final_sha
          })
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # New-source handoff.
          hp=ROOT/'docs/sources/qidian-next/PROJECT_HANDOFF.md'
          hp.parent.mkdir(parents=True,exist_ok=True)
          hp.write_text(f'''# Qidian Next PROJECT HANDOFF\n\n> Updated: {day}\n\n## Current line\n\n- Repository id: `qidian-next`\n- Display name: `{source_name}`\n- Channel: Beta/Test\n- Current version: `{version}`\n- Source path: `sources/novel/qidian-next/qidian-next.json`\n- Permanent Legado identity: `{identity}`\n- SHA256: `{final_sha}`\n\n## Baseline\n\nThe first version intentionally keeps the existing v4.2.1-alpha2 business rules as a functional baseline. Only source identity/metadata and the login/settings architecture differ. This protects search, detail, catalog, content, review and Provider behavior while the new line is established.\n\n## Login/settings architecture\n\nUser real-device testing established that the current Legado environment can open static `loginUi`, while the large dynamic `@js:` login UI path fails before the page is shown. The new line therefore uses:\n\n- pure static first-level `loginUi`;\n- two-column main navigation;\n- `java.startBrowserAwait` HTML secondary settings pages;\n- settings written back to existing login-info keys so runtime business logic stays compatible.\n\n## Real-device status\n\nConfirmed before repository publication:\n\n- static login page opens;\n- settings can be changed;\n- two-column loginfix4 layout was selected by the user as the new-source UI baseline.\n\nStill requires regression testing after repository import:\n\n- secondary settings pages and persistence;\n- search and book detail;\n- catalog;\n- free/VIP content;\n- comments and author-say;\n- Provider switching, including STV.\n\n## Development rule\n\nContinue new work on this independent source line. Do not overwrite the old `qidian-official` source by default. Promote to Stable only after explicit user real-device confirmation.\n''',encoding='utf-8')

          # Known issue / compatibility rule.
          kp=ROOT/'docs/KNOWN_ISSUES.md'
          known=kp.read_text(encoding='utf-8')
          marker='## 13. Large dynamic Qidian `loginUi` fails before rendering in current Legado build'
          if marker not in known:
              known=known.rstrip()+f'''\n\n{marker}\n\nObserved during v4.2.1-alpha2 recovery testing:\n\n- search remained functional;\n- a minimal static login UI opened normally;\n- the original large dynamic `@js:` login UI, a reduced dynamic version, and a try/catch diagnostic wrapper all failed before any page content appeared.\n\nConfirmed compatible direction:\n\n- use pure static `loginUi` for the first-level settings page;\n- use `java.startBrowserAwait` for multi-level HTML settings pages;\n- keep business runtime logic in existing `jsLib/loginUrl` helpers instead of evaluating a large dynamic login UI at page-open time.\n\nStatus: adopted by `qidian-next` {version}; further real-device regression testing pending.\n'''
              kp.write_text(known+'\n',encoding='utf-8')

          # Project plan note for the new independent mainline.
          pp=ROOT/'docs/PROJECT_PLAN.md'
          plan=pp.read_text(encoding='utf-8')
          pmarker='## 11. Qidian next-generation source line'
          if pmarker not in plan:
              plan=plan.rstrip()+f'''\n\n{pmarker}\n\nA new independent source line `qidian-next` was started on {day} at the user's request.\n\n- First Beta: `{version}`.\n- UI baseline: user-selected loginfix4 two-column static login page plus `java.startBrowserAwait` multi-level settings.\n- Functional baseline: current v4.2.1-alpha2 Qidian official ecosystem business rules.\n- Goal: continue future Qidian refactoring/optimization on the new line without destabilizing the old `qidian-official` source.\n- Release policy: Beta until full user real-device confirmation.\n'''
              pp.write_text(plan+'\n',encoding='utf-8')

          # Release log.
          rp=ROOT/'docs/RELEASE_LOG.md'
          log=rp.read_text(encoding='utf-8')
          rmarker='## 2026-08-25 — Qidian Next v0.1.0-beta1'
          if rmarker not in log:
              block=f'''{rmarker}\n\nStatus: Beta/Test; published to the subscription repository, awaiting full user real-device regression.\n\nChanges:\n\n- Started independent source line `qidian-next` / `{source_name}` instead of overwriting the existing Qidian source.\n- Used the user-selected loginfix4 static two-column login page as the first UI baseline.\n- Kept the v4.2.1-alpha2 search/detail/catalog/content/review/Provider business baseline unchanged.\n- Secondary settings use `java.startBrowserAwait`; large dynamic `@js:` login UI is no longer used.\n- Published complete source JSON, Beta catalog entry, Beta bundle entry, Manifest metadata, RSS detail payload and source handoff.\n- Permanent identity: `{identity}`.\n- SHA256: `{final_sha}`.\n\n'''
              lines=log.splitlines(True)
              log=(lines[0]+'\n'+block+''.join(lines[1:])) if lines and lines[0].startswith('# RELEASE LOG') else block+log
              rp.write_text(log,encoding='utf-8')

          print('published',source_name,version,'bytes',len(raw),'sha256',final_sha)
          print('bundle-count',len(bundle),'subscription-count',len(items),'manifest-count',len(marr))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next.json bundles/all-beta.json subscription/beta.json rss/data/details/qidian-next.json manifest.json docs/sources/qidian-next/PROJECT_HANDOFF.md docs/KNOWN_ISSUES.md docs/PROJECT_PLAN.md docs/RELEASE_LOG.md
          git commit -m 'feat: publish Qidian next architecture beta'
          git push origin main
