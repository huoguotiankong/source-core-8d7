name: diag-qidian-124
on:
  push:
    paths:
      - '.staging/diag-qidian-124.trigger'
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect stable TOC and local comment implementation
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,base64,gzip
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next.json')
          src=json.loads(p.read_text(encoding='utf-8'))[0]
          out=[]
          out.append('COMMENT='+src.get('bookSourceComment','')[:1200])
          out.append('\nRULE_TOC_START\n'+json.dumps(src.get('ruleToc',{}),ensure_ascii=False,indent=2)[:30000]+'\nRULE_TOC_END')
          js=src.get('jsLib','')
          m=re.search(r'var\s+QF_MOD38_PACK\s*=\s*(\{.*?\});\s*var\s+QF_MOD38_EXPORTS',js,re.S)
          if not m: raise SystemExit('QF_MOD38_PACK not found')
          pack=json.loads(m.group(1))
          def dec(v):
            raw=v.split(':',1)[1] if ':' in v[:12] else v
            data=base64.b64decode(raw+'='*((4-len(raw)%4)%4),altchars=b'-_')
            try:return gzip.decompress(data).decode()
            except:return data.decode()
          pats=['getparagraphscomments','pageSize','pz=','pz:',"'pz'",'TitleInfoList','TitleImage','IpLocation','AudioUrl','ImageDetail','ReviewCount','Floor','loadMore','updateTime','wordCount','WordCount','chapterWordCount',' W ','\\"W\\"']
          for name in sorted(pack):
            if name not in ['review_local_ui','review','review_common','catalog','toc','core','qidian_app']: continue
            text=dec(pack[name]); out.append('\nMODULE '+name+' LEN '+str(len(text)))
            funs=re.findall(r'function\s+([A-Za-z0-9_$]+)\s*\(',text,re.I)
            out.append('FUNCTIONS '+','.join(funs[:120]))
            for pat in pats:
              hits=[x.start() for x in re.finditer(re.escape(pat),text,re.I)]
              if not hits: continue
              out.append('PAT '+pat+' COUNT '+str(len(hits)))
              for i in hits[:8]: out.append('CTX '+repr(text[max(0,i-700):i+1700]))
          Path('.staging/diag-qidian-124-output.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit diagnostic output
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/diag-qidian-124-output.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: qidian 1.2.4 stable diagnostic output'
          git push origin HEAD:main
