name: Promote qidian-next 1.2.2 Stable
on:
  push:
    branches: [main]
    paths: ['.github/workflows/promote-qidian-next-122-stable.yml']
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Promote verified beta5
        shell: python
        run: |
          import copy
          import hashlib
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          R = Path('.')
          SRC_BETA = R / 'sources/novel/qidian-next/qidian-next-beta.json'
          SRC_STABLE = R / 'sources/novel/qidian-next/qidian-next.json'
          VERSION = '1.2.2'
          VERSION_CODE = 12020
          BETA_VERSION = '1.2.2-beta5'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def dump(path, obj):
              Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def first_source(obj):
              return obj[0] if isinstance(obj, list) else obj

          def set_source_meta(src):
              src['bookSourceName'] = '🌈 起点增强'
              src['bookSourceComment'] = (
                  'v1.2.2 Stable：由已真机确认的 1.2.2-beta5 直接晋升。'
                  '保留 1.2.2-beta4 功能链与本地本章说卡片主题统一：近白浅灰卡片、浅灰边框、'
                  '珊瑚红标签及统一中性灰阶；评论总数、两条真实评论预览、点赞/回复统计和点击进入本章说逻辑不变。'
                  '本次晋升不新增业务逻辑。'
              )
              for k in ('version', 'sourceVersion'):
                  if k in src:
                      src[k] = VERSION
              for k in ('versionCode', 'sourceVersionCode'):
                  if k in src:
                      src[k] = VERSION_CODE
              return src

          def catalog_item(now, sha, old=None):
              raw = f'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next.json?v={VERSION_CODE}'
              cdn = f'https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next.json?v={VERSION_CODE}'
              item = copy.deepcopy(old or {})
              tags = [x for x in item.get('tags', []) if x not in ('测试版', 'Beta')]
              for x in ('起点', '正式版', '本地段评', '本章说', '评论页', 'UI统一', '珊瑚红'):
                  if x not in tags:
                      tags.append(x)
              item.update({
                  'id': 'qidian-next',
                  'name': '🌈 起点增强',
                  'summary': '正式版 1.2.2：由真机确认的 1.2.2-beta5 直接晋升；本地本章说卡片视觉统一，沿用已验证功能链，不新增业务逻辑。',
                  'channel': 'stable',
                  'version': VERSION,
                  'updatedAt': now,
                  'tags': tags,
                  'changelog': [
                      '由用户真机确认的 1.2.2-beta5 直接晋升 Stable，不新增业务逻辑',
                      '本章说卡片统一为近白浅灰背景、浅灰边框与珊瑚红标签',
                      '昵称、正文、点赞与回复统一中性灰阶',
                      '评论总数、两条真实评论预览、点赞/回复统计及点击进入本章说逻辑保持不变',
                      '沿用 1.2.2-beta4 功能链，情无/小雨服务器段评链及正文、目录、搜索、账号等模块不改'
                  ],
                  'sourceUrl': raw,
                  'backupUrl': cdn,
                  'importUrl': 'legado://import/importonline?src=' + raw,
                  'detailUrl': 'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/details/stable/qidian-next.json',
                  'versionCode': VERSION_CODE,
                  'sha256': sha,
                  'sourcePath': str(SRC_STABLE),
              })
              return item

          def upsert_items(path, stable_item, remove_beta=True):
              data = load(path)
              items = data.get('items', []) if isinstance(data, dict) else data
              out = []
              inserted = False
              for x in items:
                  if not isinstance(x, dict):
                      out.append(x)
                      continue
                  if x.get('id') == 'qidian-next-beta' and remove_beta:
                      continue
                  if x.get('id') == 'qidian-next':
                      if not inserted:
                          out.append(copy.deepcopy(stable_item))
                          inserted = True
                      continue
                  out.append(x)
              if not inserted:
                  out.insert(0, copy.deepcopy(stable_item))
              if isinstance(data, dict):
                  data['items'] = out
                  return data
              return out

          def remove_item(path, item_id, now):
              data = load(path)
              if isinstance(data, dict):
                  data['items'] = [x for x in data.get('items', []) if not (isinstance(x, dict) and x.get('id') == item_id)]
                  if 'updatedAt' in data:
                      data['updatedAt'] = now
                  if 'generatedAt' in data:
                      data['generatedAt'] = now
              elif isinstance(data, list):
                  data = [x for x in data if not (isinstance(x, dict) and x.get('id') == item_id)]
              dump(path, data)

          def rewrite_manifest(obj, stable_item):
              if isinstance(obj, list):
                  out = []
                  seen = False
                  for x in obj:
                      if isinstance(x, dict) and x.get('id') == 'qidian-next-beta':
                          continue
                      if isinstance(x, dict) and x.get('id') == 'qidian-next':
                          if not seen:
                              out.append(copy.deepcopy(stable_item))
                              seen = True
                          continue
                      out.append(rewrite_manifest(x, stable_item))
                  return out
              if isinstance(obj, dict):
                  return {k: rewrite_manifest(v, stable_item) for k, v in obj.items()}
              return obj

          def bundle_replace(obj, identity, stable_src, remove=False):
              if isinstance(obj, list):
                  out = []
                  inserted = False
                  for x in obj:
                      if isinstance(x, dict) and x.get('bookSourceUrl') == identity:
                          if not remove and not inserted:
                              out.append(copy.deepcopy(stable_src))
                              inserted = True
                          continue
                      out.append(bundle_replace(x, identity, stable_src, remove))
                  if not remove and not inserted and all(not isinstance(x, (list, dict)) for x in obj):
                      pass
                  return out
              if isinstance(obj, dict):
                  return {k: bundle_replace(v, identity, stable_src, remove) for k, v in obj.items()}
              return obj

          beta_obj = load(SRC_BETA)
          beta_src = first_source(beta_obj)
          if '起点增强' not in str(beta_src.get('bookSourceName', '')):
              raise SystemExit('unexpected beta source')
          if BETA_VERSION not in str(beta_src.get('bookSourceComment', '')):
              raise SystemExit('expected verified 1.2.2-beta5 baseline')
          identity = beta_src.get('bookSourceUrl')
          if not identity:
              raise SystemExit('missing bookSourceUrl')

          stable_obj = copy.deepcopy(beta_obj)
          stable_src = first_source(stable_obj)
          set_source_meta(stable_src)
          dump(SRC_STABLE, stable_obj)

          sha = hashlib.sha256(SRC_STABLE.read_bytes()).hexdigest()
          now = datetime.now(timezone(timedelta(hours=8))).replace(microsecond=0).isoformat()
          day = now[:10]

          current_stable = load('subscription/stable.json')
          current_items = current_stable.get('items', []) if isinstance(current_stable, dict) else current_stable
          old_stable = next((x for x in current_items if isinstance(x, dict) and x.get('id') == 'qidian-next'), {})
          item = catalog_item(now, sha, old_stable)

          stable_catalog = upsert_items('subscription/stable.json', item, remove_beta=True)
          if isinstance(stable_catalog, dict):
              if 'updatedAt' in stable_catalog:
                  stable_catalog['updatedAt'] = now
              if 'generatedAt' in stable_catalog:
                  stable_catalog['generatedAt'] = now
          dump('subscription/stable.json', stable_catalog)

          remove_item('subscription/beta.json', 'qidian-next-beta', now)

          novel = upsert_items('subscription/novel.json', item, remove_beta=True)
          if isinstance(novel, dict):
              if 'updatedAt' in novel:
                  novel['updatedAt'] = now
              if 'generatedAt' in novel:
                  novel['generatedAt'] = now
          dump('subscription/novel.json', novel)

          manifest = rewrite_manifest(load('manifest.json'), item)
          if isinstance(manifest, dict):
              if 'updatedAt' in manifest:
                  manifest['updatedAt'] = now
              if 'generatedAt' in manifest:
                  manifest['generatedAt'] = now
          dump('manifest.json', manifest)

          bs = load('bundles/all-stable.json')
          bs2 = bundle_replace(bs, identity, stable_src, remove=False)
          # Stable bundle currently contains the identity, so replacement must have happened exactly in-place.
          def count_identity(o):
              if isinstance(o, list):
                  return sum(count_identity(x) for x in o)
              if isinstance(o, dict):
                  return (1 if o.get('bookSourceUrl') == identity else 0) + sum(count_identity(v) for v in o.values())
              return 0
          if count_identity(bs2) != 1:
              raise SystemExit(f'unexpected stable bundle identity count: {count_identity(bs2)}')
          dump('bundles/all-stable.json', bs2)

          bb = load('bundles/all-beta.json')
          bb2 = bundle_replace(bb, identity, stable_src, remove=True)
          if count_identity(bb2) != 0:
              raise SystemExit('beta bundle identity still present')
          dump('bundles/all-beta.json', bb2)

          raw = item['sourceUrl']
          backup = item['backupUrl']
          imp = item['importUrl']
          detail = {
              'kind': 'source',
              'title': '🌈 起点增强',
              'summary': 'Stable 1.2.2：由已真机确认的 1.2.2-beta5 直接晋升，本章说卡片主题统一。',
              'badges': ['Stable', VERSION, '本地段评', '本章说', 'UI统一'],
              'sections': [
                  {'title': '本章说卡片', 'text': '近白浅灰卡片、浅灰边框、评论页同系珊瑚红标签；昵称、正文、点赞与回复统一中性灰阶。'},
                  {'title': '功能保持', 'text': '评论总数、两条真实评论预览、点赞/回复统计及点击进入本章说均保持 Beta5 原逻辑。'},
                  {'title': '晋升说明', 'text': '本版直接沿用真机确认的 1.2.2-beta5 业务代码，不新增业务逻辑；Beta5 物理文件继续保留。'}
              ],
              'sourceUrl': raw,
              'backupUrl': backup,
              'importUrl': imp,
              'links': [
                  {'label': '导入正式版', 'url': imp},
                  {'label': 'Raw', 'url': raw},
                  {'label': '备用', 'url': backup}
              ]
          }
          dump('rss/data/details/stable/qidian-next.json', detail)

          entry = f'''## {day} · qidian-next Stable {VERSION}\n- 用户真机确认 `{BETA_VERSION}` 本章说卡片优化正常，并明确要求晋升正式版。\n- Stable 直接沿用 Beta5 业务代码，不新增业务逻辑；保留近白浅灰卡片、浅灰边框、珊瑚红标签及统一中性灰阶。\n- 评论总数、两条真实评论预览、点赞/回复统计与点击进入本章说逻辑不变；沿用 1.2.2-beta4 功能链。\n- `sources/novel/qidian-next/qidian-next.json`、Manifest、Stable/Novel Subscription、Stable Bundle、RSS Stable Detail 已同步；活动 Beta/Novel 重复项移除。\n- Beta5 独立物理文件继续保留作历史/后续开发基线；Stable/Beta 继续共享同一 Legado `bookSourceUrl` 身份。\n\n'''
          for fp in ['docs/RELEASE_LOG.md', 'docs/sources/qidian-next/PROJECT_HANDOFF.md']:
              p = Path(fp)
              t = p.read_text(encoding='utf-8')
              marker = f'qidian-next Stable {VERSION}'
              if marker not in t:
                  p.write_text(entry + t, encoding='utf-8')

          # Functional freeze assertion: Stable must equal Beta except release metadata.
          a = copy.deepcopy(beta_src)
          b = copy.deepcopy(stable_src)
          for k in ('bookSourceName', 'bookSourceComment', 'version', 'sourceVersion', 'versionCode', 'sourceVersionCode'):
              a.pop(k, None)
              b.pop(k, None)
          if a != b:
              raise SystemExit('functional fields changed during promotion')

          stable_check = load('subscription/stable.json')
          stable_items = stable_check.get('items', []) if isinstance(stable_check, dict) else stable_check
          beta_check = load('subscription/beta.json')
          beta_items = beta_check.get('items', []) if isinstance(beta_check, dict) else beta_check
          novel_check = load('subscription/novel.json')
          novel_items = novel_check.get('items', []) if isinstance(novel_check, dict) else novel_check
          if not any(isinstance(x, dict) and x.get('id') == 'qidian-next' and x.get('version') == VERSION and x.get('versionCode') == VERSION_CODE for x in stable_items):
              raise SystemExit('stable subscription not updated')
          if any(isinstance(x, dict) and x.get('id') == 'qidian-next-beta' for x in beta_items):
              raise SystemExit('active beta subscription item still present')
          if sum(1 for x in novel_items if isinstance(x, dict) and x.get('id') in ('qidian-next', 'qidian-next-beta')) != 1:
              raise SystemExit('novel subscription has duplicate/missing qidian-next records')

          print('PROMOTE_OK', VERSION, VERSION_CODE, sha, identity)
      - name: Validate JSON and diff
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for p in [
              'sources/novel/qidian-next/qidian-next.json',
              'subscription/stable.json', 'subscription/beta.json', 'subscription/novel.json',
              'manifest.json', 'bundles/all-stable.json', 'bundles/all-beta.json',
              'rss/data/details/stable/qidian-next.json'
          ]:
              json.loads(Path(p).read_text(encoding='utf-8'))
          print('JSON_OK')
          PY
          git diff --check
      - name: Commit promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/novel/qidian-next/qidian-next.json \
                  manifest.json subscription/stable.json subscription/beta.json subscription/novel.json \
                  bundles/all-stable.json bundles/all-beta.json \
                  rss/data/details/stable/qidian-next.json \
                  docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'release: promote qidian-next beta5 to stable 1.2.2'
          git push origin main
