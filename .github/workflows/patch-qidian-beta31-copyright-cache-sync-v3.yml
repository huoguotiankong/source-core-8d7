name: patch-qidian-beta31-copyright-cache-sync-v3
on:
  push:
    paths: ['.staging/patch-qidian-beta31-copyright-cache-sync-v3.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch beta31
        run: |
          python3 - <<'PY'
          import json,gzip,base64,hashlib
          from pathlib import Path
          sp=Path('sources/novel/qidian-next/qidian-next-beta.json'); doc=json.loads(sp.read_text()); src=doc[0]; js=src['jsLib']
          def extract_obj(text,varname):
              st=text.index('var '+varname+'='); b=text.index('{',st); dep=0; ins=False; esc=False
              for i in range(b,len(text)):
                  c=text[i]
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                  else:
                      if c=='"': ins=True
                      elif c=='{': dep+=1
                      elif c=='}':
                          dep-=1
                          if dep==0:return b,i+1,text[b:i+1]
              raise RuntimeError(varname)
          def replace_registry(text,varname,mut):
              b,e,raw=extract_obj(text,varname); o=json.loads(raw); mut(o); return text[:b]+json.dumps(o,ensure_ascii=False,separators=(',',':'))+text[e:]
          _,_,raw=extract_obj(js,'QF_MOD38_PACK'); pack=json.loads(raw); assert 'copyright' in pack
          cv=pack['copyright']; code=gzip.decompress(base64.b64decode(cv[3:])).decode() if cv.startswith('gz:') else cv
          code=code.replace('上架','首发'); packed='gz:'+base64.b64encode(gzip.compress(code.encode(),compresslevel=9,mtime=0)).decode()
          js=replace_registry(js,'QF_MOD38_PACK',lambda o:o.__setitem__('copyright_b31',packed))
          def ex(o): o['copyright_b31']=list(o['copyright'])
          js=replace_registry(js,'QF_MOD38_EXPORTS',ex)
          _,_,draw=extract_obj(js,'QF_MOD38_DEPS'); deps=json.loads(draw)
          if 'copyright' in deps:
              js=replace_registry(js,'QF_MOD38_DEPS',lambda o:o.__setitem__('copyright_b31',list(o['copyright'])))
          hits=js.count('module:"copyright"'); assert hits>=3,hits; js=js.replace('module:"copyright"','module:"copyright_b31"')
          assert js.count('qfCv=2967')>=1; js=js.replace('qfCv=2967','qfCv=3101')
          old='function qfTocLoadV70(raw,baseUrl){     return qfCatalogLoad.call(this,raw,baseUrl); }'; assert old in js
          new='''function qfTocLoadV70(raw,baseUrl){ var out=qfCatalogLoad.call(this,raw,baseUrl); try{var a=Array.isArray(out)?out:[];for(var i=0;i<a.length;i++){var x=a[i]||{};if(String(x.N||'')!=='版权信息'||!x.C)continue;var u=String(x.C||'');if(!/[?&]qfType=copyright/i.test(u))continue;if(/[?&]qfCv=\\d+/i.test(u))u=u.replace(/([?&]qfCv=)\\d+/i,'$1'+'3101');else u=u+(u.indexOf('?')>=0?'&':'?')+'qfCv=3101';x.C=u;}}catch(_cv31){} return out; }'''
          js=js.replace(old,new,1); src['jsLib']=js
          src['bookSourceComment']='v1.1.0-beta31：版权信息页缓存链修复。版权日期明确显示“首发”；版权懒模块切换为 copyright_b31，版权目录项 qfCv 升至 3101，并自动迁移旧版权 URL，避免继续复用旧“上架”缓存。订阅详情卡同步机制一并补齐。其它域冻结。'
          sp.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':'))); sha=hashlib.sha256(sp.read_bytes()).hexdigest()
          mp=Path('manifest.json'); m=json.loads(mp.read_text()); m['updatedAt']='2026-08-29T16:45:00+08:00'
          for x in m['sources']:
              if x.get('id')=='qidian-next-beta': x.update(version='1.1.0-beta31',versionCode=11031,updatedAt='2026-08-29T16:45:00+08:00',sourceUrl='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11031',summary='版权信息页 beta31：强制刷新版权模块/章节缓存，日期标签统一为“首发”；订阅详情同步补齐。',sha256=sha,tags=['起点','测试版','版权信息','首发时间','缓存刷新','订阅同步'],changelog=['版权页日期标签统一为“首发”','版权模块换键 copyright_b31','版权目录项 qfCv 升至 3101 并迁移旧 URL','订阅详情卡纳入发布同步','其它域冻结'])
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          bp=Path('subscription/beta.json'); sub=json.loads(bp.read_text()); sub['updatedAt']=sub['generatedAt']='2026-08-29T16:45:00+08:00'
          for x in sub['items']:
              if x.get('id')=='qidian-next-beta': x.update(version='1.1.0-beta31',updatedAt='2026-08-29',summary='版权信息页 beta31：强制刷新版权模块/章节缓存，日期标签统一为“首发”；订阅详情同步补齐。',sourceUrl='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11031',backupUrl='https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v=11031',importUrl='legado://import/importonline?src=https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11031',tags=['起点','测试版','版权信息','首发时间','缓存刷新','订阅同步'],changelog=['版权页日期标签统一为“首发”','版权模块换键 copyright_b31','版权目录项 qfCv 升至 3101 并迁移旧 URL','订阅详情卡纳入发布同步','其它域冻结'])
          bp.write_text(json.dumps(sub,ensure_ascii=False,indent=2)+'\n')
          bunp=Path('bundles/all-beta.json'); bun=json.loads(bunp.read_text()); cnt=[0]
          def rb(o):
              if isinstance(o,list):
                  for i,v in enumerate(o):
                      if isinstance(v,dict) and v.get('bookSourceUrl')==src.get('bookSourceUrl') and '起点增强' in str(v.get('bookSourceName','')): o[i]=src;cnt[0]+=1
                      else: rb(v)
              elif isinstance(o,dict):
                  for k,v in list(o.items()):
                      if isinstance(v,dict) and v.get('bookSourceUrl')==src.get('bookSourceUrl') and '起点增强' in str(v.get('bookSourceName','')): o[k]=src;cnt[0]+=1
                      else: rb(v)
          rb(bun); assert cnt[0]>=1; bunp.write_text(json.dumps(bun,ensure_ascii=False,separators=(',',':')))
          rp=Path('docs/RELEASE_LOG.md'); rp.write_text('## 2026-08-29 · 🌈 起点增强 1.1.0-beta31\n\n- 通道：Beta / 测试版；Stable 不变。\n- 版权页：日期统一标记为“首发”；版权 lazy module 换键为 `copyright_b31`。\n- 缓存：版权目录项 `qfCv` 升至 3101，并迁移旧版权 URL，避免继续复用旧“上架”章节内容。\n- 订阅：详情卡纳入发布同步，修复长期停留 beta16。\n- 其它域冻结。\n\n'+rp.read_text())
          PY
          python3 tools/sync_qidian_next_beta_detail.py
          python3 - <<'PY'
          import json,gzip,base64
          s=json.load(open('sources/novel/qidian-next/qidian-next-beta.json'))[0]; js=s['jsLib']; assert 'beta31' in s['bookSourceComment'] and 'module:"copyright_b31"' in js and 'qfCv=3101' in js
          def ext(t,n):
              st=t.index('var '+n+'=');b=t.index('{',st);dep=0;ins=False;esc=False
              for i in range(b,len(t)):
                  c=t[i]
                  if ins:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':ins=False
                  else:
                      if c=='"':ins=True
                      elif c=='{':dep+=1
                      elif c=='}':
                          dep-=1
                          if dep==0:return json.loads(t[b:i+1])
          pack=ext(js,'QF_MOD38_PACK'); code=gzip.decompress(base64.b64decode(pack['copyright_b31'][3:])).decode(); assert '上架' not in code and '首发' in code
          d=json.load(open('rss/data/details/beta/qidian-next.json')); assert '1.1.0-beta31' in d['badges']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md
          git commit -m 'release(qidian): publish beta31 copyright cache and subscription sync'
          git push origin main
