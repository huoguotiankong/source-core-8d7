name: patch-rss-beta7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rss-beta7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch RSS detail browser and import buttons
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, base64
          root=pathlib.Path('.')
          p=root/'rss/reader-source-repository-beta.json'
          arr=json.loads(p.read_text(encoding='utf-8'))
          src=arr[0]
          src['sourceComment']='UI Beta 7：修复 RSS 正文不渲染 HTML 的问题；详情改为 java.startBrowser 打开内置 WebView，并通过 legado://import/importonline 从 GitHub 仓库导入/更新书源。'
          src['lastUpdateTime']=1787659440000
          b64=''
          src['ruleContent']=base64.b64decode(b64).decode('utf-8')
          p.write_text(json.dumps(arr,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          rp=root/'docs/RELEASE_LOG.md'
          old=rp.read_text(encoding='utf-8')
          marker='## 2026-08-25 — RSS repository UI Beta 7'
          if marker not in old:
              block=marker+'\n\nStatus: Beta/Test; awaiting user real-device verification.\n\nChanges:\n\n- RSS detail cards now open explicitly with `java.startBrowser(data:text/html;base64, ...)`.\n- Source, bundle and repository-update buttons use `legado://import/importonline?src=...`.\n- Qidian Beta can be imported/updated from its repository detail card.\n\n'
              lines=old.splitlines(True)
              old=(lines[0]+'\n'+block+''.join(lines[1:])) if lines and lines[0].startswith('# RELEASE LOG') else block+old
              rp.write_text(old,encoding='utf-8')
          kp=root/'docs/KNOWN_ISSUES.md'
          old=kp.read_text(encoding='utf-8')
          marker2='## Resolved — RSS detail HTML returned as plain article text'
          if marker2 not in old:
              old=old.rstrip()+'\n\n'+marker2+'\n\n- Symptom: source/detail entries displayed only summary text; HTML buttons were not rendered.\n- Fix: open generated HTML through `java.startBrowser(data:text/html;base64, ...)` and use `legado://import/importonline?src=...`.\n- Status: fixed in RSS UI Beta 7, pending real-device confirmation.\n'
              kp.write_text(old+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rss/reader-source-repository-beta.json docs/RELEASE_LOG.md docs/KNOWN_ISSUES.md
          git rm .github/workflows/patch-rss-beta7.yml
          git commit -m 'fix: open RSS detail cards in browser for repository imports'
          git push origin main
