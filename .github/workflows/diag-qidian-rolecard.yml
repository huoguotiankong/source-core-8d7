name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d;js=s['jsLib']
          sources=[('RAW',js)]
          for name,b64 in re.findall(r'"([^"]+)":"gz:([A-Za-z0-9+/=]+)"',js):
            try:sources.append((name,gzip.decompress(base64.b64decode(b64)).decode()))
            except:pass
          keys=['守护者','星耀值','比心','送礼','角色信息','角色详情','档案','角色标签','角色卡','立绘','生日','性别']
          for name,t in sources:
            ps=[]
            for k in keys:
              for m in list(re.finditer(re.escape(k),t))[:5]:ps.append((m.start(),k))
            if ps:
              print('\nMODULE',name,'LEN',len(t),'HITS',sorted(ps)[:30])
              for p,k in sorted(ps)[:8]: print('\n--',k,p,'--\n',t[max(0,p-1800):min(len(t),p+6500)])
          PY