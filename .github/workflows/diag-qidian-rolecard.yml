name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths:
      - '.staging/diag-qidian-rolecard.trigger'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect role gestures
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d;js=s['jsLib']
          m=re.search(r'\\?"role\\?"\s*:\s*\\?"gz:([A-Za-z0-9+/=]+)',js);assert m
          b=m.group(1);b+='='*((4-len(b)%4)%4);t=gzip.decompress(base64.b64decode(b)).decode()
          open('/tmp/qidian-role.js','w',encoding='utf-8').write(t)
          print('ROLE_BYTES',len(t.encode('utf-8')))
          for key in ['touchstart','touchmove','touchend','preventDefault','addEventListener','roleImg','viewport','tabs','tabRadio','pointer-events']:
              print('\n###',key,'###')
              hits=list(re.finditer(re.escape(key),t,re.I))
              print('HITS',len(hits))
              for mm in hits[:12]:
                  p=mm.start();print(t[max(0,p-900):min(len(t),p+1800)])
          PY
      - name: Syntax check
        run: node --check /tmp/qidian-role.js
