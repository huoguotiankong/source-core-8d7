name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d;js=s['jsLib']
          m=re.search(r'\\?"role\\?"\s*:\s*\\?"gz:([A-Za-z0-9+/=]+)',js);assert m
          b=m.group(1);b+='='*((4-len(b)%4)%4);t=gzip.decompress(base64.b64decode(b)).decode()
          print('ROLE_LEN',len(t))
          print('FUNCTIONS',re.findall(r'function\s+([A-Za-z0-9_$]+)\s*\(',t))
          for key in ['scroll-snap-type','relationship','lookfor','heightPercentage','暂无角色立绘','点击立绘查看原图','星耀','守护','roleList','roleId']:
            print('\n###',key,'###')
            for mm in list(re.finditer(re.escape(key),t,re.I))[:8]:
              p=mm.start();print(t[max(0,p-1800):min(len(t),p+5000)])
          PY