name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d
          m=re.search(r'"circle":"gz:([A-Za-z0-9+/=]+)"',s['jsLib']);t=gzip.decompress(base64.b64decode(m.group(1))).decode()
          for mm in re.finditer(r'function\s+(qfRole\w*)\s*\(',t):
            p=mm.start(); print('\n===== ',mm.group(1),' @ ',p,' =====\n',t[p:min(len(t),p+10000)])
          PY