name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d
          for name,b64 in re.findall(r'"([^"]+)":"gz:([A-Za-z0-9+/=]+)"',s['jsLib']):
            try:t=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
            except:continue
            hits=[]
            for k in ['星耀守护','Role ID','角色标签','角色档案','qfRole','roleHtml','角色卡']:
              pos=t.find(k)
              if pos>=0:hits.append((k,pos))
            if hits:
              print('MODULE',name,'LEN',len(t),'HITS',hits)
              for k,pos in hits[:4]: print('---',k,'---\n',t[max(0,pos-2500):min(len(t),pos+6000)])
          PY