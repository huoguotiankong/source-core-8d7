name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d;t=s['jsLib']
          for fn in ['qfRoleModelV4','qfRoleHtmlV33']:
            m=re.search(r'function\s+'+re.escape(fn)+r'\s*\(',t)
            if not m:
              print('MISSING',fn);continue
            start=m.start()
            nxt=re.search(r'\nfunction\s+[A-Za-z0-9_$]+\s*\(',t[m.end():])
            end=m.end()+nxt.start() if nxt else len(t)
            print('\n===== '+fn+' =====\n')
            print(t[start:end])
          print('\n===== SOURCE META =====')
          for k in ['bookSourceName','bookSourceComment','bookSourceGroup','bookSourceUrl']:
            print(k,repr(s.get(k)))
          print('version-like top keys',[(k,s.get(k)) for k in s if 'version' in k.lower() or 'code' in k.lower()][:20])
          PY