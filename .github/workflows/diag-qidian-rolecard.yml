name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d
          m=re.search(r'"circle":"gz:([A-Za-z0-9+/=]+)"',s['jsLib']);t=gzip.decompress(base64.b64decode(m.group(1))).decode()
          for mm in re.finditer(r'function\s+([A-Za-z0-9_$]*(?:role|character|card)[A-Za-z0-9_$]*)\s*\(',t,re.I): print(mm.group(1),mm.start())
          for key in ['getrole','roleId','RoleId','character','角色简介','生日：','左右滑动切换角色','点击立绘查看原图']:
            print('\nKEY',key)
            for mm in list(re.finditer(re.escape(key),t,re.I))[:10]:
              p=mm.start(); print('POS',p,'\n',t[max(0,p-1500):min(len(t),p+5000)])
          PY