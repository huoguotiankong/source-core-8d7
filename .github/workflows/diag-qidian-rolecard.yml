name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          p='sources/novel/qidian-next/qidian-next-beta.json'
          d=json.load(open(p,encoding='utf-8')); s=d[0] if isinstance(d,list) else d
          js=s['jsLib']
          for name,b64 in re.findall(r'"([^"]+)":"gz:([A-Za-z0-9+/=]+)"',js):
            try: t=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
            except: continue
            if any(k in t for k in ['角色卡','星耀守护','Role ID','角色标签']):
              print('\n===== MODULE',name,'LEN',len(t),'=====')
              print(t)
          PY