name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d;js=s['jsLib']
          for name in ['role','circle']:
            m=re.search(r'\\?"'+name+r'\\?"\s*:\s*\\?"gz:([A-Za-z0-9+/=]+)',js)
            print('MATCH',name,bool(m))
            if not m:continue
            b=m.group(1);b += '='*((4-len(b)%4)%4)
            try:t=gzip.decompress(base64.b64decode(b)).decode()
            except Exception as e:print('DECODE_ERR',name,e,len(b));continue
            print('MODULE',name,'LEN',len(t),'ROLEHTML',t.find('function qfRoleHtmlV33('),'ROLEMODEL',t.find('function qfRoleModelV4('))
            for fn in ['qfRoleModelV4','qfRoleHtmlV33']:
              p=t.find('function '+fn+'(')
              if p<0:continue
              q=t.find('\nfunction ',p+10)
              if q<0:q=len(t)
              print('\n===== '+fn+' =====\n'+t[p:q])
          print('COMMENT',repr(s.get('bookSourceComment')))
          PY