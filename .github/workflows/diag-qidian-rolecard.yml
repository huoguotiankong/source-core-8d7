name: diag-qidian-rolecard
on:
  workflow_dispatch:
  push:
    paths: ['.staging/diag-qidian-rolecard.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d;js=s['jsLib']
          ms=list(re.finditer(r'gz:([A-Za-z0-9+/=]{40,})',js))
          print('GZ_COUNT',len(ms))
          for n,m in enumerate(ms):
            pre=js[max(0,m.start()-80):m.start()]
            try:t=gzip.decompress(base64.b64decode(m.group(1))).decode()
            except Exception as e:
              print('BAD',n,repr(pre),e);continue
            hits=[x for x in ['qfRoleHtmlV33','qfRoleModelV4','qfOpenRoleDataV33','qfRoleImageV33'] if x in t]
            if not hits:continue
            print('PAYLOAD',n,'PRE',repr(pre),'LEN',len(t),'HITS',hits)
            for fn in ['qfRoleModelV4','qfRoleHtmlV33']:
              p=t.find('function '+fn+'(')
              if p<0:continue
              q=t.find('\nfunction ',p+10)
              if q<0:q=len(t)
              print('\n===== '+fn+' =====\n'+t[p:q])
          print('COMMENT',repr(s.get('bookSourceComment')))
          PY