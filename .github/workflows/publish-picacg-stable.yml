name: publish-picacg-stable

on:
  push:
    branches: [main]
    paths:
      - hotfix/picacg-stable/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Promote Picacg Beta9 to Stable
        run: |
          python tools/publish_picacg_stable.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/comic/picacg/picacg.json manifest.json subscription/stable.json subscription/beta.json subscription/comic.json bundles/all-stable.json bundles/all-beta.json rss/data/details/stable/picacg.json docs/RELEASE_LOG.md
          git diff --cached --check
          git commit -m 'release: promote Picacg 1.0.0 stable'
          git push origin main
