name: run-rss-beta11-docs
on:
  push:
    branches: [main]
    paths:
      - '.staging/run-rss-beta11-docs.trigger'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update docs
        run: python scripts/update_rss_beta11_docs.py
      - name: Commit docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/RELEASE_LOG.md docs/KNOWN_ISSUES.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: record rss repository ui beta11'
          git push origin main
