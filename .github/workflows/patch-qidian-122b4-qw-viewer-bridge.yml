name: Inspect Qidian Local Chapter Card
on:
  push:
    branches: [ main ]
    paths:
      - '.staging/run-qidian-122b4-qw-viewer-bridge.trigger'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: inspect-qidian-local-chapter-card
  cancel-in-progress: false
jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Decode review_local_ui and inspect exact chapter card
        run: |
          python - <<'PY'
          import base64,gzip,json,re
          from pathlib import Path
          a=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text())
          s=a[0] if isinstance(a,list) else a
          js=s['jsLib']
          m=re.search(r'"review_local_ui":"(gz:[^"]+)"',js)
          if not m: raise SystemExit('review_local_ui not found')
          b=m.group(1)[3:].replace('-','+').replace('_','/')
          b+='='*((4-len(b)%4)%4)
          mod=gzip.decompress(base64.b64decode(b)).decode('utf-8')
          print('MODULE_BYTES',len(mod.encode()))
          for token in ['本章说','条评论','qfcount','chapterReview','ChapterReview','reviewCount','CommentCount','data:image/svg','<svg']:
              hits=[x.start() for x in re.finditer(re.escape(token),mod)]
              print('\n===== TOKEN',token,'COUNT',len(hits),'=====')
              for n,i in enumerate(hits,1):
                  lo=max(0,i-2600); hi=min(len(mod),i+4300)
                  print('\n---',token,n,'AT',i,'---\n'+mod[lo:hi])
          PY
