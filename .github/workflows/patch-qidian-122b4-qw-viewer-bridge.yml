name: Patch Qidian 1.2.2-Beta4 QW Viewer Bridge
on:
  push:
    branches: [ main ]
    paths:
      - '.staging/run-qidian-122b4-qw-viewer-bridge.trigger'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: patch-qidian-122b4-qw-viewer-bridge
  cancel-in-progress: false
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize generated helper syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.staging/patch_qidian_122b4_qw_viewer_bridge.py')
          lines=p.read_text().splitlines()
          out=[]
          n=0
          for line in lines:
              if "var tag='<script>'+script.replace(" in line:
                  out.append("    var tag='<script>'+script+'</script>';" )
                  n+=1
              elif "if(/<" in line and "/body>/i.test(html))" in line:
                  out.append("    var bi=html.toLowerCase().lastIndexOf('</body>');if(bi>=0)html=html.substring(0,bi)+tag+html.substring(bi);else html+=tag;")
                  n+=1
              elif "out.pre='window.java=java;window.__QF_QW_CTX__='+JSON.stringify(cfg).replace(" in line:
                  out.append("    out.pre='window.java=java;window.__QF_QW_CTX__='+JSON.stringify(cfg)+';';")
                  n+=1
              else:
                  out.append(line)
          if n!=3:
              raise SystemExit('expected three helper syntax normalizations, got '+str(n))
          p.write_text('\n'.join(out)+'\n')
          print('normalized helper lines',n)
          PY
      - name: Build Beta4
        run: python .staging/patch_qidian_122b4_qw_viewer_bridge.py
      - name: Static and isolation gates
        run: |
          python - <<'PY'
          import json,hashlib,base64,re
          from pathlib import Path
          stable=Path('sources/novel/qidian-next/qidian-next.json')
          beta=Path('sources/novel/qidian-next/qidian-next-beta.json')
          assert hashlib.sha256(stable.read_bytes()).hexdigest()=='1ee474c209b48d069344ffa4409379a0d39012cbaf2acecbd5ffcaba5404ab7e'
          a=json.loads(beta.read_text()); s=a[0] if isinstance(a,list) else a; js=s['jsLib']
          assert 'v1.2.2-beta4' in s.get('bookSourceComment','')
          assert js.count('function qfQwViewerPackV1224')==1
          assert js.count('function qfQwOpenV1214')==1
          assert 'QF_QW_VIEWER_JS_B64_V1224' in js
          assert 'raw.giteeusercontent.com/syiism/legado-source/raw/main/ui/comment-viewer.html' in js
          assert 'qfQwH5V1214(bid,cid,pid)' in js
          assert 'qfReviewFastSummaryV1223' in js and 'ARGUS-REPAGE' in js
          assert str(s['ruleContent']['content']).count('@js:')==1
          m=re.search(r"var QF_QW_VIEWER_JS_B64_V1224='([^']+)'",js); assert m
          browser=base64.b64decode(m.group(1)).decode()
          for token in ['list.php?bookId=','reply.php?bookId=','avatarUrl','reviewId','nickname','window.java.ajax','no-referrer','__qfqwcmt__?']:
              assert token in browser, token
          Path('/tmp/qidian-beta4-jslib.js').write_text(js)
          Path('/tmp/qidian-beta4-browser.js').write_text(browser)
          n=json.loads(Path('subscription/novel.json').read_text())
          assert any(x.get('id')=='qidian-next-beta' and x.get('version')=='1.2.2-beta4' and x.get('versionCode')==12024 for x in n['items'])
          d=json.loads(Path('rss/data/details/beta/qidian-next.json').read_text())
          assert d.get('sourceUrl') and d.get('backupUrl') and d.get('importUrl') and d.get('links',{}).get('import')
          print('python gates ok; beta sha',hashlib.sha256(beta.read_bytes()).hexdigest())
          PY
          node --check /tmp/qidian-beta4-jslib.js
          node --check /tmp/qidian-beta4-browser.js
      - name: Commit Beta4 publication
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'qidian beta: 1.2.2-beta4 fix qingwu avatars and replies'
          git push origin HEAD:main
