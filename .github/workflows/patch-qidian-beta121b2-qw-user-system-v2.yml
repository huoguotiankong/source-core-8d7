name: patch-qidian-beta121b2-qw-user-system-v2
on:
  push:
    paths:
      - '.staging/patch-qidian-beta121b2-qw-user-system-v2.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run patch script
        run: python3 .staging/patch_qidian_beta121b2_qw_user_system.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m "qidian-next: beta 1.2.1-b2 correct qingwu user system"
          git push origin HEAD:main
