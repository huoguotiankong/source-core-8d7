name: diag-qidian-multiui
on:
  push:
    paths: ['.staging/diag-qidian-multiui.trigger']
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Extract multi ui functions
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json'); a=json.loads(p.read_text()); s=a[0] if isinstance(a,list) else a
          parts=[s.get('jsLib',''),s.get('loginUrl','')]
          txt='\n'.join(parts)
          names=['qfMultiContentV423','qfMultiAccountsV423','qfProviderTierNamesV310','qfProviderNames','qfRegistry','qfOrderDefault','qfSourceTier','qfOpenUiPageV30']
          out=[]
          for n in names:
            for m in re.finditer(r'function\s+'+re.escape(n)+r'\s*\(',txt):
              out.append('\n### '+n+'\n'+txt[m.start():m.start()+14000])
          # account/provider specific strings
          for pat in ['情无账号','同人 Token','同人Token','情无','限免源顺序','正文源类别']:
            for m in list(re.finditer(re.escape(pat),txt))[:15]:out.append('\n### PAT '+pat+'\n'+txt[max(0,m.start()-2500):m.start()+6500])
          Path('.staging/qidian-multiui.txt').write_text('\n'.join(out)[:180000])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-multiui.txt
          git commit -m 'chore: dump qidian multi ui functions'
          git push origin HEAD:main
