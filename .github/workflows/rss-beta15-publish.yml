name: rss-beta15-publish
on:
  push:
    branches: [main]
    paths:
      - '.staging/rss-beta15/RUN'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish RSS Beta15
        run: python .staging/rss-beta15/publish.py
      - name: Commit RSS Beta15
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss/reader-source-repository-beta.json subscription/rss.json rss/data/details/rss/repository-current.json rss/data/details/stable/picacg.json manifest.json docs/DEVELOPMENT_RULES.md docs/KNOWN_ISSUES.md docs/PROJECT_PLAN.md docs/RELEASE_LOG.md
          git diff --cached --check
          git commit -m "fix: publish RSS Beta15 native stale-article cleanup"
          git push origin HEAD:main
