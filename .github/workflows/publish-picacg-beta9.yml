name: publish-picacg-beta9
on:
  push:
    branches: [main]
    paths:
      - 'hotfix/picacg-beta9/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch, validate and publish Picacg beta9
        run: |
          python tools/publish_picacg_beta9.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/comic/picacg/picacg-beta.json manifest.json subscription/beta.json subscription/comic.json bundles/all-beta.json rss/data/details/beta/picacg.json docs/RELEASE_LOG.md docs/KNOWN_ISSUES.md
          git diff --cached --check
          git commit -m 'fix: publish Picacg beta9 recommendation and comments'
          git push origin main
