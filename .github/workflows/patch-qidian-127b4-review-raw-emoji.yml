name: patch-qidian-127b4-review-raw-emoji
on:
  push:
    paths:
      - '.staging/patch_qidian_127b4_review_raw_emoji.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build qidian-next 1.2.7-beta4
        run: python3 .staging/patch_qidian_127b4_review_raw_emoji.py
      - name: Syntax check unpacked review module
        run: node --check .staging/qidian-127b4-review-check.js
      - name: Verify raw Content emoji path
        run: |
          grep -F "raw.Content||raw.content" .staging/qidian-127b4-review-check.js
          grep -F "safe=safe.replace(/\\[fn=(\\d+)\\]/g" .staging/qidian-127b4-review-check.js
      - name: Commit generated Beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md .staging/qidian-127b4-report.json .staging/qidian-127b4-review-check.js
          git diff --cached --quiet && exit 0
          git commit -m "qidian beta: build 1.2.7-beta4 raw Content emoji fix"
          git push origin HEAD:main
