name: qidian-stable110-publish
on:
  push:
    paths:
      - '.staging/qidian-stable110/TRIGGER'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Promote Beta14 to Stable 1.1.0
        run: python .staging/qidian-stable110/publish.py
      - name: Commit Stable 1.1.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/novel/qidian-next/qidian-next.json bundles/all-stable.json subscription/stable.json manifest.json rss/data/details/stable/qidian-next.json docs/RELEASE_LOG.md
          git diff --cached --check
          git commit -m "release: qidian-next 1.1.0 stable"
          git push origin HEAD:main
