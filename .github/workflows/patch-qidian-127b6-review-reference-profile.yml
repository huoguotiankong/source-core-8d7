name: patch-qidian-127b6-review-reference-profile
on:
  push:
    paths:
      - '.staging/patch_qidian_127b6_review_reference_profile.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build qidian-next 1.2.7-beta6
        run: python3 .staging/patch_qidian_127b6_review_reference_profile.py
      - name: Syntax check unpacked review module
        run: node --check .staging/qidian-127b6-review-check.js
      - name: Verify reference Reader profile and emoji recovery
        run: |
          grep -Fq '7.9.378' .staging/qidian-127b6-review-check.js
          grep -Fq 'RMX3366' .staging/qidian-127b6-review-check.js
          grep -Fq 'QDReaderAndroid/7.9.378/1436/1000009/realme' .staging/qidian-127b6-review-check.js
          grep -Fq 'qfEmojiRecoverContentV1275' .staging/qidian-127b6-review-check.js
          grep -Fq "qfReaderSignedRequestV3245('v2/chapterreview/getparagraphscomments'" .staging/qidian-127b6-review-check.js
          grep -Fq 'raw.Content||raw.content' .staging/qidian-127b6-review-check.js
          grep -Fq 'Stable 1.2.6' sources/novel/qidian-next/qidian-next.json || true
      - name: Commit generated Beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md .staging/qidian-127b6-report.json .staging/qidian-127b6-review-check.js
          git diff --cached --quiet && exit 0
          git commit -m "qidian beta: use reference Reader identity in 1.2.7-beta6"
          git push origin HEAD:main
