name: assemble-qidian
on:
  push:
    paths:
      - '.staging/qidian/READY'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/novel/qidian bundles
          cat .staging/qidian/part-* > /tmp/qidian.b64
          base64 -d /tmp/qidian.b64 | gzip -d > sources/novel/qidian/qidian-official.json
          python - <<'PY'
          import json, hashlib
          p='sources/novel/qidian/qidian-official.json'
          raw=open(p,'rb').read()
          data=json.loads(raw)
          assert isinstance(data,list) and len(data)==1
          assert data[0].get('bookSourceName')=='起点官方生态'
          assert data[0].get('bookSourceUrl')=='https://sc8d7.invalid/legado/qidian-official-8d7'
          assert hashlib.sha256(raw).hexdigest()=='c952233cc72468a79bd94b784cfe34c0101b0eacecb39b52bff7b9fab691a8a3'
          open('bundles/all-beta.json','wb').write(raw)
          print('sha256', hashlib.sha256(raw).hexdigest(), 'bytes', len(raw))
          PY
          rm -rf .staging/qidian
          rm -f .github/workflows/assemble-qidian.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A sources/novel/qidian/qidian-official.json bundles/all-beta.json .staging/qidian .github/workflows/assemble-qidian.yml
          git commit -m 'feat: publish Qidian ecosystem beta source'
          git push origin main
