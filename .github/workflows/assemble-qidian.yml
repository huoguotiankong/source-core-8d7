name: publish-qidian-upload
on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.json'
      - 'bookSource_起点官方生态.json'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate and publish Qidian beta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib,pathlib,re
          from datetime import datetime,timezone,timedelta

          ROOT=pathlib.Path('.')
          candidates=[]
          root_file=ROOT/'bookSource_起点官方生态.json'
          if root_file.exists(): candidates.append(root_file)
          candidates += sorted((ROOT/'incoming').glob('*.json')) if (ROOT/'incoming').exists() else []
          if not candidates:
              print('No Qidian source upload found; nothing to publish.')
              raise SystemExit(0)
          if len(candidates)!=1:
              raise SystemExit(f'Expected exactly one Qidian JSON upload, got {len(candidates)}: {candidates}')

          incoming=candidates[0]
          original=incoming.read_bytes()
          original_sha=hashlib.sha256(original).hexdigest()
          data=json.loads(original)
          assert isinstance(data,list) and len(data)==1, 'Qidian upload must contain exactly one source'
          src=data[0]
          assert src.get('bookSourceName')=='起点官方生态', src.get('bookSourceName')

          # This source needs a Qidian same-origin identity for Cookie/WebView/baseUrl behavior.
          # Stable and Beta must keep this exact identity permanently.
          identity='https://m.qidian.com/?qf_source=v2922_audio_webview_crypto_bridge_fix'
          src['bookSourceUrl']=identity
          raw=json.dumps(data,ensure_ascii=False,separators=(',',':')).encode('utf-8')
          final_sha=hashlib.sha256(raw).hexdigest()

          target=ROOT/'sources/novel/qidian/qidian-official.json'
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(raw)
          (ROOT/'bundles').mkdir(parents=True,exist_ok=True)
          (ROOT/'bundles/all-beta.json').write_bytes(raw)

          comment=str(src.get('bookSourceComment') or '')
          m=re.search(r'v(\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?)',comment)
          version=m.group(1) if m else 'unknown-beta'
          vm=re.match(r'(\d+)\.(\d+)\.(\d+)(?:-alpha(\d+))?',version)
          version_code=0
          if vm:
              ma,mi,pa,al=vm.groups()
              version_code=int(ma)*10000+int(mi)*1000+int(pa)*100+int(al or 0)

          now_dt=datetime.now(timezone(timedelta(hours=8)))
          now=now_dt.isoformat(timespec='seconds')
          day=now_dt.date().isoformat()
          raw_url='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian/qidian-official.json'
          backup='https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian/qidian-official.json'
          detail_url='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/details/qidian-official.json'
          summary='起点官方生态大型书源：官方搜索、目录、评论体系与多正文 Provider。'
          if 'STV' in comment: summary+=' 当前测试主线包含 STV 独立正文入口。'
          tags=['起点','官方目录','段评','本章说','作者说','书友圈','多正文 Provider']
          if 'STV' in comment: tags.append('STV')
          changes=[comment] if comment else ['更新起点官方生态测试版']

          beta={
              'schemaVersion':1,'channel':'beta','name':'测试版','updatedAt':now,
              'items':[{
                  'id':'qidian-official','name':'🔅 起点官方生态','summary':summary,
                  'icon':str(src.get('bookSourceIcon') or ''),'channel':'beta','version':version,
                  'updatedAt':day,'tags':tags,'changelog':changes,
                  'sourceUrl':raw_url,'backupUrl':backup,
                  'importUrl':'legado://import/bookSource?src='+raw_url,'detailUrl':detail_url
              }]
          }
          (ROOT/'subscription').mkdir(parents=True,exist_ok=True)
          (ROOT/'subscription/beta.json').write_text(json.dumps(beta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          detail={
              'kind':'source','title':'🔅 起点官方生态','summary':summary,
              'badges':['Beta',version,'小说']+(['STV'] if 'STV' in comment else []),
              'sections':[
                  {'title':'主要能力','text':'官方搜索、详情、目录、免费正文、段评、本章说、作者说、角色卡、彩蛋、书友圈，以及多正文 Provider。'},
                  {'title':'本版更新','text':'\n'.join('• '+x for x in changes)},
                  {'title':'发布状态','text':'当前为 Beta / 测试通道。请在阅读真机验证后再晋升 Stable。'},
                  {'title':'唯一身份','text':identity}
              ],
              'sourceUrl':raw_url,'backupUrl':backup
          }
          detail_path=ROOT/'rss/data/details/qidian-official.json'
          detail_path.parent.mkdir(parents=True,exist_ok=True)
          detail_path.write_text(json.dumps(detail,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          mp=ROOT/'manifest.json'
          manifest=json.loads(mp.read_text(encoding='utf-8'))
          manifest['updatedAt']=now
          entry={
              'id':'qidian-official','name':'起点官方生态','category':'novel','channel':'beta',
              'version':version,'versionCode':version_code,'updatedAt':now,
              'sourcePath':'sources/novel/qidian/qidian-official.json','sourceUrl':raw_url,
              'bookSourceUrl':identity,'summary':summary,'tags':tags,'changelog':changes
          }
          arr=manifest.setdefault('sources',[])
          arr[:]=[x for x in arr if x.get('id')!='qidian-official']+[entry]
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          rp=ROOT/'docs/RELEASE_LOG.md'
          old=rp.read_text(encoding='utf-8')
          marker=f'## {day} — Qidian official ecosystem {version} Beta publish'
          if marker not in old:
              block=(marker+'\n\nStatus: Beta/Test; awaiting user real-device confirmation.\n\nChanges:\n\n'
                     f'- Published uploaded `起点官方生态` baseline to Beta.\n'
                     f'- Preserved runtime-safe permanent identity `{identity}`.\n'
                     f'- Original SHA256: `{original_sha}`.\n- Published SHA256: `{final_sha}`.\n\n')
              lines=old.splitlines(True)
              old=(lines[0]+'\n'+block+''.join(lines[1:])) if lines and lines[0].startswith('# RELEASE LOG') else block+old
              rp.write_text(old,encoding='utf-8')

          # Remove only the uploaded intake file after a successful publish.
          incoming.unlink()
          print('published',len(raw),'bytes','version',version,'sha256',final_sha)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes to commit.'
            exit 0
          fi
          git commit -m 'feat: publish Qidian ecosystem beta source'
          git push origin main
