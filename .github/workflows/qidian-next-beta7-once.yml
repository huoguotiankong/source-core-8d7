name: Qidian Next Beta7 One Shot

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/qidian-next-beta7-once.yml'
      - '.github/scripts/qidian_beta7_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Beta7
        run: python3 .github/scripts/qidian_beta7_patch.py
      - name: Commit Beta7
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json bundles/all-beta.json subscription/beta.json manifest.json rss/data/details/beta/qidian-next.json docs/KNOWN_ISSUES.md docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md
          git diff --cached --quiet && exit 1
          git commit -m 'fix: restore qidian synopsis via official tts beta1107'
          git push origin HEAD:main
