name: run-qidian-detail-extract
on:
  push:
    branches: [main]
    paths:
      - '.staging/run-qidian-detail-extract.trigger'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract detail implementation
        run: python scripts/extract_qidian_detail.py
      - name: Commit extract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-detail-extract.txt
          git commit -m 'chore: extract qidian detail implementation'
          git push origin main
