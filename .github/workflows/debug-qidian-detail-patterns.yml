name: debug-qidian-detail-patterns
on:
  push:
    branches: [main]
    paths:
      - '.staging/debug-qidian-detail-patterns.trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect qdParseBookInfo signature
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text(encoding='utf-8'))[0]
          text=str(s.get('jsLib',''))
          i=text.find('function qdParseBookInfo');assert i>=0
          print(text[i:i+4600])
          PY
