name: debug-qidian-detail-patterns
on:
  push:
    branches: [main]
    paths:
      - '.staging/debug-qidian-detail-patterns.trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect mature detail enrichment patterns
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          s=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text(encoding='utf-8'))[0]
          text=str(s.get('jsLib',''))
          pats=['www.qidian.com/book/','m.qidian.com/book/','qfDetail','Detail Optional','detailOptional','QF_Detail','qfBookInfo','atom','TuShu','QidianTu','book-info','ratingScore','collectionCount','fansCount']
          for pat in pats:
              print('\n===== PATTERN',pat,'=====')
              start=0;n=0
              while True:
                  i=text.lower().find(pat.lower(),start)
                  if i<0: break
                  n+=1
                  print(f'--- hit {n} @ {i} ---')
                  print(text[max(0,i-1200):min(len(text),i+2600)])
                  start=i+len(pat)
                  if n>=10: break
              print('hits_shown=',n)
          PY
