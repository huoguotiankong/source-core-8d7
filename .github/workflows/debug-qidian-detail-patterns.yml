name: debug-qidian-detail-patterns
on:
  push:
    branches: [main]
    paths:
      - '.staging/debug-qidian-detail-patterns.trigger'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect exact HTML detail parser calls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text(encoding='utf-8'))[0]
          text=str(s.get('jsLib',''))
          for pat in ['qfHtmlBookCoreV08(', 'qfAjaxTextV20(ctx,\'https://www.qidian.com/book/\'', 'qfAjaxTextV20(this,\'https://www.qidian.com/book/\'', 'function qfHtmlBookCoreV08', 'return {name:name', 'collectionCount:collectionCount']:
              print('\n===== PATTERN',pat,'=====')
              start=0;n=0
              while True:
                  i=text.find(pat,start)
                  if i<0: break
                  n+=1
                  print(f'--- hit {n} @ {i} ---')
                  print(text[max(0,i-1800):min(len(text),i+4200)])
                  start=i+len(pat)
                  if n>=15: break
              print('hits_shown=',n)
          PY
