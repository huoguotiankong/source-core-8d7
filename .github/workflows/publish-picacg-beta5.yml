name: publish-picacg-beta5
on:
  push:
    branches: [main]
    paths:
      - 'hotfix/picacg-beta5/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and publish Picacg beta5
        shell: bash
        run: |
          set -euo pipefail
          python tools/publish_picacg_beta5.py
          node --check /tmp/pica-jslib.js
          node --check /tmp/pica-init.js
          node --check /tmp/pica-intro.js
          node --check /tmp/pica-callback.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: publish Picacg beta5 detail UI polish'
          git push origin main
