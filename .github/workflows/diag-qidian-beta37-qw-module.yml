name: diag-qidian-beta37-qw-module
on:
  push:
    paths: ['.staging/diag-qidian-beta37-qw-module.trigger']
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Dump limited_qw module
        run: |
          python3 - <<'PY'
          import json,gzip,base64
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json')
          arr=json.loads(p.read_text()); s=arr[0] if isinstance(arr,list) else arr
          lib=s['jsLib']; mk='var QF_MOD38_PACK='; a=lib.index(mk)+len(mk); b=lib.index(';\nvar QF_MOD38_EXPORTS=',a); pack=json.loads(lib[a:b])
          v=pack.get('limited_qw','')
          if v.startswith('gz:'):
            z=v[3:]; z += '='*((4-len(z)%4)%4); code=gzip.decompress(base64.b64decode(z)).decode()
          else: code=v
          Path('.staging/limited_qw-beta37.js').write_text(code)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/limited_qw-beta37.js
          git commit -m 'chore: dump qidian beta37 limited_qw module' || true
          git push origin main
