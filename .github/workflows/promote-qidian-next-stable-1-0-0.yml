name: promote-qidian-next-stable-1-0-0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-qidian-next-stable-1-0-0.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Promote Stable 1.0.0
        run: python scripts/promote_qidian_next_stable_1_0_0.py
      - name: Validate stable release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          s=json.loads(pathlib.Path('sources/novel/qidian-next/qidian-next.json').read_text(encoding='utf-8'))[0]
          assert s['bookSourceName']=='🌈 起点增强'
          assert s['bookSourceGroup']=='﹅♚1、正式源'
          assert s['bookSourceUrl']=='https://m.qidian.com/?qf_source=qidian_next_8d7'
          assert 'v1.0.0 Stable' in s['bookSourceComment']
          assert '🌈 起点增强 · v1.0.0' in s['loginUi']
          stable=json.loads(pathlib.Path('subscription/stable.json').read_text(encoding='utf-8'))
          q=[x for x in stable['items'] if x.get('id')=='qidian-next']
          assert len(q)==1 and q[0]['version']=='1.0.0' and q[0]['name']=='🌈 起点增强'
          beta=json.loads(pathlib.Path('subscription/beta.json').read_text(encoding='utf-8'))
          assert not [x for x in beta['items'] if x.get('id')=='qidian-next']
          sb=json.loads(pathlib.Path('bundles/all-stable.json').read_text(encoding='utf-8'))
          assert len([x for x in sb if x.get('bookSourceUrl')==s['bookSourceUrl']])==1
          bb=json.loads(pathlib.Path('bundles/all-beta.json').read_text(encoding='utf-8'))
          assert not [x for x in bb if x.get('bookSourceUrl')==s['bookSourceUrl']]
          m=json.loads(pathlib.Path('manifest.json').read_text(encoding='utf-8'))
          q=[x for x in m['sources'] if x.get('id')=='qidian-next']
          assert len(q)==1 and q[0]['channel']=='stable' and q[0]['version']=='1.0.0'
          d=json.loads(pathlib.Path('rss/data/details/qidian-next.json').read_text(encoding='utf-8'))
          assert d['title']=='🌈 起点增强' and d['badges'][0]=='Stable'
          assert len(d['sections']) <= 6
          assert 'Subscription source-detail maintenance' in pathlib.Path('docs/DEVELOPMENT_RULES.md').read_text(encoding='utf-8')
          print('stable validation ok')
          PY
      - name: Commit stable release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next.json bundles/all-stable.json bundles/all-beta.json subscription/stable.json subscription/beta.json manifest.json rss/data/details/qidian-next.json docs/sources/qidian-next/PROJECT_HANDOFF.md docs/DEVELOPMENT_RULES.md docs/PROJECT_PLAN.md docs/RELEASE_LOG.md
          git diff --cached --stat
          git commit -m 'release: 起点增强 v1.0.0 stable'
          git push origin main
