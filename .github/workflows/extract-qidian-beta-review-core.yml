name: extract-qidian-beta-review-core
on:
  push:
    paths:
      - '.staging/extract-qidian-beta-review-core.trigger'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract current review modules
        run: |
          python3 - <<'PY'
          import json,re,base64,gzip
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json')
          a=json.loads(p.read_text(encoding='utf-8')); s=a[0] if isinstance(a,list) else a
          m=re.search(r'var\s+QF_MOD38_PACK\s*=\s*(\{.*?\});\s*var\s+QF_MOD38_EXPORTS',s['jsLib'],re.S)
          pack=json.loads(m.group(1))
          def dec(v):
            raw=v.split(':',1)[1] if ':' in v[:12] else v
            b=base64.b64decode(raw)
            try:return gzip.decompress(b).decode('utf-8')
            except:return b.decode('utf-8')
          for name in ['review_server_core','review_server_ui','review_common','review_sunny']:
            if name in pack: Path('.staging/'+name+'_current.js').write_text(dec(pack[name]),encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/*_current.js
          git commit -m 'diag: extract current qidian beta review modules' || exit 0
          git push origin main
