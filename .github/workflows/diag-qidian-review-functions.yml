name: diag-qidian-review-functions
on:
  push:
    paths: ['.staging/diag-qidian-review-functions.trigger']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Print current server review functions
        run: |
          python3 - <<'PY'
          import json,re,base64,gzip
          a=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8')); s=a[0] if isinstance(a,list) else a
          m=re.search(r'var\s+QF_MOD38_PACK\s*=\s*(\{.*?\});\s*var\s+QF_MOD38_EXPORTS',s['jsLib'],re.S); pack=json.loads(m.group(1))
          def dec(v):
            r=v.split(':',1)[1] if ':' in v[:12] else v; b=base64.b64decode(r)
            try:return gzip.decompress(b).decode()
            except:return b.decode()
          text=dec(pack['review_server_core'])
          print('FUNCTION NAMES:')
          print('\n'.join(re.findall(r'function\s+(qf[A-Za-z0-9_]+)\s*\(',text)))
          def body(name):
            p=text.find('function '+name)
            if p<0:return None
            b=text.find('{',p); dep=0; ins=None; esc=False
            for i in range(b,len(text)):
              c=text[i]
              if ins:
                if esc: esc=False
                elif c=='\\': esc=True
                elif c==ins: ins=None
                continue
              if c in "'\"`": ins=c; continue
              if c=='{': dep+=1
              elif c=='}':
                dep-=1
                if dep==0:return text[p:i+1]
            return text[p:p+8000]
          names=['qfQwCommentCandidatesV321','qfQwCommentApiV315','qfQwSummaryV315','qfQwCommentPackV315','qfServerSummaryV315','qfServerCommentPackV315','qfServerReviewSummaryV315','qfServerCommentOpenV315','qfServerReviewProviderV315','qfServerCommentProviderV315']
          for n in names:
            x=body(n)
            if x: print('\n===== '+n+' =====\n'+x)
          PY
