name: diag-qidian-review-functions
on:
  push:
    paths: ['.staging/diag-qidian-review-functions.trigger']
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Extract review UI functions
        run: |
          python3 - <<'PY'
          import json,gzip,base64,re
          from pathlib import Path
          a=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text()); s=a[0] if isinstance(a,list) else a
          lib=s['jsLib']; x=lib.index('var QF_MOD38_PACK=')+len('var QF_MOD38_PACK='); y=lib.index(';\nvar QF_MOD38_EXPORTS=',x); pack=json.loads(lib[x:y])
          v=pack['review']; z=v[3:]; z+='='*((4-len(z)%4)%4); code=gzip.decompress(base64.b64decode(z)).decode()
          # save compact keyword windows with nearest function name
          kws=['LikeCount','likeCount','digg_count','点赞','回复','replyCount','reply_count','loadMore','更多回复','thumb','👍','♡','楼']
          out=[]
          for kw in kws:
            for m in re.finditer(re.escape(kw),code,re.I):
              pre=code[:m.start()]
              fm=list(re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\(',pre))
              fn=fm[-1].group(1) if fm else '?'
              st=max(0,m.start()-2200); en=min(len(code),m.start()+5200)
              out.append('### KW '+kw+' FN '+fn+' @'+str(m.start())+'\n'+code[st:en])
          Path('.staging/qidian-review-functions.txt').write_text('\n\n'.join(out)[:180000])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-review-functions.txt
          git commit -m 'chore: dump focused review UI functions'
          git push origin main
