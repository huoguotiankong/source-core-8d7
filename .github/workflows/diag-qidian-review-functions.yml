name: diag-qidian-review-functions
on:
  push:
    paths: ['.staging/diag-qidian-review-functions.trigger']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Print review exports
        run: |
          python3 - <<'PY'
          import json,re
          a=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8')); s=a[0] if isinstance(a,list) else a
          js=s['jsLib']
          m=re.search(r'var\s+QF_MOD38_EXPORTS\s*=\s*(\{.*?\});\s*var\s+QF_MOD38_CACHE',js,re.S)
          if not m: raise SystemExit('exports not found')
          ex=json.loads(m.group(1))
          print('review=',json.dumps(ex.get('review'),ensure_ascii=False,indent=2))
          print('review_server_core=',json.dumps(ex.get('review_server_core'),ensure_ascii=False,indent=2))
          PY
