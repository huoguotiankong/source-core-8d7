name: run-qidian-beta121b4-qw-reviews
on:
  push:
    paths:
      - '.staging/run-qidian-beta121b3-qw-user-system.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch current Qingwu review adapter
        run: python3 .staging/patch_qidian_beta121b4_qw_reviews.py
      - name: Validate beta4
        run: |
          python3 -m json.tool sources/novel/qidian-next/qidian-next-beta.json >/dev/null
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool subscription/beta.json >/dev/null
          python3 -m json.tool subscription/novel.json >/dev/null
          python3 -m json.tool bundles/all-beta.json >/dev/null
          grep -q '1.2.1-beta4' manifest.json
          grep -q '情无段评' sources/novel/qidian-next/qidian-next-beta.json
      - name: Commit beta4
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json docs/RELEASE_LOG.md
          if [ -f rss/data/details/beta/qidian-next.json ]; then git add rss/data/details/beta/qidian-next.json; fi
          git commit -m 'qidian beta4: qingwu current review server adapter'
          git push origin HEAD:main
