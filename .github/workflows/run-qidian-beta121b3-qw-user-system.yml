name: run-qidian-beta121b3-qw-user-system
on:
  push:
    paths:
      - '.staging/run-qidian-beta121b3-qw-user-system.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run patch
        run: python3 .staging/patch_qidian_beta121b3_qw_user_system.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m 'qidian-next beta3: align qingwu user system with attachment'
          git push origin HEAD:main
