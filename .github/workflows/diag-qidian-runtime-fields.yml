name: diag-qidian-runtime-fields
on:
  push:
    branches: [main]
    paths:
      - '.staging/diag-qidian-runtime-fields.trigger'
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Extract runtime fields
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('sources/novel/qidian-next/qidian-next.json').read_text(encoding='utf-8'))[0]
          out={k:s.get(k) for k in ['ruleBookInfo','ruleToc','ruleContent','ruleSearch','searchUrl']}
          Path('.staging/qidian-runtime-fields.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-runtime-fields.json
          git commit -m 'diag: extract qidian runtime fields' || exit 0
          git push origin main
