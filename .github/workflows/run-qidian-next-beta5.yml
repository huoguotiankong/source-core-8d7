name: run-qidian-next-beta5
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-qidian-next-beta5.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply Beta5 patch
        run: python scripts/patch_qidian_next_beta5.py
      - name: Validate published source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('sources/novel/qidian-next/qidian-next.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(d,list) and len(d)==1
          s=d[0]
          assert s['bookSourceUrl']=='https://m.qidian.com/?qf_source=qidian_next_8d7'
          assert 'v0.1.4-beta5' in s.get('bookSourceComment','')
          login=s.get('loginUrl','')
          for name in ['qfSmCtxV30','qfSmInputV30','qfSmTrimV30','qfSmSaveCredsV30','qfNextActionsV014']:
              assert name in login, name
          assert "if(provider==='神魔')return ['不执行','登录','检测','后台','退出'];" in login
          assert '🌈 起点助手 · v0.1.4-beta5' in s.get('loginUi','')
          sub=json.loads(pathlib.Path('subscription/beta.json').read_text(encoding='utf-8'))
          q=[x for x in sub.get('items',[]) if x.get('id')=='qidian-next']
          assert len(q)==1 and q[0].get('version')=='0.1.4-beta5'
          m=json.loads(pathlib.Path('manifest.json').read_text(encoding='utf-8'))
          q=[x for x in m.get('sources',[]) if x.get('id')=='qidian-next']
          assert len(q)==1 and q[0].get('version')=='0.1.4-beta5'
          print('validation ok')
          PY
      - name: Commit Beta5
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next.json bundles/all-beta.json subscription/beta.json manifest.json rss/data/details/qidian-next.json docs/sources/qidian-next/PROJECT_HANDOFF.md docs/RELEASE_LOG.md docs/KNOWN_ISSUES.md
          git diff --cached --stat
          git commit -m 'fix: qidian-next beta5 shenmo account repair'
          git push origin main
