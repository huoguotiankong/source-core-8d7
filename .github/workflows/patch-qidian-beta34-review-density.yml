name: patch-qidian-beta34-review-density
on:
  push:
    paths: ['.staging/patch-qidian-beta34-review-density.trigger']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Compact review like column and publish Beta34
        run: |
          python3 - <<'PY'
          import json,gzip,base64,re,hashlib,datetime
          from pathlib import Path
          SRC=Path('sources/novel/qidian-next/qidian-next-beta.json')
          arr=json.loads(SRC.read_text()); s=arr[0] if isinstance(arr,list) else arr
          stable_hash=hashlib.sha256(Path('sources/novel/qidian-next/qidian-next.json').read_bytes()).hexdigest()
          lib=s['jsLib']; mk='var QF_MOD38_PACK='; a=lib.index(mk)+len(mk); b=lib.index(';\nvar QF_MOD38_EXPORTS=',a); pack=json.loads(lib[a:b])
          def dec(v):
            if not isinstance(v,str): return ''
            if not v.startswith('gz:'): return v
            z=v[3:]; z += '='*((4-len(z)%4)%4)
            return gzip.decompress(base64.b64decode(z)).decode()
          def enc(code):
            return 'gz:'+base64.b64encode(gzip.compress(code.encode(),mtime=0)).decode().rstrip('=')
          code=dec(pack['review_local_ui'])
          before=code
          reps={
            '.comment{position:relative;padding:18px 18px 17px 24px;border-bottom:1px solid var(--line);background:var(--panel);min-height:110px}':'.comment{position:relative;padding:17px 12px 16px 22px;border-bottom:1px solid var(--line);background:var(--panel);min-height:106px}',
            '.mainRow{display:flex;align-items:flex-start;padding-right:48px}':'.mainRow{display:flex;align-items:flex-start;padding-right:28px}',
            '.like{position:absolute;right:20px;top:74px;transform:none;width:38px;display:flex;flex-direction:column;align-items:center;color:var(--like);font-size:12px}':'.like{position:absolute;right:8px;top:72px;transform:none;width:24px;display:flex;flex-direction:column;align-items:center;color:var(--like);font-size:11px;line-height:1.15}',
            '.like svg{width:26px;height:26px;display:block;margin-bottom:3px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}':'.like svg{width:20px;height:20px;display:block;margin-bottom:2px;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}',
            '.reply{position:relative;padding:12px 34px 12px 12px;border-bottom:1px solid var(--line)}':'.reply{position:relative;padding:11px 23px 11px 11px;border-bottom:1px solid var(--line)}',
            '.rLike{position:absolute;right:7px;top:48px;transform:none;width:23px;display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:10px}':'.rLike{position:absolute;right:3px;top:47px;transform:none;width:18px;display:flex;flex-direction:column;align-items:center;color:var(--muted);font-size:9px;line-height:1.1}',
            '.rLike svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;margin-bottom:2px}':'.rLike svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;margin-bottom:1px}'
          }
          for old,new in reps.items():
            assert old in code, 'review CSS anchor missing: '+old[:70]
            code=code.replace(old,new,1)
          assert code!=before
          assert 'padding-right:28px' in code and 'width:20px;height:20px' in code and 'width:14px;height:14px' in code
          pack['review_local_ui']=enc(code)
          lib=lib[:a]+json.dumps(pack,ensure_ascii=False,separators=(',',':'))+lib[b:]
          s['jsLib']=lib
          s['bookSourceComment']='v1.1.0-beta34：段评/评论页信息密度优化。点赞列收窄并贴近右侧，根评论与楼中楼减少为点赞按钮预留的横向空间，同一区域可显示更多正文；评论数据、标签、楼中楼分页、X限免 Provider、其它功能保持 beta33。'
          SRC.write_text(json.dumps(arr,ensure_ascii=False,indent=2))
          # source smoke
          chk=json.loads(SRC.read_text()); cs=chk[0] if isinstance(chk,list) else chk
          assert cs['bookSourceUrl']=='https://m.qidian.com/?qf_source=qidian_next_8d7'
          assert hashlib.sha256(Path('sources/novel/qidian-next/qidian-next.json').read_bytes()).hexdigest()==stable_hash

          VERSION='1.1.0-beta34'; VC=11034; DATE='2026-09-10'; TS='2026-09-10T00:15:00+08:00'
          summary='Beta34：压缩评论页点赞列和右侧留白，让同一区域显示更多评论文字。'
          tags=['起点','测试版','段评','评论页','UI优化','信息密度','楼中楼','X-QD']
          changes=['根评论点赞区由宽侧栏改为紧凑右侧图标+数字，正文可用宽度增加','楼中楼点赞列同步缩窄，减少每条回复右侧空白','轻微收紧评论卡片横向/纵向内边距，保持头像、标签、时间、楼层、图片与回复功能','仅修改 review_local_ui 视觉层；评论数据/请求/分页、X限免 Provider及其它域冻结']
          raw=f'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}'
          backup=f'https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}'
          imp='legado://import/importonline?src='+raw
          detail='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/details/beta/qidian-next.json'
          sha=hashlib.sha256(SRC.read_bytes()).hexdigest()
          def entry(base=None, include_type=False):
            e=dict(base or {})
            e.update({'id':'qidian-next-beta','name':'🌈 起点增强 · Beta','summary':summary,'icon':e.get('icon',''),'channel':'beta','version':VERSION,'updatedAt':DATE,'tags':tags,'changelog':changes,'sourceUrl':raw,'backupUrl':backup,'importUrl':imp,'detailUrl':detail,'versionCode':VC})
            if include_type:e['type']='novel'
            return e
          # manifest
          mp=Path('manifest.json'); m=json.loads(mp.read_text()); m['updatedAt']=TS
          found=False
          for i,e in enumerate(m.get('sources',[])):
            if e.get('id')=='qidian-next-beta':
              ne=dict(e); ne.update({'name':'🌈 起点增强 · Beta','category':'novel','channel':'beta','version':VERSION,'versionCode':VC,'updatedAt':TS,'sourcePath':'sources/novel/qidian-next/qidian-next-beta.json','sourceUrl':raw,'bookSourceUrl':'https://m.qidian.com/?qf_source=qidian_next_8d7','summary':summary,'tags':tags,'changelog':changes,'sha256':sha}); m['sources'][i]=ne; found=True; break
          assert found
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2))
          # beta catalog
          bp=Path('subscription/beta.json'); bj=json.loads(bp.read_text()); bj['updatedAt']=TS; bj['generatedAt']=TS
          for i,e in enumerate(bj['items']):
            if e.get('id')=='qidian-next-beta': bj['items'][i]=entry(e); break
          else: bj['items'].append(entry())
          bp.write_text(json.dumps(bj,ensure_ascii=False,indent=2))
          # novel type catalog
          np=Path('subscription/novel.json'); nj=json.loads(np.read_text()); nj['updatedAt']=TS; nj['generatedAt']=TS
          for i,e in enumerate(nj['items']):
            if e.get('id')=='qidian-next-beta': nj['items'][i]=entry(e,True); break
          else: nj['items'].append(entry(include_type=True))
          np.write_text(json.dumps(nj,ensure_ascii=False,indent=2))
          # detail card
          dp=Path('rss/data/details/beta/qidian-next.json')
          d={'kind':'source','title':'🌈 起点增强 · Beta','summary':summary,'badges':['Beta',VERSION,'评论密度'],
             'sections':[{'title':'本版更新','text':'点赞按钮改为紧凑右侧布局，根评论和楼中楼都减少点赞列占宽，让正文/回复获得更多横向空间。'},
                         {'title':'保留范围','text':'头像、身份标签、图片/配音、时间/IP/楼层、楼中楼展开与继续加载均保留；评论请求与数据解析不改。'},
                         {'title':'版本状态','text':'当前为 Beta / 测试通道，需真机确认后才会晋升正式版。'},
                         {'title':'更新方式','text':'从本订阅页重新导入/更新即可覆盖现有 🌈 起点增强 · Beta。'}],
             'sourceUrl':raw,'backupUrl':backup,'importUrl':imp}
          dp.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          # bundle: preserve all unrelated beta sources, replace qidian-next logical source
          bund=Path('bundles/all-beta.json')
          try: ba=json.loads(bund.read_text())
          except Exception: ba=[]
          if not isinstance(ba,list): ba=[]
          src_obj=arr[0] if isinstance(arr,list) else arr
          replaced=False
          for i,o in enumerate(ba):
            if isinstance(o,dict) and o.get('bookSourceUrl')==src_obj.get('bookSourceUrl'):
              ba[i]=src_obj; replaced=True; break
          if not replaced:
            # rebuild from beta catalog source paths if bundle is empty/corrupt
            if not ba:
              for ce in bj.get('items',[]):
                url=ce.get('sourceUrl','')
                mid=re.search(r'/main/(.+?)(?:\?v=\d+)?$',url)
                path=mid.group(1) if mid else ''
                if not path or not Path(path).exists(): continue
                try:
                  q=json.loads(Path(path).read_text()); objs=q if isinstance(q,list) else [q]
                  ba.extend([x for x in objs if isinstance(x,dict)])
                except Exception: pass
            else: ba.append(src_obj)
          # de-dup by bookSourceUrl, last wins
          dd={}; order=[]
          for o in ba:
            if not isinstance(o,dict): continue
            k=str(o.get('bookSourceUrl') or o.get('bookSourceName') or len(order))
            if k not in dd: order.append(k)
            dd[k]=o
          bund.write_text(json.dumps([dd[k] for k in order],ensure_ascii=False,indent=2))
          # release log
          rp=Path('docs/RELEASE_LOG.md'); old=rp.read_text()
          head='## 2026-09-10 · 起点增强 1.1.0-beta34 — 评论页信息密度优化\n\n- Stable 保持 1.1.0 不变。\n- 根评论点赞区域收窄并贴近右侧，减少 `mainRow` 的右侧预留，让长评论获得更多横向显示空间。\n- 楼中楼 `rLike` 同步缩窄，回复卡片右侧 padding 减少；点赞图标和数字仍完整保留。\n- 仅修改 lazy `review_local_ui` 的 CSS；评论数据、接口、排序、身份标签、楼中楼分页及 X-QD Provider 均冻结。\n- 状态：Beta，等待真机确认。\n\n'
          rp.write_text(head+old)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md
          git commit -m 'feat: publish qidian-next beta34 compact review UI'
          git push origin main
