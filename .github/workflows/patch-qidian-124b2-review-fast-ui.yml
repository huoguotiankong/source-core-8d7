name: patch-qidian-124b2-review-fast-ui
on:
  push:
    branches:
      - qidian-124b2-review-fast-ui
    paths:
      - '.staging/patch-qidian-124b2-review-fast-ui.trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qidian-124b2-review-fast-ui
      - name: Generate qidian-next 1.2.4-beta2
        run: python3 .staging/patch_qidian_124b2_review_fast_ui.py
      - name: Commit generated Beta
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            sources/novel/qidian-next/qidian-next-beta.json \
            manifest.json \
            subscription/beta.json \
            subscription/novel.json \
            bundles/all-beta.json \
            rss/data/details/beta/qidian-next.json \
            docs/RELEASE_LOG.md \
            docs/sources/qidian-next/PROJECT_HANDOFF.md
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'qidian beta: 1.2.4-beta2 review fast path and identity layout'
          git push origin qidian-124b2-review-fast-ui
