name: promote-qidian-127-stable
on:
  push:
    paths:
      - '.staging/qidian-127-stable.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Promote qidian-next 1.2.7 Stable
        run: python .staging/promote_qidian_127_stable.py
      - name: Commit promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/novel/qidian-next/qidian-next.json manifest.json subscription/stable.json subscription/beta.json subscription/novel.json bundles/all-stable.json bundles/all-beta.json rss/data/details/stable/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md .staging/qidian-127-stable-report.json
          git diff --cached --quiet && exit 0
          git commit -m "qidian stable: promote 1.2.7-beta11 to 1.2.7"
          git push origin HEAD:main
