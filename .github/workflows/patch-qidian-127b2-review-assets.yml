name: patch-qidian-127b2-review-assets
on:
  push:
    paths:
      - '.staging/patch-qidian-127b2-review-assets.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build qidian-next 1.2.7-beta2
        run: python .staging/patch_qidian_127b2_review_assets.py
      - name: Commit generated Beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md .staging/qidian-127b2-report.json
          git diff --cached --quiet && exit 0
          git commit -m "qidian beta: publish 1.2.7-beta2 review assets"
          git push origin HEAD:main
