name: patch-qidian-beta20
on:
  push:
    paths: ['.staging/patch-qidian-beta20.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore Beta14 stable baseline and patch only multi-image handoff
        shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip,hashlib,copy
          from pathlib import Path

          stable_p=Path('sources/novel/qidian-next/qidian-next.json')
          beta_p=Path('sources/novel/qidian-next/qidian-next-beta.json')
          stable_doc=json.loads(stable_p.read_text(encoding='utf-8'))

          def find(o,name):
              if isinstance(o,dict):
                  if o.get('bookSourceName')==name:return o
                  for v in o.values():
                      r=find(v,name)
                      if r:return r
              elif isinstance(o,list):
                  for v in o:
                      r=find(v,name)
                      if r:return r
          stable_src=find(stable_doc,'🌈 起点增强'); assert stable_src
          # Stable is the user-confirmed Beta14 baseline.
          src=copy.deepcopy(stable_src)
          src['bookSourceName']='🌈 起点增强 · Beta'
          js=src['jsLib']
          m=re.search(r'"circle":"gz:([A-Za-z0-9+/=]+)"',js); assert m
          old_b64=m.group(1)
          circle=gzip.decompress(base64.b64decode(old_b64)).decode('utf-8')

          # Exact Beta14 invariants: detail click and feed paging must remain untouched.
          assert "bindPostOpens(root)" in circle
          assert "detail.addEventListener('scroll'" in circle
          assert "state.previewImgs=pim?[pim]:[]" in circle
          assert "data-img='\"+E(String(p.image||\"\"))+\"'" in circle
          assert "data-img=\\\"'+esc(ims.length?ims[0]:'')+'\\\"" in circle

          # 1) Initial/server-rendered cards: pass the full existing p.images array as percent-encoded JSON.
          old1="data-img='\"+E(String(p.image||\"\"))+\"'"
          new1="data-img='\"+E(encodeURIComponent(JSON.stringify(Array.isArray(p.images)?p.images.slice(0,9):(p.image?[p.image]:[]))))+\"'"
          circle=circle.replace(old1,new1,1)

          # 2) Dynamically loaded cards: same handoff; do not alter feedCard click/paging structure.
          old2="data-img=\\\"'+esc(ims.length?ims[0]:'')+'\\\""
          new2="data-img=\\\"'+esc(encodeURIComponent(JSON.stringify(ims.slice(0,9))))+'\\\""
          circle=circle.replace(old2,new2,1)

          # 3) Existing Beta14 onclick stays exactly where it is; only decode the image payload.
          old3="var pim=qfNormUrl(this.getAttribute('data-img')||'');state.previewImgs=pim?[pim]:[];"
          new3="var rawImg=String(this.getAttribute('data-img')||''),pims=[];try{var pa=JSON.parse(decodeURIComponent(rawImg));if(Array.isArray(pa)){for(var pi=0;pi<pa.length&&pi<9;pi++){var pu=qfNormUrl(pa[pi]);if(pu&&pims.indexOf(pu)<0)pims.push(pu);}}}catch(_pi){var pim=qfNormUrl(rawImg);if(pim)pims=[pim];}state.previewImgs=pims;"
          assert circle.count(old3)==1
          circle=circle.replace(old3,new3,1)

          # Hard regression checks: no Beta15+ interaction/paging rewrites are allowed back in.
          assert 'qfOpenPostDirect' not in circle
          assert 'qfEnsureFeedMoreButton' not in circle
          assert "document.addEventListener('touchend', qfPostOpenEvent" not in circle
          assert "state.previewImgs=pim?[pim]:[]" not in circle
          assert new1 in circle and new2 in circle and new3 in circle
          assert circle.count("bindPostOpens(root)")==1
          assert circle.count("detail.addEventListener('scroll'")==1

          new_b64=base64.b64encode(gzip.compress(circle.encode('utf-8'),compresslevel=9,mtime=0)).decode('ascii')
          js=js[:m.start(1)]+new_b64+js[m.end(1):]
          src['jsLib']=js
          src['bookSourceComment']='v1.1.0-beta20：回退到已真机确认的 Beta14/Stable 书友圈基线，只修帖子详情多图参数传递。原查看详情 onclick、详情 API、详情滚动、列表连续分页、评论/楼中楼全部保持 Beta14 原样；仅把列表已有图片数组以 percent-encoded JSON 传入既有 state.previewImgs，单图旧格式保留兼容。其它域冻结。'
          beta_p.write_text(json.dumps([src],ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          # roundtrip + packed module verification
          bdoc=json.loads(beta_p.read_text(encoding='utf-8')); assert isinstance(bdoc,list) and bdoc
          bsrc=bdoc[0]; assert bsrc['bookSourceName']=='🌈 起点增强 · Beta'
          mm=re.search(r'"circle":"gz:([A-Za-z0-9+/=]+)"',bsrc['jsLib']); assert mm
          cc=gzip.decompress(base64.b64decode(mm.group(1))).decode('utf-8')
          assert new1 in cc and new2 in cc and new3 in cc
          assert 'qfOpenPostDirect' not in cc and 'qfEnsureFeedMoreButton' not in cc
          sha=hashlib.sha256(beta_p.read_bytes()).hexdigest()

          # Manifest
          mp=Path('manifest.json'); man=json.loads(mp.read_text(encoding='utf-8')); hit=False
          for it in man.get('sources',[]):
              if it.get('id')=='qidian-next-beta':
                  it.update({
                    'version':'1.1.0-beta20','versionCode':11020,'updatedAt':'2026-08-28T23:43:00+08:00',
                    'sourceUrl':'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11020',
                    'summary':'书友圈 beta20：整体回退 Beta14 真机稳定基线，仅最小修复帖子详情多图传递。',
                    'tags':['起点','测试版','书友圈','Beta14回退','帖子详情','多图','最小修复'],
                    'changelog':['书友圈整体恢复到 Beta14/Stable 真机确认代码，不继承 Beta15-beta19 的详情/分页补丁','保持原 bindPostOpens onclick、getpostdetail、详情滚动与列表分页逻辑原样','仅把列表已有 images 数组编码后传给既有 state.previewImgs，详情仍使用原 topicHtml 多图渲染','旧单图 data-img 仍可回退解析；其它域冻结'],
                    'sha256':sha})
                  hit=True;break
          assert hit; man['updatedAt']='2026-08-28T23:43:00+08:00'; mp.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Subscription
          bp=Path('subscription/beta.json'); sub=json.loads(bp.read_text(encoding='utf-8')); hit=False
          for it in sub.get('items',[]):
              if it.get('id')=='qidian-next-beta':
                  it.update({
                    'summary':'书友圈 beta20：回退 Beta14 真机稳定基线，只改多图参数传递。','version':'1.1.0-beta20','updatedAt':'2026-08-28',
                    'tags':['起点','测试版','书友圈','Beta14回退','帖子详情','多图','最小修复'],
                    'changelog':['恢复 Beta14/Stable 书友圈全部交互和分页代码','只将已有图片数组安全传给原 state.previewImgs','不修改原详情点击、详情 API、滚动分页和评论逻辑','其它域冻结'],
                    'sourceUrl':'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11020',
                    'backupUrl':'https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v=11020',
                    'importUrl':'legado://import/importonline?src=https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11020'})
                  hit=True;break
          assert hit; sub['updatedAt']='2026-08-28T23:43:00+08:00';sub['generatedAt']='2026-08-28T23:43:00+08:00';bp.write_text(json.dumps(sub,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Beta bundle: replace qidian-next beta object with restored+patched beta source.
          bunp=Path('bundles/all-beta.json'); bun=json.loads(bunp.read_text(encoding='utf-8')); cnt=[0]
          def rb(o):
              if isinstance(o,list):
                  for i,v in enumerate(o):
                      if isinstance(v,dict) and v.get('bookSourceUrl')==src.get('bookSourceUrl') and '起点增强' in str(v.get('bookSourceName','')):
                          o[i]=src;cnt[0]+=1
                      else:rb(v)
              elif isinstance(o,dict):
                  for k,v in list(o.items()):
                      if isinstance(v,dict) and v.get('bookSourceUrl')==src.get('bookSourceUrl') and '起点增强' in str(v.get('bookSourceName','')):
                          o[k]=src;cnt[0]+=1
                      else:rb(v)
          rb(bun); assert cnt[0]>=1
          bunp.write_text(json.dumps(bun,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          rp=Path('docs/RELEASE_LOG.md'); old=rp.read_text(encoding='utf-8')
          rp.write_text(f'''## 2026-08-28 — 起点增强 1.1.0-beta20\n\nStatus: Beta/Test; rollback-first recovery after Beta15+ community regressions.\n\nChanges:\n\n- User confirmed the community module was healthy before the multi-image change; repository history identifies Beta14 as the real-device-confirmed baseline and Beta15 as the first multi-image patch.\n- Rebuilt Beta from current Stable (the Beta14-confirmed baseline), discarding Beta15-beta19 circle interaction/pagination rewrites.\n- Preserved the original Beta14 `bindPostOpens` onclick, `getpostdetail`, detail scroll pagination, feed pagination, comments and nested replies.\n- Only changed the image handoff: existing list `images` are percent-encoded as JSON in `data-img`, then decoded into the already-existing `state.previewImgs`; legacy single-image values still fall back correctly.\n- Stable remains unchanged. Other domains remain frozen.\n- SHA256: `{sha}`.\n\n'''+old,encoding='utf-8')
          print('BETA20_OK',sha,'bundle',cnt[0], 'circle_len',len(cc))
          PY
          git diff --check
      - name: Commit beta20
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m 'fix(qidian): rollback circle to beta14 and patch only multi-image handoff beta20'
          git push origin main
