name: publish-picacg-beta3-enhance
on:
  push:
    branches: [main]
    paths:
      - 'hotfix/picacg-beta3/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and publish Picacg beta3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, pathlib
          from datetime import datetime, timezone, timedelta

          ROOT = pathlib.Path('.')
          target = ROOT/'sources/comic/picacg/picacg-beta.json'
          data = json.loads(target.read_text(encoding='utf-8'))
          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit('Picacg source must contain exactly one source object')
          src = data[0]
          if src.get('bookSourceUrl') != 'https://sc8d7.invalid/legado/picacg-8d7':
              raise SystemExit('Picacg identity mismatch')

          # 1) Reader custom button: make book-id recovery robust in manga image reader context.
          js = src['jsLib']
          old = 'function picaOpenCommunityButton(j,src,currentBook,currentChapter){return picaOpenCommunity.call({java:j,source:src,book:currentBook,chapter:currentChapter});}\nfunction picaBookInfoOpenComments(){return picaOpenCommunity.call(this);}'
          new = '''function picaReaderBookId(ch){
    var vals=[];
    try{if(ch)vals.push(ch.url,ch.baseUrl,ch.chapterUrl,ch.origin);}catch(e){}
    for(var i=0;i<vals.length;i++){var id=picaBookId(vals[i]);if(id)return id;}
    return "";
}
function picaOpenCommunityButton(j,src,currentBook,currentChapter){
    var ctx={java:j,source:src,book:currentBook,chapter:currentChapter};
    var forced=picaReaderBookId(currentChapter)||picaBookIdFromContext(ctx)||picaGetSetting(ctx,"pica_last_book_id","");
    return picaOpenCommunity.call(ctx,forced);
}
function picaBookInfoOpenTag(label,kind){
    var j=picaCtxJava(this),t=picaStr(label).trim();if(!t)return true;
    kind=picaStr(kind||"tag");
    try{if(j&&j.open)j.open("explore",PICA_ROUTE_BASE+"/?legado=picacg_explore&type=tag&tag="+encodeURIComponent(t)+"&kind="+encodeURIComponent(kind)+"&s=dd&page={{page}}","🏷 "+t);}catch(e){if(j)j.longToast("打开标签失败："+String(e&&e.message||e));}
    return true;
}
function picaBookInfoOpenComments(){return picaOpenCommunity.call(this);}'''
          if old not in js:
              raise SystemExit('community button baseline not found')
          src['jsLib'] = js.replace(old, new, 1)

          # 2) Remove the last .invalid runtime carrier in Login -> My Favorites.
          lu = src['loginUrl']
          old = 'java.open("explore",PICA_SOURCE_ID+"/explore?type=favourite&page={{page}}","⭐ 我的收藏");'
          new = 'java.open("explore",PICA_ROUTE_BASE+"/?legado=picacg_explore&type=favourite&page={{page}}","⭐ 我的收藏");'
          if old not in lu:
              raise SystemExit('openFavorites baseline not found')
          src['loginUrl'] = lu.replace(old, new, 1)

          # 3) Detail page: keep categories/tags separately and render them as clickable chips without extra network requests.
          init = src['ruleBookInfo']['init']
          old = 'java.put("pica_kind",cats.concat(tags).join(" · ")+(c.finished?" · 完结":" · 连载"));java.put("pica_bookid",id);'
          new = 'java.put("pica_kind",cats.concat(tags).join(" · ")+(c.finished?" · 完结":" · 连载"));java.put("pica_categories",JSON.stringify(cats));java.put("pica_tags",JSON.stringify(tags));java.put("pica_team",String(c.chineseTeam||""));java.put("pica_status",c.finished?"已完结":"连载中");java.put("pica_bookid",id);'
          if old not in init:
              raise SystemExit('book-info init baseline not found')
          src['ruleBookInfo']['init'] = init.replace(old, new, 1)
          src['ruleBookInfo']['intro'] = '''<js>
var desc=String(java.get("pica_intro")||""),stats=String(java.get("pica_stats")||"");
var cats=picaJson(java.get("pica_categories"),[]),tags=picaJson(java.get("pica_tags"),[]),team=String(java.get("pica_team")||""),status=String(java.get("pica_status")||"");
function picaDetailChip(t,k){t=String(t||"").trim();if(!t)return "";var p=k==="category"?"📂 ":"# ";return "<button>"+p+picaEsc(t)+"@onclick:picaBookInfoOpenTag.call(this,"+JSON.stringify(t)+","+JSON.stringify(k)+")</button> ";}
var html="<button>💬 哔咔评论@onclick:picaBookInfoOpenComments.call(this)</button> "
        +"<button>♥ 点赞@onclick:picaBookInfoLike.call(this)</button> "
        +"<button>⭐ 收藏@onclick:picaBookInfoFavourite.call(this)</button> "
        +"<button>🧭 相关推荐@onclick:picaBookInfoRecommend.call(this)</button>";
html+="<br><br><b>"+picaEsc(stats)+"</b>";
var meta=[];if(status)meta.push(status);if(team)meta.push("汉化组："+team);if(meta.length)html+="<br>"+picaEsc(meta.join(" · "));
var seen={},chips="",i,t;for(i=0;i<cats.length;i++){t=String(cats[i]||"").trim();if(t&&!seen[t]){seen[t]=1;chips+=picaDetailChip(t,"category");}}
for(i=0;i<tags.length;i++){t=String(tags[i]||"").trim();if(t&&!seen[t]){seen[t]=1;chips+=picaDetailChip(t,"tag");}}
if(chips)html+="<br><br><b>🏷 分类与标签</b><br>"+chips;
if(desc)html+="<br><br>"+picaEsc(desc).replace(/\r\n|\r|\n/g,"<br>");
"<usehtml>"+html+"</usehtml>";
</js>'''

          # 4) Explore supports a dedicated tag page. Category chips use exact category filtering;
          #    free-form tags first try the same API filter and fall back to advanced search only if empty.
          exp = src['ruleExplore']['bookList']
          needle = '    else if(type==="category"){'
          if needle not in exp:
              raise SystemExit('explore category baseline not found')
          tag_branch = '''    else if(type==="tag"){
      var tg=(u.match(/[?&]tag=([^&]+)/)||[])[1]||"",tk=(u.match(/[?&]kind=([^&]+)/)||[])[1]||"tag",docs=[];try{tg=decodeURIComponent(tg);tk=decodeURIComponent(tk);}catch(_tg){}
      if(tg){
        if(tk==="category"){var jt=picaRequest(this,"comics?page="+p+"&c="+encodeURIComponent(tg)+"&s="+encodeURIComponent(srt),"GET");docs=((jt.data||{}).comics||{}).docs||[];}
        else{
          try{var jt=picaRequest(this,"comics?page="+p+"&c="+encodeURIComponent(tg)+"&s="+encodeURIComponent(srt),"GET");docs=((jt.data||{}).comics||{}).docs||[];}catch(_tc){}
          if(!docs.length){var js=picaRequest(this,"comics/advanced-search?page="+p,"POST",{keyword:tg,sort:srt});docs=((js.data||{}).comics||{}).docs||[];}
        }
      }
      list=docs;
    }
'''
          src['ruleExplore']['bookList'] = exp.replace(needle, tag_branch + needle, 1)

          # 5) Discovery UI: beta2's 4-column category grid truncated labels on device. Use readable 3-column chips.
          eu = src['exploreUrl']
          n = eu.count(',0.24);')
          if n < 10:
              raise SystemExit('unexpected explore grid baseline')
          src['exploreUrl'] = eu.replace(',0.24);', ',0.31);')

          # 6) Login layout: keep selectors readable and stop the APP channel / Login button collision.
          ui = json.loads(src['loginUi'])
          for item in ui:
              name = item.get('name')
              if name == 'APP通道':
                  item['style'] = {'layout_flexGrow':1,'layout_flexBasisPercent':1,'layout_wrapBefore':True}
              elif name == '登录':
                  item['style'] = {'layout_flexGrow':1,'layout_flexBasisPercent':1,'layout_wrapBefore':True}
              elif name in ('账户中心','每日签到','我的收藏','线路诊断','打开网页端','注册账号'):
                  item['style'] = {'layout_flexGrow':1,'layout_flexBasisPercent':0.48}
              elif name == '退出登录':
                  item['style'] = {'layout_flexGrow':1,'layout_flexBasisPercent':1}
          src['loginUi'] = json.dumps(ui, ensure_ascii=False, separators=(',',':'))

          # Keep content callback explicit; the helper above now resolves reader/chapter context robustly.
          src['ruleContent']['callBackJs'] = '''if (event == "clickCustomButton") {
    picaOpenCommunityButton(java, source, book, chapter);
    true;
} else {
    0;
}'''

          src['bookSourceComment'] = '''【v1.0.0-beta3 · 2026-08-26】
哔咔漫画 APP/网页双线路增强测试版。

Beta3 基于 Beta2 真机可用主线继续增强：
• 漫画图片阅读页右上角定制按钮强化：优先从当前章节 URL 识别漫画 ID，并保留书籍上下文/最近漫画兜底，直接进入同一本漫画评论中心。
• 详情页新增可点击“分类与标签”：分类直接进入对应分类页；普通标签优先按标签过滤，必要时回退站内搜索。
• 标签展示复用详情接口已经返回的 categories/tags，不为详情首屏新增网络请求。
• 发现页分类入口由四列改为三列，减少“大家都…”“WEBTO…”这类文字截断。
• 登录页重新整理按钮布局，APP通道和登录不再挤在同一行；账户/签到、收藏/诊断、网页/注册按双列排列。
• 修复登录页“我的收藏”仍使用 .invalid 身份地址作为外层请求地址的残留问题。

保留：登录、自动续登、账户中心、签到、收藏、点赞、搜索、排行榜、随机、相关推荐、完整目录/图片、热门/最新评论、楼中楼、评论点赞/发表/回复和 APP/Web 自动切换。

本版仍为 Beta，等待真机确认新增交互。'''
          src['variableComment'] = '''本源默认不需要设置书籍变量。
线路与清晰度请在“书源登录”页面设置。

右上角定制按钮：详情/漫画图片阅读页均用于打开当前漫画的哔咔评论中心。
详情页“分类与标签”可点击进入对应内容页。'''

          # Runtime invariant: synthetic identity must not leak back into operational outer URLs.
          assert 'PICA_SOURCE_ID' not in src['loginUrl']
          assert 'PICA_SOURCE_ID' not in src['exploreUrl']
          assert 'PICA_SOURCE_ID' not in src['searchUrl']
          assert 'PICA_SOURCE_ID' not in src['ruleToc']['chapterList']
          assert 'picaBookInfoOpenTag' in src['jsLib']
          assert 'type==="tag"' in src['ruleExplore']['bookList']
          assert 'picaOpenCommunityButton' in src['ruleContent']['callBackJs']

          now_dt = datetime.now(timezone(timedelta(hours=8)))
          now = now_dt.isoformat(timespec='seconds')
          day = now_dt.date().isoformat()
          src['lastUpdateTime'] = int(now_dt.timestamp()*1000)
          raw = (json.dumps(data, ensure_ascii=False, indent=2)+'\n').encode('utf-8')
          # Full JSON round-trip smoke check before writing.
          json.loads(raw.decode('utf-8'))
          target.write_bytes(raw)
          sha = hashlib.sha256(raw).hexdigest()

          version='1.0.0-beta3'; versionCode=10003
          summary='Beta3 增强：漫画图片页定制按钮直达评论；详情分类/标签可点击；发现与登录布局优化，并清理收藏入口残留的 .invalid 运行时地址。'
          tags=['哔咔','漫画','APP API','网页线路','登录','账户','签到','收藏','评论','楼中楼','阅读页定制按钮','可点击标签','详情增强','双线路']
          changes=[
            '漫画图片阅读页定制按钮强化，章节 URL / 当前书 / 最近书籍 ID 多级识别后直达评论中心',
            '详情页把 API 已返回的 categories/tags 渲染成可点击入口，不增加详情首屏网络请求',
            '新增标签页路由：分类精确过滤，普通标签过滤为空时回退 advanced-search',
            '发现页分类按钮从四列调整为三列，减少真机文字省略',
            '登录页重排 APP通道、登录及功能按钮，改善分组与触控面积',
            '修复登录页“我的收藏”仍以 PICA_SOURCE_ID/.invalid 作为外层地址的残留问题',
            '正文图片、评论接口、楼中楼、账号认证和双线路核心请求逻辑保持不变'
          ]
          raw_url='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/comic/picacg/picacg-beta.json'
          backup='https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/comic/picacg/picacg-beta.json'
          detail_path='rss/data/details/beta/picacg.json'
          detail_url='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/'+detail_path

          mp=ROOT/'manifest.json'; manifest=json.loads(mp.read_text(encoding='utf-8')); manifest['updatedAt']=now
          for x in manifest.get('sources',[]):
              if x.get('id')=='picacg':
                  x.update(version=version,versionCode=versionCode,updatedAt=now,summary=summary,tags=tags,changelog=changes,sha256=sha)
                  break
          else: raise SystemExit('picacg manifest entry missing')
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def update_catalog(path):
              o=json.loads(path.read_text(encoding='utf-8')); o['updatedAt']=now
              for x in o.get('items',[]):
                  if x.get('id')=='picacg':
                      x.update(name='🍥 哔咔漫画 · APP/网页双线路 Beta',summary=summary,channel='beta',version=version,updatedAt=day,tags=tags,changelog=changes,sourceUrl=raw_url,backupUrl=backup,importUrl='legado://import/bookSource?src='+raw_url,detailUrl=detail_url)
                      return o
              raise SystemExit('picacg catalog entry missing: '+str(path))
          for rel in ['subscription/beta.json','subscription/comic.json']:
              p=ROOT/rel; p.write_text(json.dumps(update_catalog(p),ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          detail={
            'kind':'source','title':'🍥 哔咔漫画 · APP/网页双线路 Beta','summary':summary,
            'badges':['BETA',version,'漫画源','标签/阅读页增强'],
            'sections':[
              {'title':'本轮状态','text':'Beta2 的搜索、发现、详情、目录、正文图片和评论等基本功能已由用户真机确认基本实现；Beta3 继续验证新增交互。'},
              {'title':'阅读页评论入口','text':'漫画图片阅读页右上角定制按钮会从当前章节 URL、当前书籍上下文和最近漫画 ID 多级识别，直接打开当前漫画评论中心。'},
              {'title':'分类与标签','text':'详情页直接使用现有漫画详情响应中的 categories/tags 生成可点击按钮，不新增详情首屏请求。分类走精确分类列表；普通标签在无直接结果时回退站内高级搜索。'},
              {'title':'界面优化','text':'发现页分类入口改为更可读的三列布局；登录页重新整理 APP 通道、登录和常用功能按钮，避免真机拥挤与文字截断。'},
              {'title':'网络安全线','text':'bookSourceUrl 的 .invalid 地址继续仅作身份。Beta3 同时清理了登录页“我的收藏”残留的身份地址运行时引用。'},
              {'title':'发布状态','text':'Beta / 测试版；Stable 未修改。'},
              {'title':'唯一身份','text':'https://sc8d7.invalid/legado/picacg-8d7'}
            ],'sourceUrl':raw_url,'backupUrl':backup
          }
          dp=ROOT/detail_path; dp.parent.mkdir(parents=True,exist_ok=True); dp.write_text(json.dumps(detail,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Rebuild all Beta sources without dropping unrelated entries.
          beta=[]
          for x in manifest.get('sources',[]):
              if x.get('channel')!='beta': continue
              fp=ROOT/str(x.get('sourcePath') or '')
              if fp.exists():
                  obj=json.loads(fp.read_text(encoding='utf-8'))
                  if isinstance(obj,list): beta.extend(obj)
          (ROOT/'bundles/all-beta.json').write_text(json.dumps(beta,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          log=ROOT/'docs/RELEASE_LOG.md'; oldlog=log.read_text(encoding='utf-8')
          marker=f'## {day} — Picacg {version} reader/comment tags enhancement'
          if marker not in oldlog:
              block=(marker+'\n\nStatus: Beta/Test; Beta2 core functions reported basically working on real device, Beta3 enhancements awaiting confirmation.\n\nChanges:\n\n'+''.join('- '+c+'\n' for c in changes)+f'- Published SHA256: `{sha}`.\n\n')
              lines=oldlog.splitlines(True); oldlog=(lines[0]+'\n'+block+''.join(lines[1:])) if lines and lines[0].startswith('# RELEASE LOG') else block+oldlog
              log.write_text(oldlog,encoding='utf-8')

          kp=ROOT/'docs/KNOWN_ISSUES.md'; known=kp.read_text(encoding='utf-8')
          heading='## Picacg remaining identity shortcut / reader context gap — fixed in 1.0.0-beta3'
          if heading not in known:
              known += ('\n\n'+heading+'\n\nBeta3 audit after Beta2 real-device testing found one remaining shortcut: `openFavorites()` in the login page still built its outer Explore URL from `PICA_SOURCE_ID`, even though the main discovery/search/catalog paths had already moved to a real HTTPS carrier. Beta3 changes it to `PICA_ROUTE_BASE`.\n\nThe manga-reader custom button already had a content callback, but its book-id lookup depended on the reader providing a complete `book` object. Beta3 explicitly parses the current chapter URL first and then falls back to the book context / remembered id.\n\nStatus: fixed in 1.0.0-beta3; awaiting real-device confirmation of the new reader-button and detail-tag interactions.\n')
              kp.write_text(known,encoding='utf-8')

          # Syntax smoke files for node --check.
          pathlib.Path('/tmp/pica-jslib.js').write_text(src['jsLib'],encoding='utf-8')
          for key, text in [('intro',src['ruleBookInfo']['intro']),('explore',src['ruleExplore']['bookList'])]:
              t=text.strip()
              if t.startswith('<js>'): t=t[4:]
              if t.endswith('</js>'): t=t[:-5]
              pathlib.Path('/tmp/pica-'+key+'.js').write_text(t,encoding='utf-8')

          ready=ROOT/'hotfix/picacg-beta3/READY'
          if ready.exists(): ready.unlink()
          try: ready.parent.rmdir()
          except OSError: pass
          print('published beta3',len(raw),'bytes',sha)
          PY
          node --check /tmp/pica-jslib.js
          node --check /tmp/pica-intro.js
          node --check /tmp/pica-explore.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: publish Picacg beta3 reader and tag enhancements'
          git push origin main
