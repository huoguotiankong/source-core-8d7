name: publish-picacg-beta3-enhance
on:
  push:
    branches: [main]
    paths:
      - 'hotfix/picacg-beta3/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and publish Picacg beta3
        shell: bash
        run: |
          set -euo pipefail
          python -c "p='tools/publish_picacg_beta3.py';s=open(p,encoding='utf-8').read();s=s.replace(\"src['ruleBookInfo']['intro'] = '''<js>\",\"src['ruleBookInfo']['intro'] = r'''<js>\");open(p,'w',encoding='utf-8').write(s)"
          python tools/publish_picacg_beta3.py
          node --check /tmp/pica-jslib.js
          node --check /tmp/pica-intro.js
          node --check /tmp/pica-explore.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: publish Picacg beta3 reader and tag enhancements'
          git push origin main
