name: diag-qidian-beta37-qw-callers
on:
  push:
    paths: ['.staging/diag-qidian-beta37-qw-callers.trigger']
jobs:
  dump:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Dump qfQwContentV44 callers
        run: |
          python3 - <<'PY'
          import json,gzip,base64
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json')
          arr=json.loads(p.read_text()); s=arr[0] if isinstance(arr,list) else arr
          lib=s['jsLib']; mk='var QF_MOD38_PACK='; a=lib.index(mk)+len(mk); b=lib.index(';\nvar QF_MOD38_EXPORTS=',a); pack=json.loads(lib[a:b])
          out=[]
          for name,v in pack.items():
            try:
              if isinstance(v,str) and v.startswith('gz:'):
                z=v[3:]; z += '='*((4-len(z)%4)%4); code=gzip.decompress(base64.b64decode(z)).decode()
              else: code=str(v)
            except Exception: continue
            needle='qfQwContentV44'
            st=0
            while True:
              i=code.find(needle,st)
              if i<0: break
              out.append(f'===== MODULE {name} @ {i} =====\n'+code[max(0,i-1800):i+2200])
              st=i+1
          Path('.staging/qw-callers-beta37.txt').write_text('\n\n'.join(out) or 'NO MATCH')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qw-callers-beta37.txt
          git commit -m 'chore: dump qidian beta37 qw callers' || true
          git push origin main
