name: audit-qidian-beta4
on:
  push:
    branches: [ main ]
    paths:
      - 'staging/audit-qidian-beta4.trigger'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run audit
        run: python staging/audit_qidian_beta4.py
      - name: Commit audit result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add staging/qidian-beta4-audit.json
          if git diff --cached --quiet; then
            echo 'No audit changes'
          else
            git commit -m 'chore: record qidian beta4 audit'
            git push
          fi
