name: diag-qidian-provider-uses
on:
  push:
    paths: ['.staging/diag-qidian-provider-uses.trigger']
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Extract registry usages
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          a=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text()); s=a[0] if isinstance(a,list) else a
          txt=s['jsLib']+'\n'+s.get('loginUrl','')
          mk='var QF_MOD38_PACK='; x=txt.find(mk); y=txt.find(';\nvar QF_MOD38_EXPORTS=',x)
          if x>=0 and y>x: txt=txt[:x+len(mk)]+'{}'+txt[y:]
          out=[]
          for pat in ['QF_PROVIDER83','tier','限免源选择','同人','qfProviderTier','qfProviderList','qfProviderNames','qfTier']:
            for m in list(re.finditer(re.escape(pat),txt))[:80]:
              out.append('\n### '+pat+' @'+str(m.start())+'\n'+txt[max(0,m.start()-900):m.start()+1800])
          Path('.staging/qidian-provider-uses.txt').write_text('\n'.join(out)[:180000])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-provider-uses.txt
          git commit -m 'chore: dump qidian provider registry usages'
          git push origin HEAD:main
