name: jmcomic-beta1-finalize
on:
  push:
    branches: [main]
    paths:
      - 'incoming/jmcomic-beta1/FINALIZE'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize JMComic beta1 publication
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          from datetime import datetime, timezone, timedelta

          ROOT = pathlib.Path('.')
          src_path = ROOT/'sources/comic/jmcomic/jmcomic-beta.json'
          src_raw = src_path.read_bytes()
          src = json.loads(src_raw.decode('utf-8'))
          assert isinstance(src, list) and len(src) == 1
          assert src[0].get('bookSourceName') == '◈ 禁漫天堂'
          assert src[0].get('bookSourceUrl') == 'https://sc8d7.invalid/legado/jmcomic-8d7'
          assert 'i<=5' in src[0].get('jsLib','')

          parts = [ROOT/f'sources/comic/jmcomic/runtime/runtime-{i}.part' for i in range(1,6)]
          assert all(p.exists() for p in parts), parts
          runtime = ''.join(p.read_text(encoding='utf-8') for p in parts)
          tmp = pathlib.Path('/tmp/jmcomic-runtime.js')
          tmp.write_text(runtime, encoding='utf-8')
          subprocess.run(['node','--check',str(tmp)], check=True)
          required = ['jmApiRequest','jmWebRequest','jmOpenComments','jmComments','jmPostComment','jmToc','jmChapter']
          missing = [x for x in required if x not in runtime]
          assert not missing, missing

          sha = hashlib.sha256(src_raw).hexdigest()
          now_dt = datetime.now(timezone(timedelta(hours=8)))
          now = now_dt.isoformat(timespec='seconds')
          day = now_dt.date().isoformat()

          mp = ROOT/'manifest.json'
          manifest = json.loads(mp.read_text(encoding='utf-8'))
          found = False
          for x in manifest.get('sources',[]):
              if x.get('id') == 'jmcomic':
                  x['sha256'] = sha
                  x['version'] = '0.1.0-beta1'
                  x['versionCode'] = 1001
                  x['channel'] = 'beta'
                  x['updatedAt'] = now
                  found = True
          assert found, 'jmcomic missing in manifest'
          manifest['updatedAt'] = now
          mp.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          for rel in ['subscription/beta.json','subscription/comic.json']:
              p = ROOT/rel
              o = json.loads(p.read_text(encoding='utf-8'))
              hit = [x for x in o.get('items',[]) if x.get('id') == 'jmcomic']
              assert len(hit) == 1, (rel, len(hit))
              item = hit[0]
              item['version'] = '0.1.0-beta1'
              item['channel'] = 'beta'
              item['updatedAt'] = day
              item['sourceUrl'] = 'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/comic/jmcomic/jmcomic-beta.json?v=1001'
              item['backupUrl'] = 'https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/comic/jmcomic/jmcomic-beta.json?v=1001'
              item['importUrl'] = 'legado://import/bookSource?src='+item['sourceUrl']
              item['detailUrl'] = 'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/details/beta/jmcomic.json'
              o['updatedAt'] = now
              o['generatedAt'] = now
              p.write_text(json.dumps(o, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          detail_path = ROOT/'rss/data/details/beta/jmcomic.json'
          detail = json.loads(detail_path.read_text(encoding='utf-8'))
          detail['summary'] = '禁漫天堂 0.1.0-beta1 测试版。APP/API + 网页双线路，动态域名、账号、收藏历史、评论/回复与漫画图片正文已完成仓库发布校验。'
          sections = detail.setdefault('sections',[])
          status = next((x for x in sections if x.get('title') == '当前状态'), None)
          if status:
              status['text'] = 'Beta/Test，尚未经过真机确认。仓库入口 JSON、5 段公共 jsLib、Manifest、Beta/漫画目录均已同步；5 段运行时已在 GitHub Actions 拼接并通过 node --check。'
          detail_path.write_text(json.dumps(detail, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          beta_sources = []
          for x in manifest.get('sources',[]):
              if x.get('channel') != 'beta':
                  continue
              sp = x.get('sourcePath')
              if not sp:
                  continue
              fp = ROOT/sp
              if not fp.exists():
                  continue
              obj = json.loads(fp.read_text(encoding='utf-8'))
              if isinstance(obj,list):
                  beta_sources.extend(obj)
          (ROOT/'bundles/all-beta.json').write_text(json.dumps(beta_sources, ensure_ascii=False, separators=(',',':')), encoding='utf-8')

          log = ROOT/'docs/RELEASE_LOG.md'
          old = log.read_text(encoding='utf-8')
          marker = '## 2026-08-26 — JMComic 0.1.0-beta1 repository publication'
          if marker not in old:
              block = f'''{marker}\n\nStatus: Beta/Test; awaiting user real-device confirmation.\n\nChanges:\n\n- Published `◈ 禁漫天堂` to the Beta and comic catalogs with stable identity `https://sc8d7.invalid/legado/jmcomic-8d7`.\n- Preserved the local Beta1 search/detail/TOC/content rules; only the shared jsLib is stored as five cached runtime parts in the repository.\n- GitHub Actions concatenated the five runtime parts and passed `node --check`.\n- Synchronized Manifest, Beta subscription, comic subscription, Beta RSS detail and rebuilt the complete Beta bundle.\n- Features include APP/API + Web dual routes, dynamic domain refresh, login/account, favourites/history, comments/replies and manga image de-scrambling.\n- Published repository source SHA256: `{sha}`.\n\n'''
              log.write_text(block+old, encoding='utf-8')

          handoff = ROOT/'docs/sources/jmcomic/PROJECT_HANDOFF.md'
          handoff.parent.mkdir(parents=True, exist_ok=True)
          handoff.write_text(f'''# JMComic / 禁漫天堂 Project Handoff\n\nUpdated: {day}\n\n## Current release\n\n- Channel: Beta/Test\n- Version: `0.1.0-beta1`\n- Legado identity: `https://sc8d7.invalid/legado/jmcomic-8d7`\n- Repository source: `sources/comic/jmcomic/jmcomic-beta.json`\n- Runtime: `sources/comic/jmcomic/runtime/runtime-1.part` ... `runtime-5.part`\n- Source SHA256: `{sha}`\n\n## Architecture\n\nThe repository entry keeps the Beta1 search/detail/TOC/content rules intact. Shared runtime code is split into five parts and loaded/cached by jsLib. Runtime domains are isolated into APP/API, Web, account, comments, and manga image handling.\n\n## Implemented\n\n- APP/API + Web dual routes with automatic fallback\n- Dynamic API domain refresh and Web publication/permanent-link discovery\n- Login and account center\n- Favourites and watch history\n- Search, discovery, detail, TOC and manga image content\n- Comment center, paging, posting and replies\n- Detail-page comment entry and custom-button comment entry\n- JM image shunts and de-scrambling\n\n## Validation status\n\nStatic repository validation passed, including JSON parse and concatenated runtime `node --check`. Real-device validation is still required before Stable promotion.\n\n## Real-device checklist\n\n1. Refresh domains and run route diagnostics.\n2. Test auto / forced APP / forced Web search.\n3. Test detail, multi-chapter TOC and image content.\n4. Test login, account center, favourites and history.\n5. Open comments from both detail entry and top custom button.\n6. Test comment paging, posting and replies.\n7. Test image shunts 1-4 and scrambled newer chapters.\n''', encoding='utf-8')

          print('JMComic finalized', sha, 'runtime chars', len(runtime), 'beta bundle items', len(beta_sources))
          PY
          rm -f incoming/jmcomic-beta1/FINALIZE
          rm -f .github/workflows/jmcomic-beta1-finalize.yml
          rmdir incoming/jmcomic-beta1 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: finalize jmcomic beta1 repository release'
          git pull --rebase origin main
          git push origin main
