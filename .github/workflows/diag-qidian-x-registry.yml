name: diag-qidian-x-registry
on:
  push:
    paths:
      - '.staging/diag-qidian-x-registry.trigger'
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract registry
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          a=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text()); s=a[0] if isinstance(a,list) else a
          lib=s['jsLib']; out=[]
          def grab(var,nextvar):
              m='var '+var+'='; st=lib.index(m)+len(m); en=lib.index(';\nvar '+nextvar+'=',st); return lib[st:en]
          out.append('EXPORTS='+grab('QF_MOD38_EXPORTS','QF_MOD38_DEPS'))
          # deps ends at next semicolon + following var
          st=lib.index('var QF_MOD38_DEPS=')+len('var QF_MOD38_DEPS='); en=lib.index(';',st); out.append('DEPS='+lib[st:en])
          # exact operational hits after long comment prefix; keep only nearby lines with code keywords
          for token in ['"同人"','同人','limited_tr','qfTrContent']:
              out.append('\nHITS '+token)
              for m in list(re.finditer(re.escape(token),lib))[-20:]:
                  out.append(lib[max(0,m.start()-700):m.start()+1400])
          Path('.staging/qidian-x-registry.txt').write_text('\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-x-registry.txt
          git commit -m 'chore: dump qidian x registry'
          git push origin main
