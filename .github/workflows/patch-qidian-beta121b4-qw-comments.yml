name: patch-qidian-beta121b4-qw-comments
on:
  push:
    paths: ['.staging/patch-qidian-beta121b4-qw-comments.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch
        run: python3 .staging/patch_qidian_beta121b4_qw_comments.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md
          git commit -m 'qidian-next 1.2.1-beta4 qingwu comments' || exit 0
          git push