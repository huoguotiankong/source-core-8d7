name: patch-qidian-beta19b
on:
  push:
    paths:
      - '.staging/patch-qidian-beta19b.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch qidian beta19 corrected
        shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip,hashlib
          from pathlib import Path
          sp=Path('sources/novel/qidian-next/qidian-next-beta.json')
          doc=json.loads(sp.read_text(encoding='utf-8'))
          def fs(o):
              if isinstance(o,dict):
                  if o.get('bookSourceName')=='🌈 起点增强 · Beta': return o
                  for v in o.values():
                      r=fs(v)
                      if r:return r
              elif isinstance(o,list):
                  for v in o:
                      r=fs(v)
                      if r:return r
          src=fs(doc); assert src and 'beta18' in str(src.get('bookSourceComment','')).lower()
          js=src['jsLib']
          def obj_segment(varname):
              start=js.index('var '+varname+'=')
              brace=js.index('{',start); depth=0; ins=False; esc=False
              for i in range(brace,len(js)):
                  ch=js[i]
                  if ins:
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': ins=False
                      continue
                  if ch=='"': ins=True; continue
                  if ch=='{': depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:return start,brace,i+1,js[brace:i+1]
              raise AssertionError(varname+' object not closed')

          # PACK: get exact circle payload from actual module registry.
          ps,pb,pe,pseg=obj_segment('QF_MOD38_PACK')
          pm=re.search(r'"circle"\s*:\s*"gz:([A-Za-z0-9+/=]+)"',pseg); assert pm
          b64=pm.group(1); circle=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          assert 'qfEnsureFeedMoreButton' in circle and 'qfOpenPostDirect' in circle
          circle19=circle
          # Make runtime marker part of generated HTML in a robust way: title + CSS pseudo-badge.
          assert "<title>起点书友圈</title><style>" in circle19
          circle19=circle19.replace("<title>起点书友圈</title><style>","<title>起点书友圈 · B19</title><style>",1)
          cssneedle="body{padding:0 0 26px}"
          if cssneedle in circle19:
              circle19=circle19.replace(cssneedle,cssneedle+"body:after{content:'B19';position:fixed;right:7px;bottom:7px;z-index:99;background:rgba(20,22,28,.72);color:#fff;font-size:9px;padding:2px 5px;border-radius:7px;pointer-events:none}",1)
          else:
              # current modern renderer has a different body css; prepend before first </style> emitted string
              needle="h.push(\"</style></head><body>"
              assert needle in circle19
              circle19=circle19.replace(needle,"h.push(\"body:after{content:'B19';position:fixed;right:7px;bottom:7px;z-index:99;background:rgba(20,22,28,.72);color:#fff;font-size:9px;padding:2px 5px;border-radius:7px;pointer-events:none}</style></head><body>",1)
          assert 'B19' in circle19
          b6419=base64.b64encode(gzip.compress(circle19.encode(),compresslevel=9,mtime=0)).decode()
          # update actual PACK segment only
          assert '"circle_b19"' not in pseg
          pseg2=pseg[:pm.end()]+',"circle_b19":"gz:'+b6419+'"'+pseg[pm.end():]
          js=js[:pb]+pseg2+js[pe:]

          # EXPORTS exact object, after js changed recalc positions.
          def seg_from(text,varname):
              start=text.index('var '+varname+'='); brace=text.index('{',start); depth=0; ins=False; esc=False
              for i in range(brace,len(text)):
                  ch=text[i]
                  if ins:
                      if esc:esc=False
                      elif ch=='\\':esc=True
                      elif ch=='"':ins=False
                      continue
                  if ch=='"':ins=True;continue
                  if ch=='{':depth+=1
                  elif ch=='}':
                      depth-=1
                      if depth==0:return brace,i+1,text[brace:i+1]
              raise AssertionError(varname)
          eb,ee,eseg=seg_from(js,'QF_MOD38_EXPORTS')
          em=re.search(r'"circle"\s*:\s*(\[[^\]]+\])',eseg); assert em and 'qfCircleData' in em.group(1)
          assert '"circle_b19"' not in eseg
          eseg2=eseg[:em.end()]+',"circle_b19":'+em.group(1)+eseg[em.end():]
          js=js[:eb]+eseg2+js[ee:]

          db,de,dseg=seg_from(js,'QF_MOD38_DEPS')
          dm=re.search(r'"circle"\s*:\s*(\[[^\]]*\])',dseg); assert dm
          assert '"circle_b19"' not in dseg
          dseg2=dseg[:dm.end()]+',"circle_b19":'+dm.group(1)+dseg[dm.end():]
          js=js[:db]+dseg2+js[de:]

          # Exact operational routing. Count and replace all matching active entries.
          pairs=[
            ('circleOpen:{module:"circle",entry:"qfOpenQidianCircleV2961",sideEffect:true}','circleOpen:{module:"circle_b19",entry:"qfOpenQidianCircleV2961",sideEffect:true}'),
            ('circleData:{module:"circle",entry:"qfCircleData",model:"circleSet"}','circleData:{module:"circle_b19",entry:"qfCircleData",model:"circleSet"}'),
            ('circleView:{module:"circle",entry:"qfCircleView"}','circleView:{module:"circle_b19",entry:"qfCircleView"}'),
            ('circle:{data:"circleData",view:"circleView",model:"circleSet",module:"circle",schema:"qf.circle-set/1"}','circle:{data:"circleData",view:"circleView",model:"circleSet",module:"circle_b19",schema:"qf.circle-set/1"}')]
          for old,new in pairs:
              assert old in js,old
              js=js.replace(old,new,1)
          for _,new in pairs: assert new in js

          # Verify new registry entry really decodes to B19 and old remains intact.
          pb2,pe2,psegf=seg_from(js,'QF_MOD38_PACK')
          mo=re.search(r'"circle"\s*:\s*"gz:([A-Za-z0-9+/=]+)"',psegf); mn=re.search(r'"circle_b19"\s*:\s*"gz:([A-Za-z0-9+/=]+)"',psegf)
          assert mo and mn and mo.group(1)==b64
          assert 'B19' in gzip.decompress(base64.b64decode(mn.group(1))).decode()
          src['jsLib']=js
          src['bookSourceComment']='v1.1.0-beta19：书友圈运行链强制换键版。保留旧 circle 模块，复制 beta18 实现为 circle_b19，并将 circleOpen/circleData/circleView 与 OfficialDomainService 全部切换到新模块键，以绕过可能存活的旧模块内存实例；新页面右下角带极小 B19 标记。详情/分页业务仍为 beta18，其他域冻结。'
          sp.write_text(json.dumps(doc,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          d2=json.loads(sp.read_text(encoding='utf-8')); s2=fs(d2); assert s2 and 'circle_b19' in s2['jsLib']
          sha=hashlib.sha256(sp.read_bytes()).hexdigest()

          mp=Path('manifest.json'); man=json.loads(mp.read_text(encoding='utf-8')); hit=False
          for it in man.get('sources',[]):
              if it.get('id')=='qidian-next-beta':
                  it.update({'version':'1.1.0-beta19','versionCode':11019,'updatedAt':'2026-08-28T23:26:00+08:00','summary':'书友圈 beta19：全新 circle_b19 模块键强制绕过旧 lazy-module 实例，并加入 B19 真机运行标记。','tags':['起点','测试版','书友圈','模块换键','运行链诊断','帖子详情','连续分页'],'changelog':['旧 circle 保留不动，beta18 当前实现复制为 circle_b19','官方 circleOpen/circleData/circleView 和 Domain Service 全部改走 circle_b19','右下角极小 B19 标记只用于确认真机是否实际运行新模块','其它域冻结'],'sha256':sha});hit=True;break
          assert hit; man['updatedAt']='2026-08-28T23:26:00+08:00'; mp.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          bp=Path('subscription/beta.json'); sub=json.loads(bp.read_text(encoding='utf-8'));hit=False
          for it in sub.get('items',[]):
              if it.get('id')=='qidian-next-beta':
                  it.update({'summary':'书友圈 beta19：换用 circle_b19 新模块键并加入 B19 运行标记。','version':'1.1.0-beta19','updatedAt':'2026-08-28','tags':['起点','测试版','书友圈','模块换键','运行链诊断','帖子详情','连续分页'],'changelog':['书友圈调度整体切换至 circle_b19','旧 circle 模块保留但正常入口不再使用','B19 标记用于判定真机运行链','详情/分页沿用 beta18，其它域冻结'],'sourceUrl':'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11019','backupUrl':'https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v=11019','importUrl':'legado://import/importonline?src=https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11019'});hit=True;break
          assert hit; sub['updatedAt']='2026-08-28T23:26:00+08:00';sub['generatedAt']='2026-08-28T23:26:00+08:00';bp.write_text(json.dumps(sub,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          bunp=Path('bundles/all-beta.json'); bun=json.loads(bunp.read_text(encoding='utf-8')); cnt=[0]
          def rb(o):
              if isinstance(o,list):
                  for i,v in enumerate(o):
                      if isinstance(v,dict) and v.get('bookSourceUrl')==s2.get('bookSourceUrl') and '起点增强' in str(v.get('bookSourceName','')):o[i]=s2;cnt[0]+=1
                      else:rb(v)
              elif isinstance(o,dict):
                  for k,v in list(o.items()):
                      if isinstance(v,dict) and v.get('bookSourceUrl')==s2.get('bookSourceUrl') and '起点增强' in str(v.get('bookSourceName','')):o[k]=s2;cnt[0]+=1
                      else:rb(v)
          rb(bun);assert cnt[0]>=1; bunp.write_text(json.dumps(bun,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          rp=Path('docs/RELEASE_LOG.md');old=rp.read_text(encoding='utf-8')
          rp.write_text(f'''## 2026-08-28 — 起点增强 1.1.0-beta19\n\nStatus: Beta/Test; fresh lazy-module key diagnostic after Beta18 still had no observable real-device effect.\n\nChanges:\n\n- Preserve old `circle`; duplicate Beta18 implementation as `circle_b19`.\n- Route `circleOpen`, `circleData`, `circleView` and OfficialDomainService circle spec to `circle_b19`.\n- New page carries a tiny `B19` badge. Absence of this badge proves the device is not executing the Beta19 circle module, so further detail/paging patching must stop until the active source path is identified.\n- Stable and all non-community domains remain unchanged.\n- SHA256: `{sha}`.\n\n'''+old,encoding='utf-8')
          print('OK',sha,'bundle',cnt[0], 'circle',len(circle),'circle19',len(circle19))
          PY
          git diff --check
      - name: Commit beta19
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m "fix(qidian): route circle through fresh module key in beta19"
          git push origin main
