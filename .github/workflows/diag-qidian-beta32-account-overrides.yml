name: diag-qidian-beta32-account-overrides
on:
  push:
    paths: ['.staging/diag-qidian-beta32-account-overrides.trigger']
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Dump all account override points
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          a=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text()); s=a[0] if isinstance(a,list) else a
          lu=s.get('loginUrl',''); out=[]
          pats=['qfMultiAccountsV423=function','qfMultiAccountsV423 = function','function qfMultiAccountsV423','qfNextAccountRunV011','Provider 当前','Provider','晴天','同人']
          for pat in pats:
            hits=[m.start() for m in re.finditer(re.escape(pat),lu)]
            out.append(f'{pat} COUNT={len(hits)} HITS={hits}')
            for pos in hits[-5:]: out.append(f'--- {pat} @{pos} ---\n'+lu[max(0,pos-2500):pos+22000])
          Path('.staging/qidian-beta32-account-overrides.txt').write_text('\n\n'.join(out)[:180000])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-beta32-account-overrides.txt
          git commit -m 'chore: dump beta32 account overrides'
          git push origin main
