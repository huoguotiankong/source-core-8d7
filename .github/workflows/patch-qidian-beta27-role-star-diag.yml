name: patch-qidian-beta27-role-star-diag
on:
  workflow_dispatch:
  push:
    paths: ['.staging/patch-qidian-beta27-role-star-diag.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch beta27
        run: python .staging/patch-qidian-beta27-role-star-diag.py
      - name: Validate role module
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          d=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'));s=d[0] if isinstance(d,list) else d;js=s['jsLib']
          m=re.search(r'\\?"role\\?"\s*:\s*\\?"gz:([A-Za-z0-9+/=]+)',js);assert m
          b=m.group(1);b+='='*((4-len(b)%4)%4);t=gzip.decompress(base64.b64decode(b)).decode()
          assert 'Relationship诊断' in t and 'h5v6.if.qidian.com/new/role/share/' in t and 'B27 · 未命中' in t
          open('/tmp/qidian-role-beta27.js','w',encoding='utf-8').write(t)
          PY
          node --check /tmp/qidian-role-beta27.js
          git diff --check
      - name: Sync metadata
        run: python .staging/sync-qidian-beta27.py
      - name: Validate and publish
        run: |
          python -m json.tool sources/novel/qidian-next/qidian-next-beta.json >/dev/null
          python -m json.tool manifest.json >/dev/null
          python -m json.tool subscription/beta.json >/dev/null
          python -m json.tool bundles/all-beta.json >/dev/null
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m "release(qidian): publish beta27 relationship diagnostics"
          git push origin main
