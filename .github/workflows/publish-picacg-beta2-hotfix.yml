name: publish-picacg-beta2-hotfix
on:
  push:
    branches: [main]
    paths:
      - 'hotfix/picacg-beta2/READY'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and publish Picacg beta2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib, pathlib
          from datetime import datetime, timezone, timedelta

          ROOT=pathlib.Path('.')
          meta=json.loads((ROOT/'incoming/picacg-beta2/meta.json').read_text(encoding='utf-8'))
          target=ROOT/meta['sourcePath']
          data=json.loads(target.read_text(encoding='utf-8'))
          assert isinstance(data,list) and len(data)==1
          src=data[0]
          assert src.get('bookSourceUrl')==meta['bookSourceUrl']
          assert src.get('bookSourceName')==meta['bookSourceName']

          js=src['jsLib']
          old='var PICA_WEB_HOME = "https://manhuabika.com";\nvar PICA_SOURCE_ID = "https://sc8d7.invalid/legado/picacg-8d7";'
          new='var PICA_WEB_HOME = "https://manhuabika.com";\n/* PICA_SOURCE_ID 仅用于书源身份/缓存命名空间，禁止作为 Legado 外层网络请求地址。 */\nvar PICA_SOURCE_ID = "https://sc8d7.invalid/legado/picacg-8d7";\n/* 搜索 / 发现 / 章节的外层承载 URL 必须是真实可握手的 HTTPS 主机，规则内部再调用双线路 API。 */\nvar PICA_ROUTE_BASE = PICA_WEB_HOME;'
          if old not in js: raise SystemExit('constant baseline not found')
          js=js.replace(old,new,1)

          old='''function picaRouteCandidates(ctx,forced){
              var mode=forced||picaCurrentMode(ctx),last=picaGetSetting(ctx,"pica_last_route","");
              if(mode==="app")return ["app"];
              if(mode==="web")return ["web"];
              return last==="web"?["web","app"]:["app","web"];
          }'''
          new='''function picaRouteCandidates(ctx,forced){
              var mode=forced||picaCurrentMode(ctx),last=picaGetSetting(ctx,"pica_last_route","");
              if(mode==="app")return ["app"];
              if(mode==="web")return ["web"];
              /* Auto：优先复用上次成功线路；首次默认网页线路，避开部分 Android 网络环境的 APP TLS 握手关闭。 */
              if(last==="app")return ["app","web"];
              return ["web","app"];
          }'''
          if old not in js: raise SystemExit('route baseline not found')
          js=js.replace(old,new,1)
          old='j.open("explore",PICA_SOURCE_ID+"/explore?type=recommendation&id="+encodeURIComponent(id)+"&page={{page}}","相关推荐")'
          new='j.open("explore",PICA_ROUTE_BASE+"/?legado=picacg_explore&type=recommendation&id="+encodeURIComponent(id)+"&page={{page}}","相关推荐")'
          if old not in js: raise SystemExit('recommend baseline not found')
          src['jsLib']=js.replace(old,new,1)

          src['header']='''@js:
          JSON.stringify({
            "User-Agent":"Mozilla/5.0 (Linux; Android 13; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36",
            "Referer":PICA_WEB_HOME+"/",
            "Accept-Language":"zh-CN,zh;q=0.9"
          });'''
          src['searchUrl']='''@js:
          PICA_ROUTE_BASE + "/?legado=picacg_search&k=" + encodeURIComponent(key) + "&page=" + page;'''

          groups=[
            ('✨ 快捷入口', [('我的收藏','type=favourite'),('随机推荐','type=random'),('最近更新','type=recent&s=dd')], .31),
            ('🏆 热门榜单', [('24小时','type=leaderboard&tt=H24&ct=VC'),('7天榜','type=leaderboard&tt=D7&ct=VC'),('30天榜','type=leaderboard&tt=D30&ct=VC'),('最多爱心','type=recent&s=ld'),('最多指名','type=recent&s=vd')], .31),
            ('🌟 官方推荐', [('大家都在看','大家都在看'),('大濕推薦','大濕推薦'),('那年今天','那年今天'),('官方都在看','官方都在看')], .24),
            ('📚 内容形态', [(x,x) for x in ['嗶咔漢化','全彩','長篇','單行本','短篇','同人','CG雜圖','WEBTOON','英語 ENG','生肉']], .24),
            ('💞 题材偏好', [(x,x) for x in ['純愛','百合花園','耽美花園','偽娘哲學','後宮閃光','扶他樂園','姐姐系','妹妹系','SM','性轉換','足の恋','人妻','NTR','強暴','非人類']], .24),
            ('🎮 作品 · 地区', [(x,x) for x in ['圓神領域','碧藍幻想','艦隊收藏','Love Live','SAO 刀劍神域','Fate','東方','禁書目錄','歐美','Cosplay','重口地帶']], .24),
          ]
          lines=['<js>','(function(){','  var items=[];','  function sec(t){items.push({title:t,url:null,style:{layout_flexGrow:1,layout_flexBasisPercent:1,layout_wrapBefore:true}});}','  function add(t,q,w){items.push({title:t,url:PICA_ROUTE_BASE+"/?legado=picacg_explore&"+q+"&page={{page}}",style:{layout_flexGrow:1,layout_flexBasisPercent:w,layout_wrapBefore:false}}); }']
          for title,entries,width in groups:
              lines.append('  sec('+json.dumps(title,ensure_ascii=False)+');')
              for label,val in entries:
                  if val.startswith('type='):
                      q=json.dumps(val,ensure_ascii=False)
                  else:
                      q='"type=category&c="+encodeURIComponent('+json.dumps(val,ensure_ascii=False)+')+"&s=dd"'
                  lines.append('  add('+json.dumps(label,ensure_ascii=False)+','+q+','+str(width)+');')
          lines += ['  return JSON.stringify(items);','})()','</js>']
          src['exploreUrl']='\n'.join(lines)

          toc=src['ruleToc']['chapterList']
          old='chapterUrl:PICA_SOURCE_ID+"/chapter?book="+encodeURIComponent(id)+"&order="+encodeURIComponent(e.order)'
          new='chapterUrl:PICA_ROUTE_BASE+"/?legado=picacg_chapter&book="+encodeURIComponent(id)+"&order="+encodeURIComponent(e.order)'
          if old not in toc: raise SystemExit('toc carrier baseline not found')
          src['ruleToc']['chapterList']=toc.replace(old,new,1)

          src['bookSourceComment']='''【v1.0.0-beta2 · 2026-08-26】
          哔咔漫画完整生态测试版：APP API + 网页 API 双线路。

          Beta2 真机修复：
          • 修复发现/搜索/章节把书源 .invalid 身份地址误当网络承载地址的问题；外层请求统一改用可正常 TLS 握手的 manhuabika.com，双线路 API 只在规则内部请求。
          • 自动线路首次默认网页线路；记住最近成功线路，失败继续无感切换另一条，降低 Android 环境 APP API SSLHandshakeException 影响。
          • 发现页不再打开时请求 /categories，避免分类渲染阶段就触发网络异常。
          • 发现页重新设计为「快捷入口 / 热门榜单 / 官方推荐 / 内容形态 / 题材偏好 / 作品·地区」分区，四列紧凑布局，完整保留主要官方分类。

          已实现：账号登录、自动续登、账户中心、每日签到、收藏列表、漫画点赞/收藏、搜索、分类、排行榜、随机、相关推荐、完整目录与漫画图片。
          评论中心：详情页按钮 + 阅读页右上角定制按钮双入口；支持评论分页、热门/最新排序、楼中楼、评论点赞、发评论、回复。

          线路：
          • 自动：优先最近成功线路；首次优先网页线路，失败切 APP。
          • APP：picaapi.picacomic.com。
          • 网页：manhuabika.com / picaapi.go2778.com。

          本版仍为 Beta，等待真机完整回归。'''.replace('          ','')

          now_dt=datetime.now(timezone(timedelta(hours=8)))
          now=now_dt.isoformat(timespec='seconds'); day=now_dt.date().isoformat()
          src['lastUpdateTime']=int(now_dt.timestamp()*1000)
          raw=(json.dumps(data,ensure_ascii=False,indent=2)+'\n').encode('utf-8')
          target.write_bytes(raw)
          sha=hashlib.sha256(raw).hexdigest()

          summary=meta['summary']; changes=meta['changelog']; tags=meta['tags']
          raw_url='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/'+meta['sourcePath']
          backup='https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/'+meta['sourcePath']
          detail_url='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/'+meta['detailPath']

          mp=ROOT/'manifest.json'; manifest=json.loads(mp.read_text(encoding='utf-8')); manifest['updatedAt']=now
          for x in manifest.get('sources',[]):
              if x.get('id')=='picacg':
                  x.update(version=meta['version'],versionCode=meta['versionCode'],updatedAt=now,summary=summary,tags=tags,changelog=changes,sha256=sha)
                  break
          else: raise SystemExit('picacg manifest entry missing')
          mp.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          def update_catalog(path):
              o=json.loads(path.read_text(encoding='utf-8')); o['updatedAt']=now
              for x in o.get('items',[]):
                  if x.get('id')=='picacg':
                      x.update(name=meta['displayName'],summary=summary,channel='beta',version=meta['version'],updatedAt=day,tags=tags,changelog=changes,sourceUrl=raw_url,backupUrl=backup,importUrl='legado://import/bookSource?src='+raw_url,detailUrl=detail_url)
                      return o
              raise SystemExit('picacg catalog entry missing: '+str(path))
          for rel in ['subscription/beta.json','subscription/comic.json']:
              p=ROOT/rel; p.write_text(json.dumps(update_catalog(p),ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          dp=ROOT/meta['detailPath']
          detail={
            'kind':'source','title':meta['displayName'],'summary':summary,
            'badges':['BETA',meta['version'],'漫画源','SSL / 发现页修复'],
            'sections':[
              {'title':'本次真机问题','text':'Android/OkHttp 直接弹出 SSLHandshakeException；发现页几十个分类无层级平铺。'},
              {'title':'网络层修复','text':'bookSourceUrl 的 .invalid 地址只保留作唯一身份。搜索、发现、章节全部改用 manhuabika.com 作为外层 HTTPS 承载；实际数据继续由规则内部 APP/Web API 双线路获取。自动模式首次优先网页线路，并记忆最近成功线路。'},
              {'title':'发现页重构','text':'分类不再打开页面时动态请求 /categories；改为静态分区：快捷入口、热门榜单、官方推荐、内容形态、题材偏好、作品·地区。分区标题独占一行，入口采用三/四列紧凑宫格。'},
              {'title':'核心能力','text':'登录、账户中心、签到、收藏、点赞、搜索、排行榜、随机推荐、相关推荐、完整目录/图片，以及独立评论社区与楼中楼。'},
              {'title':'发布状态','text':'Beta / 测试版，等待本轮阅读真机验证后再继续修复或晋升。'},
              {'title':'唯一身份','text':meta['bookSourceUrl']}
            ],'sourceUrl':raw_url,'backupUrl':backup
          }
          dp.write_text(json.dumps(detail,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          beta=[]
          for x in manifest.get('sources',[]):
              if x.get('channel')!='beta': continue
              fp=ROOT/str(x.get('sourcePath') or '')
              if fp.exists():
                  obj=json.loads(fp.read_text(encoding='utf-8'))
                  if isinstance(obj,list): beta.extend(obj)
          (ROOT/'bundles/all-beta.json').write_text(json.dumps(beta,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          log=ROOT/'docs/RELEASE_LOG.md'; old=log.read_text(encoding='utf-8')
          marker=f"## {day} — Picacg {meta['version']} SSL + Explore UI hotfix"
          if marker not in old:
              block=(marker+'\n\nStatus: Beta/Test; awaiting user real-device confirmation.\n\nChanges:\n\n'+''.join('- '+c+'\n' for c in changes)+f'- Published SHA256: `{sha}`.\n\n')
              lines0=old.splitlines(True); old=(lines0[0]+'\n'+block+''.join(lines0[1:])) if lines0 and lines0[0].startswith('# RELEASE LOG') else block+old
              log.write_text(old,encoding='utf-8')

          kp=ROOT/'docs/KNOWN_ISSUES.md'; known=kp.read_text(encoding='utf-8')
          heading='## Picacg `.invalid` identity reused as runtime carrier — fixed in 1.0.0-beta2'
          if heading not in known:
              known += ('\n\n'+heading+'\n\nReal-device symptom: Legado displayed an Android `javax.net.ssl.SSLHandshakeException: connection closed` dialog before the source rule could fall back to the other Pica route. The discovery page also triggered a category request during selector rendering.\n\nRoot cause: Beta1 reused the synthetic `bookSourceUrl` identity (`sc8d7.invalid`) as search/explore/chapter outer request URLs. Legado performs the outer HTTP request before rule JavaScript, so failures there are outside `picaRequest()` route fallback.\n\nPermanent rule: synthetic identity hosts are namespace-only. Every operational search/explore/chapter URL must use a real TLS-capable carrier; API switching happens only inside source rules. Discovery selector construction should be offline/static when practical.\n\nStatus: fixed in Picacg 1.0.0-beta2; awaiting real-device confirmation.\n')
              kp.write_text(known,encoding='utf-8')

          for rel in ['hotfix/picacg-beta2/READY','incoming/picacg-beta2/meta.json']:
              p=ROOT/rel
              if p.exists(): p.unlink()
          for d in [ROOT/'hotfix/picacg-beta2',ROOT/'incoming/picacg-beta2']:
              try:d.rmdir()
              except OSError:pass
          print('published beta2',len(raw),'bytes',sha)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: publish Picacg beta2 SSL and explore UI hotfix'
          git push origin main
