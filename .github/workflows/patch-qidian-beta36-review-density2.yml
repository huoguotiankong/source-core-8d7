name: patch-qidian-beta36-review-density2
on:
  push:
    paths: ['.staging/patch-qidian-beta36-review-density2.trigger']
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Tighten review left spacing and publish Beta36
        run: |
          python3 - <<'PY'
          import json,gzip,base64,re,hashlib
          from pathlib import Path
          SRC=Path('sources/novel/qidian-next/qidian-next-beta.json')
          STABLE=Path('sources/novel/qidian-next/qidian-next.json')
          arr=json.loads(SRC.read_text()); s=arr[0] if isinstance(arr,list) else arr
          stable_hash=hashlib.sha256(STABLE.read_bytes()).hexdigest()
          lib=s['jsLib']; mk='var QF_MOD38_PACK='; a=lib.index(mk)+len(mk); b=lib.index(';\nvar QF_MOD38_EXPORTS=',a); pack=json.loads(lib[a:b])
          def dec(v):
            if not isinstance(v,str): return ''
            if not v.startswith('gz:'): return v
            z=v[3:]; z += '='*((4-len(z)%4)%4)
            return gzip.decompress(base64.b64decode(z)).decode()
          def enc(code):
            return 'gz:'+base64.b64encode(gzip.compress(code.encode(),mtime=0)).decode().rstrip('=')
          code=dec(pack['review_local_ui']); before=code
          reps={
            '.comment{position:relative;padding:17px 12px 16px 22px;border-bottom:1px solid var(--line);background:var(--panel);min-height:106px}':'.comment{position:relative;padding:15px 10px 14px 18px;border-bottom:1px solid var(--line);background:var(--panel);min-height:100px}',
            '.avatarWrap{position:relative;width:46px;height:46px;flex:0 0 46px;margin-right:14px}':'.avatarWrap{position:relative;width:42px;height:42px;flex:0 0 42px;margin-right:11px}',
            '.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:15px}':'.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#eee;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:14px}',
            '.frame{position:absolute;left:-5px;top:-5px;width:56px;height:56px;pointer-events:none}':'.frame{position:absolute;left:-5px;top:-5px;width:52px;height:52px;pointer-events:none}',
            '.meta{font-size:12px;color:var(--sub);margin-top:8px;padding-right:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}':'.meta{font-size:12px;color:var(--sub);margin-top:6px;padding-right:58px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
            '.replyToggle{margin-left:60px;margin-top:11px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);cursor:pointer;padding:3px 0}':'.replyToggle{margin-left:53px;margin-top:9px;display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);cursor:pointer;padding:2px 0}',
            '.replies{margin:10px 0 0 60px;background:var(--reply);border-radius:9px;overflow:hidden}':'.replies{margin:8px 0 0 53px;background:var(--reply);border-radius:9px;overflow:hidden}',
            '.reply{position:relative;padding:11px 11px 11px 11px;border-bottom:1px solid var(--line)}':'.reply{position:relative;padding:10px 10px 10px 10px;border-bottom:1px solid var(--line)}',
            '.rAvatar{width:25px;height:25px;border-radius:50%;overflow:hidden;background:#e8e8e8;flex:0 0 25px;margin-right:7px}':'.rAvatar{width:24px;height:24px;border-radius:50%;overflow:hidden;background:#e8e8e8;flex:0 0 24px;margin-right:6px}',
            '.rContent{font-size:13px;line-height:1.62;margin:6px 0 0 32px;padding-right:2px;white-space:normal;word-break:break-word;overflow-wrap:anywhere}':'.rContent{font-size:13px;line-height:1.58;margin:5px 0 0 30px;padding-right:2px;white-space:normal;word-break:break-word;overflow-wrap:anywhere}',
            '.rMeta{font-size:10.5px;color:var(--muted);margin:6px 0 0 32px;padding-right:42px;white-space:normal;line-height:1.4}':'.rMeta{font-size:10.5px;color:var(--muted);margin:5px 0 0 30px;padding-right:42px;white-space:normal;line-height:1.35}'
          }
          for old,new in reps.items():
            assert old in code, 'missing CSS anchor: '+old[:100]
            code=code.replace(old,new,1)
          assert code!=before
          # Beta35 like-on-meta layout must survive unchanged.
          assert '.like{position:absolute;right:11px;bottom:15px;top:auto' in code
          assert '.rLike{position:absolute;right:6px;bottom:10px;top:auto' in code
          assert 'margin:8px 0 0 53px' in code and 'width:42px;height:42px' in code
          pack['review_local_ui']=enc(code)
          s['jsLib']=lib[:a]+json.dumps(pack,ensure_ascii=False,separators=(',',':'))+lib[b:]
          s['bookSourceComment']='v1.1.0-beta36：评论页信息密度第二轮优化。保留 beta35 点赞位于时间/IP/楼层元信息行，进一步收紧根评论头像、左右内边距、回复缩进和楼中楼间距，让同屏显示更多文字与回复；评论数据、分页、身份标签、X限免及其它域不变。'
          SRC.write_text(json.dumps(arr,ensure_ascii=False,indent=2))
          assert hashlib.sha256(STABLE.read_bytes()).hexdigest()==stable_hash

          VERSION='1.1.0-beta36'; VC=11036; DATE='2026-09-10'; TS='2026-09-10T00:28:00+08:00'
          summary='Beta36：继续压缩评论页头像、缩进与卡片留白，提高同屏文字和回复密度。'
          tags=['起点','测试版','段评','评论页','UI优化','信息密度','楼中楼','X-QD']
          changes=['保留 Beta35 点赞位于时间/IP/楼层元信息行的布局','根评论头像由46降至42并收紧左右/上下留白，正文仍保持15px字号','回复区左缩进由60降至53，楼中楼头像/间距轻微收紧，正文获得更多横向空间','仅修改 review_local_ui CSS；评论数据、请求、分页、身份标签、X限免及其它域冻结']
          raw=f'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}'
          backup=f'https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}'
          imp='legado://import/importonline?src='+raw
          detail='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/details/beta/qidian-next.json'
          sha=hashlib.sha256(SRC.read_bytes()).hexdigest()
          def entry(base=None,include_type=False):
            e=dict(base or {}); e.update({'id':'qidian-next-beta','name':'🌈 起点增强 · Beta','summary':summary,'icon':e.get('icon',''),'channel':'beta','version':VERSION,'updatedAt':DATE,'tags':tags,'changelog':changes,'sourceUrl':raw,'backupUrl':backup,'importUrl':imp,'detailUrl':detail,'versionCode':VC})
            if include_type:e['type']='novel'
            return e
          mp=Path('manifest.json'); m=json.loads(mp.read_text()); m['updatedAt']=TS
          for i,e in enumerate(m.get('sources',[])):
            if e.get('id')=='qidian-next-beta':
              ne=dict(e); ne.update({'name':'🌈 起点增强 · Beta','category':'novel','channel':'beta','version':VERSION,'versionCode':VC,'updatedAt':TS,'sourcePath':'sources/novel/qidian-next/qidian-next-beta.json','sourceUrl':raw,'bookSourceUrl':'https://m.qidian.com/?qf_source=qidian_next_8d7','summary':summary,'tags':tags,'changelog':changes,'sha256':sha}); m['sources'][i]=ne; break
          else: raise AssertionError('manifest entry missing')
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2))
          for p,itype in [(Path('subscription/beta.json'),False),(Path('subscription/novel.json'),True)]:
            j=json.loads(p.read_text()); j['updatedAt']=TS; j['generatedAt']=TS
            for i,e in enumerate(j.get('items',[])):
              if e.get('id')=='qidian-next-beta': j['items'][i]=entry(e,itype); break
            else:j.setdefault('items',[]).append(entry(include_type=itype))
            p.write_text(json.dumps(j,ensure_ascii=False,indent=2))
          dp=Path('rss/data/details/beta/qidian-next.json')
          d={'kind':'source','title':'🌈 起点增强 · Beta','summary':summary,'badges':['Beta',VERSION,'评论紧凑'],
             'sections':[{'title':'本版更新','text':'在 Beta35 点赞已归位元信息行的基础上，继续收紧头像、评论卡片留白、回复缩进与楼中楼间距。'},
                         {'title':'阅读密度','text':'正文主字号保持不变；主要从无效空白和缩进中回收空间，让同屏能显示更多评论文字与更多回复。'},
                         {'title':'冻结范围','text':'评论接口、排序、分页、标签、图片/配音、回复加载、X限免 Provider 和其它业务域均不改。'},
                         {'title':'版本状态','text':'Beta / 测试通道，等待真机确认。'}],
             'sourceUrl':raw,'backupUrl':backup,'importUrl':imp}
          dp.write_text(json.dumps(d,ensure_ascii=False,indent=2))
          bund=Path('bundles/all-beta.json'); ba=json.loads(bund.read_text()); src_obj=arr[0] if isinstance(arr,list) else arr
          if not isinstance(ba,list):ba=[]
          hit=False
          for i,o in enumerate(ba):
            if isinstance(o,dict) and o.get('bookSourceUrl')==src_obj.get('bookSourceUrl'):ba[i]=src_obj;hit=True;break
          if not hit:ba.append(src_obj)
          dd={}; order=[]
          for o in ba:
            if not isinstance(o,dict):continue
            k=str(o.get('bookSourceUrl') or o.get('bookSourceName') or len(order))
            if k not in dd:order.append(k)
            dd[k]=o
          bund.write_text(json.dumps([dd[k] for k in order],ensure_ascii=False,indent=2))
          rp=Path('docs/RELEASE_LOG.md'); old=rp.read_text()
          head='## 2026-09-10 · 起点增强 1.1.0-beta36 — 评论页密度第二轮\n\n- Stable 保持 1.1.0 不变。\n- 保留 Beta35 点赞归位到元信息行；不再让点赞侵占评论正文宽度。\n- 根评论头像 46→42，卡片左右/上下留白收紧；正文主字号保持 15px。\n- 回复区缩进 60→53，楼中楼头像和间距轻微收紧，减少长回复换行并增加同屏回复数。\n- 仅修改 lazy `review_local_ui` CSS；评论数据、接口、排序、分页、身份标签、X-QD Provider 与其它域冻结。\n- 状态：Beta，等待真机确认。\n\n'
          rp.write_text(head+old)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md
          git commit -m 'feat: publish qidian-next beta36 denser review UI'
          git push origin main
