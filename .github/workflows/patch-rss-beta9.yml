name: patch-rss-beta9
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-rss-beta9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove description shortcut and align article rules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          p=root/'rss/reader-source-repository-beta.json'
          arr=json.loads(p.read_text(encoding='utf-8'))
          src=arr[0]
          src.pop('ruleDescription', None)
          src['sourceComment']='UI Beta 9：删除 ruleDescription，避免阅读直接把列表描述当正文而跳过 ruleContent；列表规则改为与已验证参考源一致的 <js> 原生对象形式。'
          src['lastUpdateTime']=1787660700000
          src['ruleArticles']="""<js>
let o={};
try{o=JSON.parse(result)}catch(e){o={items:[]}}
let xs=Array.isArray(o.items)?o.items:[];
xs.map(function(x){
  return {
    n:x.name||'未命名',
    t:x.updatedAt||'',
    i:x.icon||'',
    u:x.detailUrl||x.sourceUrl||''
  };
})
</js>"""
          src['sortUrl']='🏠 首页::https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/home.json?v=9\n⭐ 正式版::https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/subscription/stable.json?v=9\n🧪 测试版::https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/subscription/beta.json?v=9\n📦 批量导入::https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/bundle.json?v=9\n📖 使用说明::https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/rss/data/help.json?v=9'
          p.write_text(json.dumps(arr,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          rp=root/'docs/RELEASE_LOG.md'
          old=rp.read_text(encoding='utf-8')
          marker='## 2026-08-25 — RSS repository UI Beta 9'
          if marker not in old:
              block=(marker+'\n\nStatus: Beta/Test; awaiting user real-device verification.\n\nChanges:\n\n- Removed `ruleDescription` from the RSS source.\n- Reason: on the tested Legado build, a non-empty article description is rendered directly as article content, preventing the expected detail `ruleContent` path from being visible.\n- Changed `ruleArticles` to the same `<js>...</js>` native-object form used by the working reference RSS source.\n- Added `?v=9` to category URLs to bypass cached list payloads.\n\n')
              lines=old.splitlines(True)
              old=(lines[0]+'\n'+block+''.join(lines[1:])) if lines and lines[0].startswith('# RELEASE LOG') else block+old
              rp.write_text(old,encoding='utf-8')

          kp=root/'docs/KNOWN_ISSUES.md'
          old=kp.read_text(encoding='utf-8')
          note='''\n## RSS article description can bypass the intended detail content\n\n- Symptom: opening a repository item shows only the list summary text, even when `ruleContent` contains a complete HTML detail page.\n- Evidence: Beta 8 was confirmed imported on-device, but the article body exactly matched the mapped `ruleDescription` value. The working Luoyacheng reference source does not define `ruleDescription`.\n- Mitigation: omit `ruleDescription` for repository-style RSS sources that require an interactive detail page; keep summary information in the list title/date or in the fetched detail payload instead.\n- Status: Beta 9 pending real-device confirmation.\n'''
          if 'RSS article description can bypass the intended detail content' not in old:
              kp.write_text(old.rstrip()+note+'\n',encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add rss/reader-source-repository-beta.json docs/RELEASE_LOG.md docs/KNOWN_ISSUES.md
          git rm .github/workflows/patch-rss-beta9.yml
          git commit -m 'fix: force RSS repository detail through ruleContent'
          git push origin main
