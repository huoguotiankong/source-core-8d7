name: diag-qidian-bookvar
on:
  push:
    paths: ['.staging/diag-qidian-bookvar.trigger']
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Extract book variable routing
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          a=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text()); s=a[0] if isinstance(a,list) else a
          txt=s['jsLib']; mk='var QF_MOD38_PACK='; x=txt.index(mk); y=txt.index(';\nvar QF_MOD38_EXPORTS=',x); txt=txt[:x]+txt[y:]
          out=[]
          for pat in ['qfBookVar','bookVariable','书籍变量','同人','14','STV·自动']:
            for m in list(re.finditer(re.escape(pat),txt))[:40]: out.append('\n### '+pat+' @'+str(m.start())+'\n'+txt[max(0,m.start()-1600):m.start()+3600])
          Path('.staging/qidian-bookvar.txt').write_text('\n'.join(out)[:120000])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-bookvar.txt
          git commit -m 'chore: dump qidian book variable routing'
          git push origin HEAD:main
