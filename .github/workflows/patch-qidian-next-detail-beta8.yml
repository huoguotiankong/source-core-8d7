name: patch-qidian-next-detail-beta8

on:
  push:
    branches:
      - main
    paths:
      - .staging/qidian-next-detail-beta8.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and publish Beta8
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .staging/qidian-next-detail-beta8.trigger ]; then
            echo "Trigger already consumed; nothing to do."
            exit 0
          fi
          python .github/scripts/patch_qidian_next_detail_beta8.py
          rm -f .staging/qidian-next-detail-beta8.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi
          git commit -m "fix: restore qidian-next rich detail beta1108"
          git push origin main
