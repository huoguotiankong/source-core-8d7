name: diag-qidian-x-registry2
on:
  push:
    paths:
      - '.staging/diag-qidian-x-registry2.trigger'
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract registry text
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          a=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text()); s=a[0] if isinstance(a,list) else a
          lib=s['jsLib']; out=[]
          for token in ['var QF_MOD38_EXPORTS=','var QF_MOD38_DEPS=']:
              i=lib.find(token); out.append(token+' POS '+str(i)); out.append(lib[i:i+18000] if i>=0 else '')
          for token in ['limited_tr','qfTrContent','"同人"']:
              ms=list(re.finditer(re.escape(token),lib)); out.append('\n'+token+' COUNT '+str(len(ms)))
              for m in ms[-15:]: out.append(lib[max(0,m.start()-900):m.start()+1800])
          Path('.staging/qidian-x-registry2.txt').write_text('\n\n'.join(out)[:100000])
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-x-registry2.txt
          git commit -m 'chore: dump qidian x registry v2'
          git push origin main
