name: run-qidian-next-beta6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-qidian-next-beta6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply and validate Beta6
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_qidian_next_beta6_ui.py
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('sources/novel/qidian-next/qidian-next.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(d,list) and len(d)==1
          s=d[0]
          assert s['bookSourceUrl']=='https://m.qidian.com/?qf_source=qidian_next_8d7'
          assert 'v0.1.5-beta6' in s.get('bookSourceComment','')
          assert '🌈 起点助手 · v0.1.5-beta6' in s.get('loginUi','')
          login=s.get('loginUrl','')
          for name in ['qfUxOpenV015','qfUxReadV015','qfMultiContentV423','qfMultiAccountsV423','qfMultiDiagV423','qfSmCtxV30']:
              assert name in login, name
          assert 'qidian-next v0.1.5-beta6' in login
          assert login.rfind('qidian-next v0.1.5-beta6') > login.rfind('qidian-next v0.1.4-beta5')
          pathlib.Path('/tmp/login.js').write_text(login,encoding='utf-8')
          sub=json.loads(pathlib.Path('subscription/beta.json').read_text(encoding='utf-8'))
          q=[x for x in sub.get('items',[]) if x.get('id')=='qidian-next']
          assert len(q)==1 and q[0].get('version')=='0.1.5-beta6'
          m=json.loads(pathlib.Path('manifest.json').read_text(encoding='utf-8'))
          q=[x for x in m.get('sources',[]) if x.get('id')=='qidian-next']
          assert len(q)==1 and q[0].get('version')=='0.1.5-beta6' and q[0].get('versionCode')==1506
          print('json/meta validation ok')
          PY
          node --check /tmp/login.js
      - name: Commit Beta6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next.json bundles/all-beta.json subscription/beta.json manifest.json rss/data/details/qidian-next.json docs/sources/qidian-next/PROJECT_HANDOFF.md docs/RELEASE_LOG.md
          git diff --cached --stat
          git commit -m 'feat: qidian-next beta6 secondary settings redesign'
          git push origin main
