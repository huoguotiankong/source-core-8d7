name: inspect-qidian-review-local-ui
on:
  push:
    paths:
      - '.staging/inspect-qidian-review-local-ui.trigger'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Extract review_local_ui
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,base64,gzip
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json')
          arr=json.loads(p.read_text(encoding='utf-8'))
          src=arr[0] if isinstance(arr,list) else arr
          js=src.get('jsLib','')
          m=re.search(r'var\s+QF_MOD38_PACK\s*=\s*(\{.*?\});\s*var\s+QF_MOD38_EXPORTS',js,re.S)
          if not m: raise SystemExit('QF_MOD38_PACK not found')
          pack=json.loads(m.group(1))
          v=pack.get('review_local_ui')
          if v is None: raise SystemExit('review_local_ui missing')
          s=str(v)
          if s.startswith('gz:'):
              b=s[3:].strip().replace('-','+').replace('_','/')
              b += '='*((4-len(b)%4)%4)
              text=gzip.decompress(base64.b64decode(b)).decode('utf-8')
          else:
              text=s
          out=Path('.staging/review_local_ui.inspect.js')
          out.write_text(text,encoding='utf-8')
          print('wrote',out,'bytes',len(text.encode('utf-8')))
          PY
      - name: Commit extracted module
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/review_local_ui.inspect.js
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'chore: expose qidian local review module for inspection'
          git push origin HEAD:main
