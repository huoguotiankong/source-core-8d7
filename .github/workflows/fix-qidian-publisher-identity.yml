name: fix-qidian-publisher-identity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-qidian-publisher-identity.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch publisher identity policy
        shell: bash
        run: |
          set -euo pipefail
          f='.github/workflows/assemble-qidian.yml'
          sed -i "s#identity='https://sc8d7.invalid/legado/qidian-official-8d7'#identity='https://m.qidian.com/?qf_source=v2922_audio_webview_crypto_bridge_fix'#" "$f"
          sed -i "/expected_final='c952233cc72468a79bd94b784cfe34c0101b0eacecb39b52bff7b9fab691a8a3'/d" "$f"
          sed -i "/assert got_final==expected_final,(got_final,expected_final)/d" "$f"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$f"
          git rm .github/workflows/fix-qidian-publisher-identity.yml
          git commit -m 'fix: preserve Qidian same-origin identity in publisher'
          git push origin main
