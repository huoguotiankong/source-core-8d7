name: patch-qidian-beta30-copyright-label-v2
on:
  push:
    paths:
      - '.staging/patch-qidian-beta30-copyright-label-v2.trigger'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch compressed copyright module
        run: |
          python3 - <<'PY'
          import json,gzip,base64,hashlib
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json'); s=json.loads(p.read_text())
          lib=s['jsLib']
          marker='var QF_MOD38_PACK='
          a=lib.index(marker)+len(marker); b=lib.index(';\nvar QF_MOD38_EXPORTS=',a)
          pack=json.loads(lib[a:b])
          hits=[]
          for k,v in pack.items():
              if not isinstance(v,str) or not v.startswith('gz:'): continue
              try: code=gzip.decompress(base64.b64decode(v[3:])).decode()
              except: continue
              if '上架' in code:
                  hits.append((k,code.count('上架')))
                  code=code.replace('上架','首发')
                  pack[k]='gz:'+base64.b64encode(gzip.compress(code.encode(),9)).decode()
          if not hits: raise SystemExit('no compressed module contains 上架')
          print('patched modules',hits)
          s['jsLib']=lib[:a]+json.dumps(pack,ensure_ascii=False,separators=(',',':'))+lib[b:]
          s['bookSourceComment']='v1.1.0-beta30：版权信息页语义修正。版权卡片中的日期实际为作品首发时间，因此将“上架”标签改为“首发”；不再将该日期描述为上架时间。角色卡继续沿用 beta29 性能回退版本，其它域冻结。'
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+'\n')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          mp=Path('manifest.json'); m=json.loads(mp.read_text()); m['updatedAt']='2026-08-29T13:58:00+08:00'
          for x in m.get('sources',[]):
            if x.get('id')=='qidian-next-beta':
              x.update(version='1.1.0-beta30',versionCode=11030,updatedAt='2026-08-29T13:58:00+08:00',sourceUrl='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11030',summary='版权信息页 beta30：日期标签由“上架”修正为“首发”，与实际数据语义一致。',sha256=sha)
              x['tags']=['起点','测试版','版权信息','首发时间','语义修正','角色卡性能回退']; x['changelog']=['版权信息页日期标签“上架”改为“首发”','该日期按作品首发时间展示，不再误称上架时间','角色卡保持 beta29 性能回退状态','书友圈、正文、目录、评论、Provider 与其它域冻结']
          mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          sp=Path('subscription/beta.json'); sub=json.loads(sp.read_text()); sub['updatedAt']='2026-08-29T13:58:00+08:00'; sub['generatedAt']='2026-08-29T13:58:00+08:00'
          for x in sub.get('items',[]):
            if x.get('id')=='qidian-next-beta':
              x.update(version='1.1.0-beta30',updatedAt='2026-08-29',summary='版权信息页 beta30：日期标签由“上架”修正为“首发”，与实际数据语义一致。',sourceUrl='https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11030',backupUrl='https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v=11030',importUrl='legado://import/importonline?src=https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v=11030')
              x['tags']=['起点','测试版','版权信息','首发时间','语义修正','角色卡性能回退']; x['changelog']=['版权信息页日期标签“上架”改为“首发”','该日期按作品首发时间展示，不再误称上架时间','角色卡保持 beta29 性能回退状态','书友圈、正文、目录、评论、Provider 与其它域冻结']
          sp.write_text(json.dumps(sub,ensure_ascii=False,indent=2)+'\n')
          bp=Path('bundles/all-beta.json'); bundle=json.loads(bp.read_text())
          def walk(o):
            if isinstance(o,dict):
              if o.get('bookSourceUrl')==s.get('bookSourceUrl') and 'bookSourceName' in o: o.clear(); o.update(s); return
              for v in list(o.values()): walk(v)
            elif isinstance(o,list):
              for v in o: walk(v)
          walk(bundle); bp.write_text(json.dumps(bundle,ensure_ascii=False,indent=2)+'\n')
          rp=Path('docs/RELEASE_LOG.md'); old=rp.read_text(); rp.write_text('## 2026-08-29 · 🌈 起点增强 1.1.0-beta30\n\n- 通道：Beta / 测试版，等待真机确认；Stable 1.1.0 不变。\n- 版权信息：卡片日期字段实际按作品首发时间展示，因此标签由“上架”修正为“首发”。\n- 数据原则：不再把无法可靠取得的上架时间与首发时间混用；本版只修正显示语义，不增加额外请求。\n- 性能：角色卡继续保持 beta29 的 beta25 role 模块回退状态，不恢复 Relationship 扫描。\n- 冻结：书友圈、正文、目录、评论、Provider 与其它域不改。\n\n'+old)
          PY
      - name: Validate and publish
        run: |
          python3 - <<'PY'
          import json,gzip,base64
          s=json.load(open('sources/novel/qidian-next/qidian-next-beta.json')); assert '1.1.0-beta30' in s['bookSourceComment']
          lib=s['jsLib']; a=lib.index('var QF_MOD38_PACK=')+len('var QF_MOD38_PACK='); b=lib.index(';\nvar QF_MOD38_EXPORTS=',a); pack=json.loads(lib[a:b]); found=False
          for v in pack.values():
            if isinstance(v,str) and v.startswith('gz:'):
              try: code=gzip.decompress(base64.b64decode(v[3:])).decode()
              except: continue
              if '首发' in code: found=True
          assert found
          q=[x for x in json.load(open('manifest.json'))['sources'] if x.get('id')=='qidian-next-beta'][0]; assert q['versionCode']==11030
          json.load(open('bundles/all-beta.json'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m 'release(qidian): publish beta30 copyright first-publish label'
          git push origin HEAD:main
