name: patch-qidian-next-detail-beta12

on:
  push:
    paths:
      - '.staging/qidian-next-detail-beta12.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch and publish Beta12
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_qidian_next_detail_beta12.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No repository changes to commit.'
            exit 0
          fi
          git commit -m 'fix: qidian-next detail semantics layout beta12'
          git push origin main
