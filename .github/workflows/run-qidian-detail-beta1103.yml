name: run-qidian-detail-beta1103
on:
  push:
    branches: [main]
    paths:
      - '.staging/run-qidian-detail-beta1103.trigger'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publish beta
        run: python scripts/publish_qidian_detail_beta1103.py
      - name: Validate JSON and JS
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=['sources/novel/qidian-next/qidian-next-beta.json','sources/novel/qidian-next/qidian-next.json','subscription/beta.json','bundles/all-beta.json','manifest.json','rss/data/details/beta/qidian-next.json']
          for p in paths: json.loads(Path(p).read_text(encoding='utf-8'))
          s=json.loads(Path(paths[0]).read_text(encoding='utf-8'))[0]
          assert s['bookSourceUrl']=='https://m.qidian.com/?qf_source=qidian_next_8d7'
          assert 'v1.1.0-beta3' in s['bookSourceComment']
          init=s['ruleBookInfo']['init']; intro=s['ruleBookInfo']['intro']
          assert '.ajax(' not in init and 'qfOfficialCallV400' not in init and 'qfAtomPost' not in init
          assert 'qfMetaListV1103' in init and 'qfMetricBaseV1103' in init
          assert 'sectionCount' in init
          full=Path(paths[0]).read_text(encoding='utf-8')
          for marker in ['X-Content-Token','VIP正文已验证']: assert marker in full
          Path('/tmp/init.js').write_text(init[4:-5],encoding='utf-8')
          Path('/tmp/intro.js').write_text(intro[4:-5],encoding='utf-8')
          print('json gates ok',len(init),len(intro))
          PY
          node --check /tmp/init.js
          node --check /tmp/intro.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sources/novel/qidian-next/qidian-next-beta.json subscription/beta.json bundles/all-beta.json manifest.json rss/data/details/beta/qidian-next.json docs/sources/qidian-next/PROJECT_HANDOFF.md docs/RELEASE_LOG.md docs/KNOWN_ISSUES.md
          git commit -m 'fix: sanitize qidian detail metadata beta1103'
          git push origin main
