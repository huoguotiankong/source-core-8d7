name: sync-qidian-beta17

on:
  push:
    paths:
      - '.staging/patch-qidian-beta17.trigger'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync manifest subscription bundle and release log
        shell: bash
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          TS='2026-08-28T22:23:00+08:00'
          DATE='2026-08-28'
          VER='1.1.0-beta17'; VC=11017
          summary='书友圈 beta17：修复帖子详情点击事件链，并重做连续分页触发与空页判定。'
          tags=['起点','测试版','书友圈','帖子详情','连续分页','触底加载','评论']
          changes=[
            '帖子详情由单节点 onclick 改为 WebView 捕获级 touchend/click 事件委托，并补 TopicId/topicId 帖子标识兼容',
            '分页空结果不再缓存 45 秒，避免瞬时空页被固化为“没有更多”',
            '单次空页不再直接结束；连续 3 次无新增才判定到底，重复页会推进页码继续探测',
            '新增 scrollingElement、IntersectionObserver 与近底 watchdog 三重触底触发，降低 Android WebView 漏掉 window scroll 的概率',
            '移除书友圈合并列表 200 条硬渲染上限；其它评论/楼中楼、分类、视频、正文 Provider、角色卡和账号链冻结'
          ]
          sp=Path('sources/novel/qidian-next/qidian-next-beta.json')
          raw=sp.read_bytes(); sha=hashlib.sha256(raw).hexdigest()
          source_doc=json.loads(raw.decode('utf-8'))
          def find_source(o):
              if isinstance(o,dict):
                  if o.get('bookSourceName')=='🌈 起点增强 · Beta': return o
                  for v in o.values():
                      r=find_source(v)
                      if r:return r
              elif isinstance(o,list):
                  for v in o:
                      r=find_source(v)
                      if r:return r
          src=find_source(source_doc); assert src and 'beta17' in src.get('bookSourceComment','').lower()

          mp=Path('manifest.json'); man=json.loads(mp.read_text(encoding='utf-8')); man['updatedAt']=TS
          e=next(x for x in man['sources'] if x.get('id')=='qidian-next-beta')
          e.update({'version':VER,'versionCode':VC,'updatedAt':TS,'sourceUrl':f'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}','summary':summary,'tags':tags,'changelog':changes,'sha256':sha})
          mp.write_text(json.dumps(man,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          cp=Path('subscription/beta.json'); cat=json.loads(cp.read_text(encoding='utf-8')); cat['updatedAt']=TS; cat['generatedAt']=TS
          ce=next(x for x in cat['items'] if x.get('id')=='qidian-next-beta')
          ce.update({'summary':summary,'version':VER,'updatedAt':DATE,'tags':tags,'changelog':changes,
                     'sourceUrl':f'https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}',
                     'backupUrl':f'https://cdn.jsdelivr.net/gh/huoguotiankong/source-core-8d7@main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}',
                     'importUrl':f'legado://import/importonline?src=https://raw.githubusercontent.com/huoguotiankong/source-core-8d7/main/sources/novel/qidian-next/qidian-next-beta.json?v={VC}'})
          cp.write_text(json.dumps(cat,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          bp=Path('bundles/all-beta.json'); bundle=json.loads(bp.read_text(encoding='utf-8'))
          count=0
          def repl(o):
              global count
              if isinstance(o,list):
                  for i,v in enumerate(o):
                      if isinstance(v,dict) and v.get('bookSourceName')=='🌈 起点增强 · Beta': o[i]=src; count+=1
                      else: repl(v)
              elif isinstance(o,dict):
                  for k,v in list(o.items()):
                      if isinstance(v,dict) and v.get('bookSourceName')=='🌈 起点增强 · Beta': o[k]=src; count+=1
                      else: repl(v)
          repl(bundle); assert count>=1, 'beta source not found in all-beta bundle'
          bp.write_text(json.dumps(bundle,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          rp=Path('docs/RELEASE_LOG.md'); old=rp.read_text(encoding='utf-8')
          head='## 2026-08-28 — 起点增强 1.1.0-beta17\n\n'
          if head not in old:
              entry=head+'Status: Beta/Test; circle detail-tap and continuous-pagination repair awaiting real-device confirmation.\n\nChanges:\n\n'+''.join('- '+x+'\n' for x in changes)+f'- SHA256: `{sha}`.\n\n'
              rp.write_text(entry+old,encoding='utf-8')
          print('bundle replacements',count)
          print('source sha256',sha)
          PY
          git diff --check
          git status --short
      - name: Commit metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m "chore(qidian): publish beta17 metadata"
          git push origin main
