name: diag-qidian-circle

on:
  push:
    paths:
      - '.staging/diag-qidian-circle.trigger'

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract current circle module
        shell: bash
        run: |
          python - <<'PY'
          import json,re,base64,gzip
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json')
          doc=json.loads(p.read_text(encoding='utf-8'))
          def find(o):
              if isinstance(o,dict):
                  if o.get('bookSourceName')=='🌈 起点增强 · Beta': return o
                  for v in o.values():
                      r=find(v)
                      if r:return r
              if isinstance(o,list):
                  for v in o:
                      r=find(v)
                      if r:return r
          src=find(doc); assert src
          js=src.get('jsLib','')
          print('COMMENT:',src.get('bookSourceComment',''))
          pats=[r'"circle"\s*:\s*"gz:([A-Za-z0-9+/=]+)"',r'circle\\?"\s*:\s*\\?"gz:([A-Za-z0-9+/=]+)']
          b64=None
          for pat in pats:
              m=re.search(pat,js)
              if m: b64=m.group(1); break
          assert b64, 'circle payload not found'
          code=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          print('CIRCLE_CODE_LEN',len(code))
          keys=['qfCircleHtml2964','qfCircleApiCall2970','qfCircleApiHtml2970','qfCircleApiProbe2970','qfCircleExtractPosts2970','getpostlist','getpostdetail','loadMore','下一页','pageIndex','pageNum','pageSize','data-post-id','查看详情']
          for key in keys:
              print('\n===== KEY',key,'=====')
              starts=[m.start() for m in re.finditer(re.escape(key),code,re.I)]
              print('MATCHES',len(starts))
              for i,s in enumerate(starts[:8]):
                  a=max(0,s-2200); b=min(len(code),s+5000)
                  print(f'--- {key} #{i+1} @{s} ---')
                  print(code[a:b])
          PY
