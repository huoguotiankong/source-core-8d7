name: diag-qidian-x-small
on:
  push:
    paths:
      - '.staging/diag-qidian-x-small.trigger'
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract exact X integration anchors
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          a=json.loads(Path('sources/novel/qidian-next/qidian-next-beta.json').read_text())
          s=a[0] if isinstance(a,list) else a
          lib=s['jsLib']
          out=[]
          for token in ['limited_tr','同人','限免自动','QF_MOD38_EXPORTS','QF_MOD38_DEPS']:
              out.append('\n### '+token)
              for m in list(re.finditer(re.escape(token),lib))[:15]:
                  out.append(lib[max(0,m.start()-1200):m.start()+2600])
          Path('.staging/qidian-x-small.txt').write_text('\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .staging/qidian-x-small.txt
          git commit -m 'chore: qidian x integration anchors'
          git push origin main
