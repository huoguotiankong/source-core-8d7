name: patch-qidian-127b5-review-reference-profile
on:
  push:
    paths:
      - '.staging/patch_qidian_127b5_review_reference_profile.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build qidian-next 1.2.7-beta5
        run: python3 .staging/patch_qidian_127b5_review_reference_profile.py
      - name: Syntax check unpacked review module
        run: node --check .staging/qidian-127b5-review-check.js
      - name: Verify reference Reader profile
        run: |
          grep -Fq '7.9.378' .staging/qidian-127b5-review-check.js
          grep -Fq 'RMX3366' .staging/qidian-127b5-review-check.js
          grep -Fq 'realme' .staging/qidian-127b5-review-check.js
          grep -Fq "raw.Content||raw.content" .staging/qidian-127b5-review-check.js
      - name: Commit generated Beta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/novel/qidian-next/qidian-next-beta.json manifest.json subscription/beta.json subscription/novel.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md .staging/qidian-127b5-report.json .staging/qidian-127b5-review-check.js
          git diff --cached --quiet && exit 0
          git commit -m "qidian beta: use reference Reader profile for comments"
          git push origin HEAD:main
