name: patch-qidian-beta121b5-runner
on:
  push:
    paths:
      - '.staging/patch-qidian-beta121b5-runner.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Beta5 module Base64URL hotfix
        run: python3 .staging/patch_qidian_beta121b5_module_base64.py
      - name: Validate and publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sources/novel/qidian-next/qidian-next-beta.json subscription/beta.json subscription/novel.json manifest.json bundles/all-beta.json rss/data/details/beta/qidian-next.json docs/RELEASE_LOG.md docs/sources/qidian-next/PROJECT_HANDOFF.md
          git diff --cached --check
          git commit -m "fix qidian beta5 url-safe module base64 decode"
          git push origin main
