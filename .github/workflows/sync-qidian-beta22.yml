name: sync-qidian-beta22
on:
  workflow_dispatch:
  push:
    paths:
      - '.staging/sync-qidian-beta22.trigger'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync metadata
        run: python .staging/sync-qidian-beta22.py
      - name: Validate and publish
        run: |
          git diff --check
          python -m json.tool manifest.json >/dev/null
          python -m json.tool subscription/beta.json >/dev/null
          python -m json.tool bundles/all-beta.json >/dev/null
          git diff --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json subscription/beta.json bundles/all-beta.json docs/RELEASE_LOG.md
          git commit -m "release(qidian): publish beta22 rolecard metadata"
          git push origin main
