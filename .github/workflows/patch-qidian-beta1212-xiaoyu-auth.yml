name: patch-qidian-beta1212-xiaoyu-auth
on:
  push:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Inspect qingwu routing
        run: |
          python3 - <<'PY'
          import json,gzip,base64
          s=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'))[0];js=s['jsLib'];st=js.find('{',js.find('QF_MOD38_PACK='));pack,_=json.JSONDecoder().raw_decode(js[st:]);v=pack['review'];raw=v.split(':',1)[1];raw+='='*((4-len(raw)%4)%4);t=gzip.decompress(base64.urlsafe_b64decode(raw)).decode()
          for key in ['actualProvider','qwLocalMode','serverProvider=','qfCommentPolicyV83','qdReviewSummary','chapterPreviewPack']:
            print('\n===== '+key+' =====')
            p=0
            for z in range(8):
              i=t.find(key,p)
              if i<0: break
              print(t[max(0,i-1200):min(len(t),i+2400)].replace('\n',' '));p=i+len(key)
          PY
