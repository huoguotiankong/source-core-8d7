name: patch-qidian-beta1212-xiaoyu-auth
on:
  push:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect review module
        run: |
          python3 - <<'PY'
          import json,gzip,base64
          s=json.load(open('sources/novel/qidian-next/qidian-next-beta.json',encoding='utf-8'))[0];js=s['jsLib'];st=js.find('{',js.find('QF_MOD38_PACK='));pack,_=json.JSONDecoder().raw_decode(js[st:])
          print('keys',list(pack.keys()))
          for k in ['review','review_v410','review_b19']:
            if k not in pack: continue
            v=pack[k]; print('KEY',k,'prefix',repr(v[:40]),'len',len(v))
            for mode in [0,1]:
              try:
                raw=v.split(':',1)[1] if mode and ':' in v[:12] else v; raw+='='*((4-len(raw)%4)%4);t=gzip.decompress(base64.urlsafe_b64decode(raw)).decode();print('decoded',mode,'len',len(t),'qfReviewV410',('qfReviewV410' in t));print(t[:300])
              except Exception as e: print('decode fail',mode,type(e).__name__,str(e)[:120])
          PY
