name: patch-qidian-beta1212-xiaoyu-auth
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch qingwu review routing
        run: |
          python3 - <<'PY'
          import json,gzip,base64
          from pathlib import Path
          p=Path('sources/novel/qidian-next/qidian-next-beta.json');arr=json.loads(p.read_text(encoding='utf-8'));s=arr[0];js=s['jsLib'];st=js.find('{',js.find('QF_MOD38_PACK='));pack,used=json.JSONDecoder().raw_decode(js[st:]);changed=[]
          for k,v in list(pack.items()):
            if not isinstance(v,str) or ':' not in v[:12]: continue
            pref,raw=v.split(':',1);raw+='='*((4-len(raw)%4)%4)
            try:t=gzip.decompress(base64.urlsafe_b64decode(raw)).decode()
            except:continue
            old=t
            for a,b in [('["review_local","xianren","review_server"]','["review_local","xianren","review_server","情无"]'),("['review_local','xianren','review_server']","['review_local','xianren','review_server','情无']"),('["本地","仙人","服务器"]','["本地","仙人","服务器","情无"]'),('var qwPreviewChapter=!!(actualProvider==="情无"&&(qwLocalMode||qwChapterLocal));','var qwPreviewChapter=!!(actualProvider==="情无");')]:t=t.replace(a,b)
            if t!=old:pack[k]=pref+':'+base64.urlsafe_b64encode(gzip.compress(t.encode(),9)).decode().rstrip('=');changed.append(k)
          if not changed:raise SystemExit('no review routing markers patched')
          s['jsLib']=js[:st]+json.dumps(pack,ensure_ascii=False,separators=(',',':'))+js[st+used:];s['bookSourceComment']='v1.2.1-beta4：段评数据源开放“情无/小雨”；情无段评走服务器；章名评论服务器有则使用、无则回退本地；本章说显示前2条真实评论。其它域冻结。';p.write_text(json.dumps(arr,ensure_ascii=False,indent=2),encoding='utf-8')
          rl=Path('docs/RELEASE_LOG.md');rl.write_text('\n## 2026-09-12 · qidian-next `1.2.1-beta4`\n- 段评数据源开放“情无/小雨”服务器路由。\n- 章名评论服务器优先，无数据回退本地。\n- 本章说恢复前 2 条真实评论预览。\n- Stable 不变，其它域冻结。\n'+rl.read_text(encoding='utf-8'),encoding='utf-8')
          print('patched',changed)
          PY
      - name: Commit
        run: |
          python3 -m json.tool sources/novel/qidian-next/qidian-next-beta.json >/dev/null
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add sources/novel/qidian-next/qidian-next-beta.json docs/RELEASE_LOG.md
          git commit -m 'qidian beta4: enable qingwu review routing and previews'
          git push origin HEAD:main
