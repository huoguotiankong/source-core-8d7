name: qidian-beta13-diagnose
on:
  push:
    branches: [main]
    paths:
      - '.staging/qidian-beta13/RUN'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect global source-settings helpers
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          beta=json.loads(pathlib.Path('sources/novel/qidian-next/qidian-next-beta.json').read_text(encoding='utf-8'))[0]
          js=beta.get('jsLib','')
          for term in ['function qfBookInfoOpenSmartSourceV330','qfBookInfoOpenSmartSourceV330','qf_ui_page','source.login','source.getLogin','loginUrl','qfMultiContentV423']:
              print('\nTERM',repr(term))
              start=0;hits=[]
              while True:
                  p=js.find(term,start)
                  if p<0:break
                  hits.append(p);start=p+1
              print('HITS',hits[:20])
              for p in hits[:5]: print(js[max(0,p-3000):min(len(js),p+5500)])
          PY
