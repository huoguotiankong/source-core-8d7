name: qidian-beta13-diagnose
on:
  push:
    branches: [main]
    paths:
      - '.staging/qidian-beta13/RUN'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect qidian beta detail rule recursively
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('sources/novel/qidian-next/qidian-next-beta.json')
          src=json.loads(p.read_text(encoding='utf-8'))[0]
          terms=['⚡ 正文设置','正文设置','作品数据','qf_updateTime_v1112','qfDateCandidateV1111','qfTimeSuspiciousV1111','qfPublishSuspiciousV1111','safeUpdateTime','safePublishDate','首发','上架','更新','qfMultiContentV423','info button']
          printed=0
          def walk(v,path):
              global printed
              if isinstance(v,dict):
                  for k,x in v.items(): walk(x,path+[str(k)])
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,path+[str(i)])
              elif isinstance(v,str):
                  hits=[t for t in terms if t in v]
                  if not hits: return
                  print('\n=== PATH', '.'.join(path), 'LEN', len(v), 'HITS', hits, '===')
                  seen=[]
                  for t in hits:
                      start=0
                      while True:
                          pos=v.find(t,start)
                          if pos<0: break
                          if all(abs(pos-x)>1000 for x in seen):
                              seen.append(pos); printed+=1
                              a=max(0,pos-2400); b=min(len(v),pos+5200)
                              print('\n--- TERM',t,'AT',pos,'---')
                              print(v[a:b])
                              if printed>=10:return
                          start=pos+len(t)
                      if printed>=10:return
          walk(src.get('ruleBookInfo'),['ruleBookInfo'])
          print('\nTOTAL_SNIPPETS',printed)
          PY
