name: qidian-beta13-diagnose
on:
  push:
    branches: [main]
    paths:
      - '.staging/qidian-beta13/RUN'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect update-time guards and proven quick entry
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          beta=json.loads(pathlib.Path('sources/novel/qidian-next/qidian-next-beta.json').read_text(encoding='utf-8'))[0]
          stable=json.loads(pathlib.Path('sources/novel/qidian-next/qidian-next.json').read_text(encoding='utf-8'))[0]
          print('BETA_NAME',beta.get('bookSourceName'))
          print('BETA_COMMENT',beta.get('bookSourceComment'))
          def focus(label,text,terms,radius=4500):
              print('\n========',label,'========')
              for term in terms:
                  p=text.find(term)
                  print('\nTERM',repr(term),'POS',p)
                  if p>=0: print(text[max(0,p-radius):min(len(text),p+radius)])
          br=beta.get('ruleBookInfo','')
          sr=stable.get('ruleBookInfo','')
          focus('BETA RULE TIME',br,['function qfTimeSuspiciousV1111','function qfCurrentBookTimesV1111','qfTimeSuspiciousV1111()','qfDetailOfficialSearchV1109'])
          focus('BETA RULE HELPERS',br,['qfBookInfoOpenCircleV373','qfBookInfoOpenRoleV373','快捷入口','正文设置'])
          focus('STABLE RULE QUICK ENTRY',sr,['快捷入口','正文设置','正文源','qfMultiContent','qfBookInfoOpenCircleV373','qfBookInfoOpenRoleV373'])
          print('\nSTABLE_COMMENT',stable.get('bookSourceComment'))
          PY
