name: qidian-beta13-diagnose
on:
  push:
    branches: [main]
    paths:
      - '.staging/qidian-beta13/RUN'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect login script boundary and content handler
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          src=json.loads(pathlib.Path('sources/novel/qidian-next/qidian-next-beta.json').read_text(encoding='utf-8'))[0]
          v=src.get('loginUrl','')
          print('LOGIN_LEN',len(v))
          print('LOGIN_HEAD_REPR',repr(v[:700]))
          print('LOGIN_TAIL_REPR',repr(v[-1200:]))
          p=v.find('qfMultiContentV423=function')
          print('MULTI_POS',p)
          print(v[max(0,p-1500):min(len(v),p+7000)])
          PY
