name: qidian-beta13-diagnose
on:
  push:
    branches: [main]
    paths:
      - '.staging/qidian-beta13/RUN'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect intro and official detail adapter
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          src=json.loads(pathlib.Path('sources/novel/qidian-next/qidian-next-beta.json').read_text(encoding='utf-8'))[0]
          intro=src.get('ruleBookInfo',{}).get('intro','')
          print('=== INTRO FULL LEN',len(intro),'===')
          print(intro)
          for field in ['jsLib','loginUrl']:
              v=src.get(field,'')
              print('\n===',field,'LEN',len(v),'===')
              for t in ['bookDetailInfo','function qfMultiContentV423','qfMultiContentV423=function','getLoginUrl','reLoginView']:
                  pos=v.find(t)
                  if pos>=0:
                      print('\n---',t,'AT',pos,'---')
                      print(v[max(0,pos-2600):min(len(v),pos+6500)])
          PY
