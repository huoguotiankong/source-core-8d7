name: qidian-beta13-diagnose
on:
  push:
    branches: [main]
    paths:
      - '.staging/qidian-beta13/RUN'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inspect qidian beta detail rules
        shell: bash
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('sources/novel/qidian-next/qidian-next-beta.json')
          src=json.loads(p.read_text(encoding='utf-8'))[0]
          print('BOOK_SOURCE', src.get('bookSourceName'), src.get('bookSourceUrl'))
          for field in ['ruleBookInfo','customButton','loginUrl','jsLib']:
              v=src.get(field,'')
              if not isinstance(v,str):
                  print('FIELD',field,'NONSTRING',type(v).__name__); continue
              print('\n=== FIELD',field,'LEN',len(v),'===')
              terms=['⚡ 正文设置','正文源','作品数据','qf_updateTime_v1112','qfDateCandidateV1111','qfTimeSuspiciousV1111','qfPublishSuspiciousV1111','safeUpdateTime','safePublishDate','首发','上架','更新','qfMultiContentV423']
              seen=[]
              for t in terms:
                  start=0
                  while True:
                      pos=v.find(t,start)
                      if pos<0: break
                      if all(abs(pos-x)>800 for x in seen):
                          seen.append(pos)
                          a=max(0,pos-1800); b=min(len(v),pos+3600)
                          print('\n--- TERM',t,'AT',pos,'---')
                          print(v[a:b])
                      start=pos+len(t)
                  if len(seen)>=12: break
          PY
