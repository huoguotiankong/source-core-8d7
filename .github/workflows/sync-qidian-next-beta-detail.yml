name: sync-qidian-next-beta-detail
on:
  push:
    branches: [main]
    paths:
      - 'subscription/beta.json'
      - 'manifest.json'
      - 'sources/novel/qidian-next/qidian-next-beta.json'
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync Qidian beta detail card
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          sub=json.loads(Path('subscription/beta.json').read_text())
          item=next(x for x in sub.get('items',[]) if x.get('id')=='qidian-next-beta')
          changes=item.get('changelog') or []
          tags=item.get('tags') or []
          sections=[]
          if changes:
              sections.append({'title':'本版更新','text':'；'.join(str(x) for x in changes)})
          sections.append({'title':'版本状态','text':'当前为 Beta / 测试通道，需真机确认后才会晋升正式版。'})
          sections.append({'title':'更新方式','text':'从本订阅页重新导入/更新即可覆盖现有 🌈 起点增强 · Beta。'})
          detail={
              'kind':'source',
              'title':item.get('name') or '🌈 起点增强 · Beta',
              'summary':item.get('summary') or '',
              'badges':['Beta',item.get('version') or ''] + ([tags[2]] if len(tags)>2 else []),
              'sections':sections,
              'sourceUrl':item.get('sourceUrl') or '',
              'backupUrl':item.get('backupUrl') or '',
              'importUrl':item.get('importUrl') or ''
          }
          p=Path('rss/data/details/beta/qidian-next.json')
          old=p.read_text() if p.exists() else ''
          new=json.dumps(detail,ensure_ascii=False,indent=2)+'\n'
          if new!=old:
              p.write_text(new)
          PY
      - name: Commit if changed
        run: |
          if git diff --quiet -- rss/data/details/beta/qidian-next.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rss/data/details/beta/qidian-next.json
          git commit -m 'chore(qidian): sync beta subscription detail card'
          git push origin HEAD:main
